<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생애 관계 지도 · 제로 랩</title>
<style>
html{font-size:18px}
@media(max-width:760px){html{font-size:17px}}
@media(max-width:420px){html{font-size:16px}}
*{box-sizing:border-box}
body{
  margin:0;padding:1.4rem 0;min-height:100vh;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:#1d2433;background-color:#f4f7fb;
  background-image:radial-gradient(#cfd9e8 1.4px, transparent 1.4px);
  background-size:20px 20px;
}
.wrap{width:97%;max-width:1840px;margin:0 auto}
header.lab{margin-bottom:1.1rem}
header.lab h1{font-size:1.6rem;margin:0 0 .35rem;letter-spacing:-.02em}
header.lab p{margin:0;font-size:1rem;color:#53617a;line-height:1.55}
.tabs{display:flex;gap:.5rem;margin:1.1rem 0 .9rem;flex-wrap:wrap}
.tab{
  font:inherit;font-size:1rem;font-weight:700;padding:.65rem 1.1rem;border:2px solid #d3dce9;
  background:#fff;color:#53617a;border-radius:.7rem;cursor:pointer;
  transition:background .18s,color .18s,border-color .18s,filter .18s,transform .08s;
}
.tab:hover{filter:brightness(.97);border-color:#9fb4d4}
.tab:active{transform:translateY(1px) scale(.985)}
.tab.on{background:#2f6df0;border-color:#2f6df0;color:#fff}
.panel{display:none}
.panel.on{display:block}
.grid{display:grid;grid-template-columns:minmax(400px,480px) 1fr;gap:1.1rem;align-items:start}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid #e2e9f4;border-radius:1rem;padding:1.1rem;box-shadow:0 2px 10px rgba(30,50,90,.05)}
.card h2{font-size:1.15rem;margin:0 0 .8rem}
canvas{width:100%;height:auto;display:block;border-radius:.7rem;background:#fbfdff;border:1px solid #e6edf7}
.ctrl{margin:.9rem 0 0}
.ctrl label{display:block;font-size:1rem;font-weight:700;margin-bottom:.3rem}
.ctrl .val{color:#2f6df0}
select,input[type=number],input[type=text]{
  font:inherit;font-size:1rem;width:100%;padding:.6rem .7rem;border:2px solid #d3dce9;border-radius:.6rem;background:#fff;
}
select:hover,input:hover{border-color:#9fb4d4}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;
  touch-action:manipulation;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#dce5f2;border:1px solid #c6d3e6}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;
  background:#2f6df0;border:3px solid #fff;box-shadow:0 1px 5px rgba(30,60,120,.4);
  transition:transform .12s,background .12s;
}
input[type=range]:hover::-webkit-slider-thumb{background:#1d55cc;transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#dce5f2}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#2f6df0;border:3px solid #fff}
input[type=range]:disabled{opacity:.55;cursor:not-allowed}
.btn{
  font:inherit;font-size:1rem;font-weight:700;padding:.7rem 1.1rem;border:none;border-radius:.7rem;
  background:#2f6df0;color:#fff;cursor:pointer;
  transition:filter .18s,transform .08s,box-shadow .18s;box-shadow:0 2px 7px rgba(47,109,240,.3);
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 3px rgba(47,109,240,.3)}
.btn.ghost{background:#eef3fb;color:#2f4a7a;box-shadow:none}
.btn.ghost:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.readout{margin-top:.9rem;padding:.8rem .9rem;background:#f2f6fd;border:1px solid #dbe5f5;border-radius:.7rem;font-size:1rem;line-height:1.6}
.readout b{color:#1d55cc}
.tablebox{max-height:420px;overflow:auto;border:1px solid #e2e9f4;border-radius:.7rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
thead th{position:sticky;top:0;background:#eef3fb;color:#2f4a7a;padding:.6rem .5rem;border-bottom:2px solid #d3dce9;text-align:center;z-index:2}
tbody td{padding:.55rem .5rem;border-bottom:1px solid #edf1f8;text-align:center}
tbody tr:nth-child(even){background:#fafcff}
.empty{padding:1.4rem;text-align:center;color:#7b8aa3;font-size:1rem}
.need{padding:1.8rem 1.2rem;text-align:center;background:#fff6e8;border:2px dashed #f0c48a;border-radius:.9rem;color:#8a5a12;font-size:1.05rem;line-height:1.6}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.note{margin-top:1rem;font-size:.95rem;color:#53617a;line-height:1.6}
.bar{height:16px;border-radius:8px;background:#2f6df0}
.barwrap{background:#e8eef8;border-radius:8px;overflow:hidden;margin:.25rem 0 .6rem}
.tag{display:inline-block;font-size:.85rem;padding:.15rem .5rem;border-radius:.4rem;background:#eef3fb;color:#2f4a7a;margin-right:.3rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="lab">
    <h1>생애 관계 지도</h1>
    <p>관계는 유지되는 게 아니라 갱신됩니다. 역할이 사라질 때 무엇이 함께 사라지는지 계산해 보세요. (6화 · 관계 지도)</p>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabA">🔬 자유 탐구</button>
    <button class="tab" id="tabB">✅ 데이터 확인</button>
  </div>

  <section class="panel on" id="panelA">
    <div class="grid">
      <div class="card">
        <h2>나이에 따른 관계 수</h2>
        <canvas id="cv" width="460" height="380"></canvas>
        <div id="readout" class="readout"></div>
      </div>
      <div class="card">
        <h2>조절하고 관찰하기</h2>
        <div id="controls"><div class="ctrl"><label for="age">지금 나이 <span class="val" id="vA">18</span>세</label><input type="range" id="age" min="18" max="40" step="1" value="18"></div>
<div class="ctrl"><label for="wk">직장 관계 최대 <span class="val" id="vW">25</span>명</label><input type="range" id="wk" min="0" max="60" step="5" value="25"></div>
<div class="ctrl"><label for="rt">은퇴 나이 <span class="val" id="vR">62</span>세</label><input type="range" id="rt" min="55" max="75" step="1" value="62"></div>
<div class="ctrl"><label for="sr">은퇴 후 직장 관계 잔존율 <span class="val" id="vS">10</span>%</label><input type="range" id="sr" min="0" max="60" step="5" value="10"></div>
<div class="ctrl"><label for="cm">역할과 무관한 관계 <span class="val" id="vC">4</span>명</label><input type="range" id="cm" min="0" max="30" step="1" value="4"></div>
<div class="ctrl"><label for="fr">학창 친구 유지율 <span class="val" id="vF">30</span>%</label><input type="range" id="fr" min="5" max="90" step="5" value="30"></div></div>
        <div class="btnrow">
          <button class="btn" id="goBtn">생애 돌려보기</button>
          <button class="btn ghost" id="recBtn">기록하기</button>
          <button class="btn ghost" id="clrBtn">기록 지우기</button>
        </div>
        <div class="tablebox" style="margin-top:1rem">
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="note">계산식: 각 관계는 연간 증감률로 변하고, 직장 관계는 은퇴 시점에 설정한 잔존율만 남습니다. 역할과 무관한 관계(취미·이웃·봉사)는 참여 정도에 따라 유지됩니다.</div>
      </div>
    </div>
  </section>

  <section class="panel" id="panelB">
    <div class="card">
      <h2>내가 모은 데이터로 확인하기</h2>
      <div id="verify"></div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var rows=[];
var LAB=(function(){
var out,c,cvv;
var age=document.getElementById('age'),wk=document.getElementById('wk'),rt=document.getElementById('rt'),sr=document.getElementById('sr'),cm=document.getElementById('cm'),fr=document.getElementById('fr');
function u(id,el){el.oninput=function(){document.getElementById(id).textContent=el.value;draw(1);};}
u('vA',age);u('vW',wk);u('vR',rt);u('vS',sr);u('vC',cm);u('vF',fr);
function at(a){
  var A0=Number(age.value),W=Number(wk.value),R=Number(rt.value),S=Number(sr.value)/100,C=Number(cm.value),F=Number(fr.value)/100;
  var fam=4+((a>=28&&a<=70)?2:0);
  var friend=12*Math.pow(F,Math.min(Math.max(a-20,0)/40,1));
  var work;
  if(a<24)work=0;
  else if(a<R)work=W*Math.min((a-24)/8,1);
  else work=W*S;
  var comm=C*Math.min(Math.max(a-25,0)/25,1)+ (a>=R?C*0.5:0);
  return {fam:fam,friend:friend,work:work,comm:comm,tot:fam+friend+work+comm};
}
function draw(prog){
  c.clearRect(0,0,cvv.width,cvv.height);
  var L=48,R0=cvv.width-16,T=34,B=cvv.height-56;
  var A0=Number(age.value),A1=85;
  var maxY=0;
  for(var a=A0;a<=A1;a++){var v=at(a);if(v.tot>maxY)maxY=v.tot;}
  maxY=Math.max(maxY,10)*1.1;
  c.strokeStyle='#e2e9f4';c.fillStyle='#53617a';c.font='11px sans-serif';c.textAlign='right';
  for(var g=0;g<=4;g++){
    var y=B-(g/4)*(B-T);
    c.beginPath();c.moveTo(L,y);c.lineTo(R0,y);c.stroke();
    c.fillText((maxY*g/4).toFixed(0),L-5,y+4);
  }
  var keys=['fam','friend','work','comm'];
  var cols=['#6ab98a','#4aa3c7','#2f6df0','#9a7cd8'];
  var end=A0+(A1-A0)*prog;
  for(var a2=A0;a2<=end;a2+=0.5){
    var v2=at(a2),acc=0;
    var x=L+((a2-A0)/(A1-A0))*(R0-L);
    for(var k=0;k<4;k++){
      var hgt=(v2[keys[k]]/maxY)*(B-T);
      c.fillStyle=cols[k];
      c.fillRect(x,B-acc-hgt,Math.max(1.6,(R0-L)/((A1-A0)*2)),hgt);
      acc+=hgt;
    }
  }
  var rx=L+((Number(rt.value)-A0)/(A1-A0))*(R0-L);
  c.strokeStyle='#e05c6e';c.setLineDash([6,4]);c.lineWidth=2;
  c.beginPath();c.moveTo(rx,T-6);c.lineTo(rx,B);c.stroke();c.setLineDash([]);
  c.fillStyle='#e05c6e';c.font='bold 11px sans-serif';c.textAlign='center';
  c.fillText('은퇴 '+rt.value+'세',rx,T-10);
  c.fillStyle='#53617a';c.font='11px sans-serif';
  for(var s=A0;s<=A1;s+=Math.max(10,Math.round((A1-A0)/6/5)*5))c.fillText(s+'세',L+((s-A0)/(A1-A0))*(R0-L),B+16);
  c.textAlign='left';c.font='11px sans-serif';
  var names=['가족','친구','직장','공동체'];
  for(var q=0;q<4;q++){
    c.fillStyle=cols[q];c.fillRect(L+q*72,B+30,11,11);
    c.fillStyle='#1d2433';c.fillText(names[q],L+q*72+15,B+40);
  }
  var before=at(Number(rt.value)-1),after=at(Number(rt.value)+1);
  c.textAlign='right';c.fillStyle='#1d2433';c.font='bold 13px sans-serif';
  c.fillText('은퇴 전후 '+before.tot.toFixed(0)+' → '+after.tot.toFixed(0),R0,T+2);
}
return {
  columns:['은퇴','잔존율','공동체','친구 유지','은퇴 전','은퇴 후','감소율'],
  init:function(ctx2,canvas,readout){c=ctx2;cvv=canvas;out=readout;draw(1);
    out.innerHTML='조건을 정하고 <b>생애 돌려보기</b>를 눌러 관계 수의 변화를 보세요.';},
  run:function(done){
    var t=0,iv=setInterval(function(){t++;draw(Math.min(t/34,1));
      if(t>=34){clearInterval(iv);
        var b=at(Number(rt.value)-1),a2=at(Number(rt.value)+1);
        var dr=(1-a2.tot/b.tot)*100;
        out.innerHTML='은퇴 전후 관계 수 <b>'+b.tot.toFixed(0)+' → '+a2.tot.toFixed(0)+'</b> ('+(dr>=0?dr.toFixed(0)+'% 감소':(-dr).toFixed(0)+'% 증가')+')';
        done();}},26);
  },
  record:function(){
    var b=at(Number(rt.value)-1),a2=at(Number(rt.value)+1);
    return {cells:[rt.value,sr.value+'%',cm.value,fr.value+'%',b.tot.toFixed(0),a2.tot.toFixed(0),((1-a2.tot/b.tot)*100).toFixed(0)+'%'],
            raw:{rt:Number(rt.value),sr:Number(sr.value),cm:Number(cm.value),fr:Number(fr.value),
                 before:b.tot,after:a2.tot,drop:1-a2.tot/b.tot,comm:a2.comm}};
  },
  verify:function(rs){
    var mx=0,lowC=null,highC=null;
    for(var i=0;i<rs.length;i++){
      if(Math.abs(rs[i].raw.drop)>mx)mx=Math.abs(rs[i].raw.drop);
      if(!lowC||rs[i].raw.cm<lowC.cm)lowC=rs[i].raw;
      if(!highC||rs[i].raw.cm>highC.cm)highC=rs[i].raw;
    }
    var h='<div class="vgrid"><div><h3>은퇴 시 관계 감소율</h3>';
    for(var j=0;j<rs.length;j++){
      var r=rs[j].raw;
      h+='<div style="font-size:.95rem">공동체 '+r.cm+'명 · 잔존율 '+r.sr+'% → '+(r.drop>=0?(r.drop*100).toFixed(0)+'% 감소':(-r.drop*100).toFixed(0)+'% 증가')+' ('+r.before.toFixed(0)+'→'+r.after.toFixed(0)+')</div>'+
         '<div class="barwrap"><div class="bar" style="width:'+(mx?Math.abs(r.drop)/mx*100:0)+'%;background:'+(r.drop>0.4?'#e05c6e':(r.drop<0?'#4aa3c7':'#6ab98a'))+'"></div></div>';
    }
    h+='</div><div><h3>읽어 내기</h3>';
    if(lowC&&highC&&lowC.cm!==highC.cm){
      h+='<p style="font-size:1.03rem;line-height:1.85">역할과 무관한 관계를 '+lowC.cm+'명에서 '+highC.cm+'명으로 늘렸을 때 '+
         '감소율은 <b>'+(lowC.drop*100).toFixed(0)+'% → '+(highC.drop*100).toFixed(0)+'%</b>로 바뀌었습니다.</p>';
    }
    h+='<p style="font-size:1.03rem;line-height:1.85">직장 관계는 <b>역할에 묶여 있어</b> 은퇴와 함께 한꺼번에 사라집니다. '+
       '학창 친구는 서서히 줄지만 일부가 오래 남고, 취미·이웃·봉사처럼 역할과 무관한 관계는 은퇴 뒤에도 유지됩니다.</p>'+
       '<ol style="font-size:1rem;line-height:1.9;padding-left:1.2rem">'+
       '<li>은퇴 시 잔존율을 10%에서 40%로 올리려면 재직 중에 무엇을 해 두어야 할까요?</li>'+
       '<li>노년 준비에서 \'역할과 무관한 관계\'를 미리 만들어 두라는 조언의 근거를 이 그래프로 설명해 보세요.</li>'+
       '<li>전 구간에 공통으로 들어가야 하는 한 칸은 무엇이었나요?</li>'+
       '<li>1~5화의 내용을 이 지도 위 구간에 각각 배치해 보세요.</li></ol>'+
       '<p style="font-size:1.03rem;line-height:1.85">이 곡선은 <b>모형</b>입니다. 값은 여러분이 넣은 가정에서 나온 결과입니다.</p></div></div>'+
       '<div class="note">관계는 유지되는 게 아니라 갱신됩니다. 끊긴 자리에 무엇을 새로 이을지가 설계입니다.</div>';
    return h;
  }
};
})();

/* ---------- 탭 ---------- */
var tabA=document.getElementById('tabA'),tabB=document.getElementById('tabB');
var panelA=document.getElementById('panelA'),panelB=document.getElementById('panelB');
tabA.onclick=function(){tabA.classList.add('on');tabB.classList.remove('on');panelA.classList.add('on');panelB.classList.remove('on');};
tabB.onclick=function(){tabB.classList.add('on');tabA.classList.remove('on');panelB.classList.add('on');panelA.classList.remove('on');renderVerify();};

/* ---------- 표 ---------- */
var thead=document.getElementById('thead'),tbody=document.getElementById('tbody');
(function(){
  var h='';
  for(var i=0;i<LAB.columns.length;i++){h+='<th>'+LAB.columns[i]+'</th>';}
  thead.innerHTML=h;
})();
function renderTable(){
  if(rows.length===0){
    tbody.innerHTML='<tr><td class="empty" colspan="'+LAB.columns.length+'">아직 기록이 없어요. 조건을 바꿔 보고 <b>기록하기</b>를 눌러 주세요.</td></tr>';
    return;
  }
  var h='';
  for(var i=0;i<rows.length;i++){
    h+='<tr>';
    for(var j=0;j<rows[i].cells.length;j++){h+='<td>'+rows[i].cells[j]+'</td>';}
    h+='</tr>';
  }
  tbody.innerHTML=h;
}

/* ---------- 버튼 ---------- */
var goBtn=document.getElementById('goBtn');
var recBtn=document.getElementById('recBtn');
var clrBtn=document.getElementById('clrBtn');
var busy=false;
function lockControls(on){
  var el=document.querySelectorAll('#controls input, #controls select');
  for(var i=0;i<el.length;i++){el[i].disabled=on;}
  goBtn.disabled=on;recBtn.disabled=on;
}
goBtn.onclick=function(){
  if(busy)return;
  cv.scrollIntoView({behavior:'smooth',block:'center'});
  busy=true;lockControls(true);
  LAB.run(function(){busy=false;lockControls(false);});
};
recBtn.onclick=function(){
  var r=LAB.record();
  if(!r)return;
  rows.push(r);renderTable();
};
clrBtn.onclick=function(){rows=[];renderTable();renderVerify();};

/* ---------- 데이터 확인 ---------- */
function renderVerify(){
  var box=document.getElementById('verify');
  if(rows.length<4){
    box.innerHTML='<div class="need"><b>데이터 부족</b><br>기록이 <b>'+rows.length+'개</b>입니다. 조건을 바꿔 가며 <b>4개 이상</b> 기록하면 여기에서 내 데이터를 분석해 볼 수 있어요.</div>';
    return;
  }
  box.innerHTML=LAB.verify(rows);
}

/* ---------- 시작 ---------- */
LAB.init(ctx,cv,document.getElementById('readout'));
renderTable();renderVerify();
})();
</script>

.fx-note-cta a{display:inline-block;background:#173238;color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:10px;white-space:nowrap}

</style>
<script>
(function(){
  var href='../notes/highTechHome/high_tg_s3_06_relation_map.html';
  var ok=function(el){ return el && !/^(BUTTON|A|INPUT|NAV)$/.test(el.tagName) ? el : null; };
  var host=ok(document.getElementById('validationContent'))||ok(document.getElementById('verifyContent'))||ok(document.getElementById('verifyTab'))
    ||ok(document.getElementById('panel-verify'))||ok(document.getElementById('panel-validate'))||ok(document.getElementById('verifyBody'))
    ||ok(document.querySelector('#tab-validate .card, #tab-validate, #tab-verify .card, #tab-verify'))
    ||ok(document.querySelector('section#verify, section#validate, #verify.panel, #validate.panel'))
    ||ok(document.querySelector('#paneB .card, #paneB'))
