<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도플러 효과 | 고3 역학과 에너지</title>
<style>
:root{
  --ink:#1E2833; --sub:#4A5868; --line:#D4DCE5; --paper:#FFFFFF; --bg:#EEF2F6; --dot:#C3CDD9;
  --pri:#2B5FA3; --pri-d:#1F4B85; --pri-soft:rgba(43,95,163,.16);
  --ep:#3867B0; --ek:#E08A2E; --heat:#C8463D;
}
html{font-size:21px}
@media (max-width:760px){html{font-size:20px}}
@media (max-width:420px){html{font-size:19px}}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-size:1rem; line-height:1.55; word-break:keep-all; overflow-wrap:anywhere;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.4px);
  background-size:22px 22px;
}
.container{width:97%; max-width:1840px; margin:0 auto; padding:1.2rem 0 2.5rem}
header h1{font-size:1.6rem; margin:0 0 .35rem; letter-spacing:-.01em; line-height:1.3}
header p{margin:0; color:var(--sub); max-width:62ch}

/* 탭 */
.tabs{display:flex; gap:.5rem; margin:1.1rem 0 1rem; flex-wrap:wrap}
.tab{
  font:inherit; font-weight:700; padding:.55rem 1.1rem; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--sub);
  transition:background .18s, color .18s, border-color .18s, transform .12s, filter .18s;
}
.tab:hover{border-color:var(--pri); color:var(--pri); transform:translateY(-1px)}
.tab:active{transform:translateY(1px) scale(.98)}
.tab[aria-selected="true"]{background:var(--pri); border-color:var(--pri); color:#fff}
.tab[aria-selected="true"]:hover{filter:brightness(1.08); color:#fff}
.panel[hidden]{display:none}

/* 레이아웃 */
.lab{display:grid; grid-template-columns:minmax(400px,480px) minmax(0,1fr); gap:1rem; align-items:start}
@media (max-width:640px){.lab{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:1rem}
.card + .card{margin-top:1rem}
.card h2{font-size:1.15rem; margin:0 0 .6rem; line-height:1.35}
.note{color:var(--sub); font-size:.95rem; margin:.6rem 0 0}

#scene{width:100%; height:320px; display:block; border-radius:10px; background:#F7F9FC}

/* 에너지 막대 */
.ebar{display:flex; height:30px; border-radius:8px; overflow:hidden; background:#E6EBF1; margin-top:.8rem}
.ebar div{height:100%; transition:none}
.ebar .ep{background:var(--ep)} .ebar .ek{background:var(--ek)} .ebar .ht{background:var(--heat)}
.elegend{display:grid; grid-template-columns:repeat(3,1fr); gap:.3rem; margin-top:.45rem; font-size:.95rem}
.elegend > span{display:flex; align-items:flex-start; gap:.35rem; line-height:1.3}
.elegend > span > span{display:block}
.elegend i{width:14px; height:14px; border-radius:3px; flex:none; margin-top:.2rem}
.elegend b{display:block; font-variant-numeric:tabular-nums}

/* 조작부 */
.ctrl{margin-bottom:.75rem}
.ctrl .row{display:flex; justify-content:space-between; align-items:baseline}
.ctrl .val{font-weight:700; color:var(--pri); font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:30px; margin:0;
  background:transparent; cursor:pointer; touch-action:manipulation; --p:50%;
}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible{outline:3px solid var(--pri-soft); outline-offset:2px; border-radius:6px}
input[type=range]::-webkit-slider-runnable-track{
  height:8px; border-radius:4px;
  background:linear-gradient(to right, var(--pri) var(--p), #D5DDE6 var(--p));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:24px; height:24px; border-radius:50%; margin-top:-8px;
  background:#fff; border:3px solid var(--pri); transition:transform .15s, box-shadow .15s;
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12); box-shadow:0 0 0 6px var(--pri-soft)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22); box-shadow:0 0 0 9px var(--pri-soft)}
input[type=range]::-moz-range-track{height:8px; border-radius:4px; background:#D5DDE6}
input[type=range]::-moz-range-progress{height:8px; border-radius:4px; background:var(--pri)}
input[type=range]::-moz-range-thumb{
  box-sizing:border-box; width:24px; height:24px; border-radius:50%;
  background:#fff; border:3px solid var(--pri); transition:transform .15s, box-shadow .15s;
}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12); box-shadow:0 0 0 6px var(--pri-soft)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22); box-shadow:0 0 0 9px var(--pri-soft)}
input[type=range]:disabled{cursor:not-allowed; opacity:.45}
input[type=range]:disabled::-webkit-slider-thumb{transform:none; box-shadow:none}

.seg{display:grid; grid-template-columns:1fr 1fr; gap:.45rem}
.seg button{
  font:inherit; font-size:.95rem; text-align:left; line-height:1.3; padding:.5rem .6rem; cursor:pointer;
  border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  transition:border-color .18s, background .18s, transform .12s;
}
.seg button small{display:block; color:var(--sub); font-size:.95rem; font-variant-numeric:tabular-nums}
.seg button:hover:not(:disabled){border-color:var(--pri); transform:translateY(-1px)}
.seg button:active:not(:disabled){transform:translateY(1px) scale(.98)}
.seg button[aria-pressed="true"]{border-color:var(--pri); background:#EAF1FA}
.seg button:disabled{cursor:not-allowed; opacity:.5}

.actions{display:flex; gap:.6rem; margin-top:1rem; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:700; padding:.65rem 1.2rem; border-radius:12px; cursor:pointer;
  border:2px solid var(--pri); background:var(--pri); color:#fff;
  transition:filter .18s, transform .12s, background .18s, color .18s, opacity .18s;
}
.btn:hover:not(:disabled){filter:brightness(1.1); transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.97)}
.btn.ghost{background:#fff; color:var(--pri)}
.btn.ghost:hover:not(:disabled){background:#EAF1FA; filter:none}
.btn.warn{background:#fff; color:#A33A32; border-color:#E0B4AF}
.btn.warn:hover:not(:disabled){background:#FBEDEB; filter:none}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible{outline:3px solid var(--pri-soft); outline-offset:2px}

/* 측정 결과 */
.stats{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.5rem .9rem; margin:0}
.stats div{border-left:4px solid var(--line); padding:.15rem 0 .15rem .6rem}
.stats dt{color:var(--sub); font-size:.95rem}
.stats dd{margin:0; font-weight:700; font-size:1.15rem; font-variant-numeric:tabular-nums}
.stats .c-ep{border-color:var(--ep)} .stats .c-ek{border-color:var(--ek)} .stats .c-ht{border-color:var(--heat)}
.msg{padding:.7rem .9rem; border-radius:10px; background:#F3F6FA; color:var(--sub); margin:0}
.msg.stop{background:#FBEFE3; color:#8A4B12}

/* 기록 표 */
.tablewrap{max-height:430px; overflow:auto; border:1px solid var(--line); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:.95rem; font-variant-numeric:tabular-nums}
th,td{padding:.4rem .6rem; text-align:right; white-space:nowrap; border-bottom:1px solid #E8EDF2}
th{position:sticky; top:0; background:#E9EFF6; z-index:1; font-weight:700}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:hover{background:#F5F8FB}
.empty td{text-align:center; color:var(--sub); padding:1.2rem}
.dotc{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:.35rem; vertical-align:-1px}

/* 데이터 검증 */
.vgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
@media (max-width:640px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.vgrid .card + .card{margin-top:0}
.chart{width:100%; height:300px; display:block}
.legend{display:flex; flex-wrap:wrap; gap:.4rem 1rem; font-size:.95rem; margin:0 0 1rem}
.legend span{display:flex; align-items:center}
.readout{margin:.6rem 0 0; padding:0; list-style:none}
.readout li{padding:.2rem 0; font-variant-numeric:tabular-nums}
.ask{margin:.6rem 0 0; color:var(--sub); font-size:.95rem}
.shortage{text-align:center; padding:2.2rem 1rem}
.shortage strong{display:block; font-size:1.3rem; margin-bottom:.4rem}
.mtable{margin-top:.6rem}
.mtable table{font-size:.95rem}
.mtable h3{font-size:1rem; margin:.8rem 0 .3rem}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.c4 button{text-align:center; padding:.5rem .3rem}
.center td,.center th{text-align:center !important}
.inlegend{display:flex; flex-wrap:wrap; gap:.3rem 1rem; font-size:.95rem; margin:0 0 .4rem}
.inlegend span{display:flex; align-items:center}
.gap-top{margin-top:.6rem}
.wrap td{white-space:normal; text-align:left !important}
.hbars{display:grid; gap:.5rem; margin:.4rem 0}
.hb{display:grid; grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto; gap:.6rem; align-items:center}
.hb .ht{height:18px; background:#E6EBF1; border-radius:6px; overflow:hidden}
.hb .ht i{display:block; height:100%}
.hb b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>도플러 효과</h1>
    <p>구급차가 지나갈 때 소리의 높이가 달라지는 것을 들어 본 적이 있을 것입니다. 이번에는 음원과 관찰자가 움직일 때 들리는 진동수가 얼마나 달라지는지 계산합니다.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-explore" aria-selected="true" aria-controls="panel-explore">🔬 자유 탐구</button>
    <button class="tab" role="tab" id="tab-verify" aria-selected="false" aria-controls="panel-verify">✅ 데이터 검증</button>
  </div>

  <section class="panel" id="panel-explore" role="tabpanel">
    <div class="lab">
      <div>
        <div class="card">
          <canvas id="scene" aria-label="도플러 효과 실험 장면"></canvas>
          <p class="note">음속은 343 m/s입니다. 음원 속력이 음속에 가까워지면 앞쪽 파면이 겹쳐 충격파가 생깁니다.</p>
        </div>
        <div class="card">
          <div id="controls"></div>
          <div class="actions">
            <button class="btn" id="runBtn">들어 보기</button>
            <button class="btn ghost" id="recBtn" disabled>기록하기</button>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2>측정 결과</h2>
          <div id="result"></div>
        </div>
        <div class="card">
          <h2>기록한 데이터 <span id="recCount" style="color:var(--sub);font-weight:400"></span></h2>
          <div class="tablewrap">
            <table><thead><tr id="recHead"></tr></thead><tbody id="recBody"></tbody></table>
          </div>
          <div class="actions"><button class="btn warn" id="clearBtn" disabled>기록 모두 지우기</button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-verify" role="tabpanel" hidden>
    <div id="verifyBody"></div>
  </section>
</div>

<script>
(function(){
'use strict';
/* ================= 공통 도구 ================= */
var FONT = 'Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
var ANIM_MS = 2400;
var PAL = ['#2B5FA3', '#2E9E78', '#A8702F', '#7657B3', '#C8463D', '#3A8FB7', '#D98E04', '#5C6B7A'];
var $ = function(id){ return document.getElementById(id); };
function f(x, d){ var s = x.toFixed(d); if (/^-0\.?0*$/.test(s)) s = s.slice(1); return s.replace('-', '−'); }
function sgn(x, d){ var s = f(x, d); return (x > 0 && /[1-9]/.test(s) ? '+' : '') + s; }
function decOf(step){ for (var d = 0; d < 4; d++){ var s = step * Math.pow(10, d); if (Math.abs(s - Math.round(s)) < 1e-6) return d; } return 4; }
function fitCanvas(cv){
  var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {c:c, W:W, H:H};
}
function niceStep(raw){
  var mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
}
function axisFrom(lo, hi){
  if (hi - lo <= 0) hi = lo + 1;
  var step = niceStep((hi - lo) / 4);
  return {lo:Math.floor(lo / step + 1e-9) * step, hi:Math.ceil(hi / step - 1e-9) * step, step:step};
}
function txt(c, s, x, y, o){
  o = o || {}; c.font = (o.bold ? '700 ' : '') + '18px ' + FONT; c.fillStyle = o.color || '#1E2833';
  c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'alphabetic'; c.fillText(s, x, y);
}
function seg(c, x1, y1, x2, y2, color, w, dash){ c.strokeStyle = color || '#1E2833'; c.lineWidth = w || 1.5; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); }
function meter(c, x, y, w, s){
  c.fillStyle = '#26313D'; c.fillRect(x, y, w, 34);
  txt(c, s, x + w - 10, y + 18, {bold:true, color:'#7CF0B0', align:'right', base:'middle'});
}
function arrow(c, x1, y1, x2, y2, color, lw){
  var a = Math.atan2(y2 - y1, x2 - x1), h = 9;
  c.strokeStyle = color; c.fillStyle = color; c.lineWidth = lw || 2;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - h * Math.cos(a - 0.4), y2 - h * Math.sin(a - 0.4)); c.lineTo(x2 - h * Math.cos(a + 0.4), y2 - h * Math.sin(a + 0.4)); c.closePath(); c.fill();
}
function nmColor(nm){
  var r = 0, g = 0, b = 0;
  if (nm < 440){ r = -(nm - 440) / 60; b = 1; } else if (nm < 490){ g = (nm - 440) / 50; b = 1; }
  else if (nm < 510){ g = 1; b = -(nm - 510) / 20; } else if (nm < 580){ r = (nm - 510) / 70; g = 1; }
  else if (nm < 645){ r = 1; g = -(nm - 645) / 65; } else { r = 1; }
  var fct = nm < 420 ? 0.4 + 0.6 * (nm - 380) / 40 : nm > 700 ? 0.4 + 0.6 * (780 - nm) / 80 : 1;
  return [r, g, b].map(function(v){ return Math.round(255 * Math.pow(Math.max(0, v) * fct, 0.8)); });
}
function mean(a){ return a.reduce(function(s, x){ return s + x; }, 0) / a.length; }
function dot(color){ return '<span class="dotc" style="background:' + color + '"></span>'; }
function legend(items){ return '<div class="inlegend">' + items.map(function(it){ return '<span>' + dot(it.color) + it.label + '</span>'; }).join('') + '</div>'; }
function distinct(arr){ var o = {}; arr.forEach(function(v){ o[v] = 1; }); return Object.keys(o).length; }
function fit0(pts){ var n = 0, d = 0; pts.forEach(function(p){ n += p.x * p.y; d += p.x * p.x; }); return n / d; }
function linfit(pts){
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(function(p){ sx += p.x; sy += p.y; sxx += p.x * p.x; sxy += p.x * p.y; });
  var k = (n * sxy - sx * sy) / (n * sxx - sx * sx); return {k:k, b:(sy - k * sx) / n};
}
function groupBy(arr, keyFn){ var g = {}; arr.forEach(function(d){ var k = keyFn(d); (g[k] = g[k] || []).push(d); }); return g; }
function card(title, inner){ return '<div class="card"><h2>' + title + '</h2>' + inner + '</div>'; }
function tableHTML(head, rows, cls){
  return '<div class="tablewrap' + (cls ? ' ' + cls : '') + '"><table><thead><tr>' + head.map(function(h){ return '<th>' + h + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(function(r){ return '<tr>' + r.map(function(x){ return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
/* 산점도: series [{color, pts:[{x,y}], hollow}], lines [{k,b,from,to,color,dash} | {h,color,dash}] */
function drawScatter(cv, opt){
  var o = fitCanvas(cv), c = o.c, W = o.W, H = o.H;
  if (!W) return;
  var padL = 78, padR = 18, padT = 14, padB = 62, xs = [], ys = [];
  opt.series.forEach(function(s){ s.pts.forEach(function(p){ xs.push(p.x); ys.push(p.y); }); });
  (opt.lines || []).forEach(function(l){ if (l.h != null) ys.push(l.h); });
  if (!xs.length){ xs = [1]; ys = [1]; }
  var head = opt.yHead || 1.08;
  var xl = Math.min(0, Math.min.apply(null, xs)), xh = Math.max(0, Math.max.apply(null, xs));
  var yl = Math.min(0, Math.min.apply(null, ys)), yh = Math.max(0, Math.max.apply(null, ys));
  if (opt.square){ xl = yl = Math.min(xl, yl); xh = yh = Math.max(xh, yh); }
  var ax = axisFrom(xl * 1.08, xh * 1.08), ay = opt.square ? ax : axisFrom(yl * head, yh * head);
  if (opt.xHi != null){ ax = {lo:0, hi:opt.xHi, step:opt.xStep || niceStep(opt.xHi / 4)}; }
  if (opt.tightX){ var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), px = (x1 - x0) * 0.1 || 1; ax = axisFrom(x0 - px, x1 + px); }
  if (opt.tightY){ var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys), py = (y1 - y0) * 0.15 || 0.5; ay = axisFrom(y0 - py, y1 + py); }
  var pw = W - padL - padR, ph = H - padT - padB;
  var X = function(x){ return padL + (x - ax.lo) / (ax.hi - ax.lo) * pw; };
  var Y = function(y){ return padT + ph - (y - ay.lo) / (ay.hi - ay.lo) * ph; };
  c.clearRect(0, 0, W, H); c.font = '18px ' + FONT;
  c.strokeStyle = '#E3E8EE'; c.lineWidth = 1; c.fillStyle = '#4A5868';
  var i, v, nx = Math.round((ax.hi - ax.lo) / ax.step), ny = Math.round((ay.hi - ay.lo) / ay.step);
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (i = 0; i <= nx; i++){ v = ax.lo + i * ax.step; c.beginPath(); c.moveTo(X(v), padT); c.lineTo(X(v), padT + ph); c.stroke(); c.fillText(f(v, decOf(ax.step)), X(v), padT + ph + 6); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (i = 0; i <= ny; i++){ v = ay.lo + i * ay.step; c.beginPath(); c.moveTo(padL, Y(v)); c.lineTo(padL + pw, Y(v)); c.stroke(); c.fillText(f(v, decOf(ay.step)), padL - 8, Y(v)); }
  c.strokeStyle = '#8C99A8'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(padL, padT); c.lineTo(padL, padT + ph); c.lineTo(padL + pw, padT + ph); c.stroke();
  if (ay.lo < 0){ c.beginPath(); c.moveTo(padL, Y(0)); c.lineTo(padL + pw, Y(0)); c.stroke(); }
  if (ax.lo < 0){ c.beginPath(); c.moveTo(X(0), padT); c.lineTo(X(0), padT + ph); c.stroke(); }
  c.fillStyle = '#1E2833'; c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillText(opt.xLabel, padL + pw / 2, H - 4);
  c.save(); c.translate(18, padT + ph / 2); c.rotate(-Math.PI / 2); c.textBaseline = 'middle'; c.fillText(opt.yLabel, 0, 0); c.restore();
  c.save(); c.beginPath(); c.rect(padL, padT, pw, ph); c.clip();
  (opt.lines || []).forEach(function(l){
    c.strokeStyle = l.color; c.lineWidth = 2; c.setLineDash(l.dash ? [7, 5] : []); c.beginPath();
    if (l.h != null){ c.moveTo(padL, Y(l.h)); c.lineTo(padL + pw, Y(l.h)); }
    else {
      var b = l.b || 0, x1 = Math.max(l.from != null ? l.from : ax.lo, ax.lo), x2 = Math.min(l.to != null ? l.to : ax.hi, ax.hi);
      c.moveTo(X(x1), Y(l.k * x1 + b)); c.lineTo(X(x2), Y(l.k * x2 + b));
    }
    c.stroke();
  });
  c.setLineDash([]);
  opt.series.forEach(function(s){ s.pts.forEach(function(p){
    c.lineWidth = 2.5;
    if (s.hollow){ c.fillStyle = '#fff'; c.strokeStyle = s.color; }
    else { c.fillStyle = s.color; c.strokeStyle = '#fff'; }
    c.beginPath(); c.arc(X(p.x), Y(p.y), 6.5, 0, Math.PI * 2); c.fill(); c.stroke();
  }); });
  c.restore();
}

/* 탐구 화면용 좌표축: xr, yr = [lo, hi, step] */
function plotBox(c, x, y, w, h, xr, yr, xLabel, yLabel){
  var X = function(v){ return x + (v - xr[0]) / (xr[1] - xr[0]) * w; }, Y = function(v){ return y + h - (v - yr[0]) / (yr[1] - yr[0]) * h; };
  c.fillStyle = '#F7F9FC'; c.fillRect(x, y, w, h);
  c.strokeStyle = '#E1E7EE'; c.lineWidth = 1; c.font = '18px ' + FONT; c.fillStyle = '#4A5868';
  var i, v, nx = Math.round((xr[1] - xr[0]) / xr[2]), ny = Math.round((yr[1] - yr[0]) / yr[2]);
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (i = 0; i <= nx; i++){ v = xr[0] + i * xr[2]; c.beginPath(); c.moveTo(X(v), y); c.lineTo(X(v), y + h); c.stroke(); c.fillText(f(v, decOf(xr[2])), X(v), y + h + 6); }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (i = 0; i <= ny; i++){ v = yr[0] + i * yr[2]; c.beginPath(); c.moveTo(x, Y(v)); c.lineTo(x + w, Y(v)); c.stroke(); c.fillText(f(v, decOf(yr[2])), x - 6, Y(v)); }
  c.strokeStyle = '#8C99A8'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + h); c.lineTo(x + w, y + h); c.stroke();
  if (yr[0] < 0){ c.beginPath(); c.moveTo(x, Y(0)); c.lineTo(x + w, Y(0)); c.stroke(); }
  if (xr[0] < 0){ c.beginPath(); c.moveTo(X(0), y); c.lineTo(X(0), y + h); c.stroke(); }
  c.fillStyle = '#1E2833'; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(xLabel, x + w / 2, y + h + 30);
  c.save(); c.translate(x - 54, y + h / 2); c.rotate(-Math.PI / 2); c.textBaseline = 'middle'; c.fillText(yLabel, 0, 0); c.restore();
  c.textBaseline = 'alphabetic';
  return {X:X, Y:Y};
}
function glow(c, x, y, r, color, alpha){
  if (alpha <= 0) return;
  var g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.globalAlpha = Math.min(alpha, 1); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
}
function hbars(items, max){
  return '<div class="hbars">' + items.map(function(it){
    return '<div class="hb"><span class="hl">' + it.label + '</span><span class="ht"><i style="width:' + Math.max(0, Math.min(100, it.v / max * 100)) + '%;background:' + it.color + '"></i></span><b>' + it.text + '</b></div>';
  }).join('') + '</div>';
}

/* ================= 실험별 설정 ================= */
var LAB = (function(){
var V = 343;
var VS = [0, 10, 20, 30, 40], VO = [0, 10, 20], F0 = [400, 660, 1000];
var DIR = ['서로 가까워짐', '서로 멀어짐'];
function dop(f0, vs, vo, away){
  var s = away ? 1 : -1;   // 멀어지면 분모 +vs, 분자 −vo
  var num = V + (away ? -vo : vo), den = V + (away ? vs : -vs);
  if (den <= 0) return {fail:'음원의 속력이 음속보다 빠릅니다. 이때는 앞쪽에 충격파(소닉 붐)가 생겨 이 식을 쓸 수 없습니다.'};
  return {f:f0 * num / den, num:num, den:den};
}
return {
  sceneHeight: 450,
  idle: '음원과 관찰자의 속력, 원래 진동수를 정한 뒤 <b>들어 보기</b>를 누르세요.',
  shortHint: '자유 탐구 탭에서 음원 속력과 관찰자 속력, 가까워질 때와 멀어질 때를 모두 기록하세요.',
  params: [
    {key:'f0', type:'seg', label:'음원의 원래 진동수', cols:3, value:1, options:F0.map(function(v){ return v + ' Hz'; })},
    {key:'vs', type:'seg', label:'음원(구급차)의 속력', cols:5, value:2, options:VS.map(function(v){ return v + ''; })},
    {key:'vo', type:'seg', label:'관찰자의 속력', cols:3, value:0, options:VO.map(function(v){ return v + ' m/s'; })},
    {key:'dir', type:'seg', label:'움직이는 방향', value:0, options:DIR,
      note:'음속은 343 m/s입니다. 관찰자가 듣는 진동수 f = f₀ (v ± v_관찰자) ÷ (v ∓ v_음원)로 계산합니다. 음원 속력의 단위는 m/s입니다.'}
  ],
  compute: function(p){
    var away = p.dir === 1, d = dop(F0[p.f0], VS[p.vs], VO[p.vo], away);
    if (d.fail) return {fail:d.fail};
    var fq = Math.round(d.f * 10) / 10;
    return {f0:F0[p.f0], vs:VS[p.vs], vo:VO[p.vo], away:away, f:fq, num:d.num, den:d.den, dl:fq - F0[p.f0], lam:V / F0[p.f0], lamF:d.den / F0[p.f0]};
  },
  draw: function(c, W, H, p, r, tau){
    var y0 = 130, k = r ? tau : 0, away = p.dir === 1;
    var sx = away ? 70 + k * 130 : 260 - k * 130, ox = W - 90;
    // 파면
    if (r){
      c.strokeStyle = 'rgba(43,95,163,.45)'; c.lineWidth = 1.5;
      for (var n = 0; n < 7; n++){
        var age = (k * 2.2 - n * 0.28);
        if (age <= 0) continue;
        var emit = away ? 70 + (k - age / 2.2) * 130 : 260 - (k - age / 2.2) * 130;
        var rad = age * 90;
        c.beginPath(); c.arc(emit, y0, rad, 0, Math.PI * 2); c.stroke();
      }
    }
    // 음원
    c.fillStyle = '#C8463D'; c.fillRect(sx - 22, y0 - 14, 44, 26);
    c.fillStyle = '#fff'; c.fillRect(sx - 16, y0 - 8, 14, 12);
    txt(c, '음원', sx, y0 + 34, {align:'center', color:'#4A5868'});
    if (VS[p.vs] > 0) arrow(c, sx, y0 - 28, sx + (away ? -40 : 40), y0 - 28, '#C8463D', 2.5);   /* 음원(왼쪽): 가까워지면 오른쪽(관찰자 쪽)으로 */
    // 관찰자
    c.fillStyle = '#2B5FA3'; c.beginPath(); c.arc(ox, y0, 12, 0, Math.PI * 2); c.fill();
    txt(c, '관찰자', ox, y0 + 34, {align:'center', color:'#4A5868'});
    if (VO[p.vo] > 0) arrow(c, ox, y0 - 28, ox + (away ? 40 : -40), y0 - 28, '#2B5FA3', 2.5);
    txt(c, away ? '서로 멀어지는 중' : '서로 가까워지는 중', 12, 26, {bold:true});
    // 진동수 비교
    var by = 250, bx = 140, bw = W - bx - 24;
    if (!r){ txt(c, '들어 보면 진동수가 나타납니다', 12, by, {color:'#4A5868'}); return; }
    var mx = Math.max(r.f0, r.f) * 1.15, k2 = Math.min(1, Math.max(0, (tau - 0.3) / 0.6));
    txt(c, '원래 진동수', 12, by + 16, {base:'middle'});
    c.fillStyle = '#8C99A8'; c.fillRect(bx, by + 4, bw * r.f0 / mx, 24);
    txt(c, r.f0 + ' Hz', bx + 8, by + 16, {base:'middle', color:'#fff', bold:true});
    txt(c, '들리는 진동수', 12, by + 60, {base:'middle'});
    c.fillStyle = r.dl > 0 ? '#C8463D' : r.dl < 0 ? '#2B5FA3' : '#8C99A8';
    c.fillRect(bx, by + 48, bw * (r.f0 + r.dl * k2) / mx, 24);
    txt(c, f(r.f0 + r.dl * k2, 1) + ' Hz', bx + 8, by + 60, {base:'middle', color:'#fff', bold:true});
    txt(c, '차이 ' + sgn(r.dl * k2, 1) + ' Hz (' + (r.dl > 0 ? '더 높게' : r.dl < 0 ? '더 낮게' : '그대로') + ' 들림)', 12, by + 106, {bold:true});
    txt(c, '관찰자 쪽 파장 ' + f(r.lamF, 4) + ' m, 정지했을 때 ' + f(r.lam, 4) + ' m', 12, by + 138, {color:'#4A5868'});
  },
  stats: function(p, r){
    return [['원래 진동수 f₀', r.f0 + ' Hz'], ['음원 속력', r.vs + ' m/s'], ['관찰자 속력', r.vo + ' m/s'], ['방향', r.away ? '멀어짐' : '가까워짐'],
      ['들리는 진동수 f', f(r.f, 1) + ' Hz', PAL[4]], ['차이', sgn(r.dl, 1) + ' Hz'], ['파장 변화', f(r.lam, 4) + ' → ' + f(r.lamF, 4) + ' m']];
  },
  columns: ['f₀ (Hz)', '음원 (m/s)', '관찰자 (m/s)', '방향', 'f (Hz)', '차이 (Hz)', 'f ÷ f₀'],
  record: function(p, r){ return {f0:r.f0, vs:r.vs, vo:r.vo, away:r.away, f:r.f, dl:r.dl, ratio:r.f / r.f0}; },
  row: function(d){ return [d.f0, d.vs, d.vo, d.away ? '멀어짐' : '가까워짐', f(d.f, 1), sgn(d.dl, 1), f(d.ratio, 4)]; },
  verify: function(rec, box){
    box.innerHTML = '<div class="vgrid">' +
      card('음원 속력과 들리는 진동수', '<canvas class="chart" id="ch1"></canvas>' + legend([{color:PAL[4], label:'가까워짐'}, {color:PAL[0], label:'멀어짐'}]) +
        '<ul class="readout" id="ro1"></ul><p class="ask">가까워질 때와 멀어질 때 진동수가 반대로 바뀝니다. 구급차가 지나가는 순간 소리가 어떻게 들리는지 떠올려 보세요.</p>') +
      card('음원이 움직일 때와 관찰자가 움직일 때', '<div id="ro2"></div><p class="ask">둘의 속력이 같아도 결과가 조금 다릅니다. 식에서 음원 속력은 분모에, 관찰자 속력은 분자에 들어가는 것과 연결해 보세요.</p>') +
      card('생활 속 도플러', '<p>도플러 효과는 자동차 속도 측정, 초음파로 혈류 속도 재기, 기상 레이더, 멀어지는 은하의 적색 편이에 쓰입니다.</p><p class="ask">소리가 아니라 빛에서도 같은 일이 일어난다면, 멀어지는 별의 빛은 어느 쪽 색으로 치우칠까요?</p>') + '</div>';
    var near = rec.filter(function(d){ return !d.away; }), far = rec.filter(function(d){ return d.away; });
    drawScatter($('ch1'), {xLabel:'음원 속력 (m/s)', yLabel:'f ÷ f₀', tightY:true, xHi:45, xStep:10,
      series:[{color:PAL[4], pts:near.map(function(d){ return {x:d.vs, y:d.ratio}; })}, {color:PAL[0], pts:far.map(function(d){ return {x:d.vs, y:d.ratio}; })}]});
    $('ro1').innerHTML = '<li>가까워지는 기록 ' + near.length + '개: f ÷ f₀ 평균 ' + f(near.length ? mean(near.map(function(d){ return d.ratio; })) : 0, 4) +
      '</li><li>멀어지는 기록 ' + far.length + '개: 평균 ' + f(far.length ? mean(far.map(function(d){ return d.ratio; })) : 0, 4) + '</li>';
    var same = rec.filter(function(d){ return (d.vs > 0) !== (d.vo > 0); });
    var g = groupBy(same, function(d){ return d.f0 + '|' + Math.max(d.vs, d.vo) + '|' + d.away; });
    var ks = Object.keys(g).filter(function(k){ return g[k].length >= 2; });
    $('ro2').innerHTML = ks.length ? tableHTML(['f₀ (Hz)', '속력 (m/s)', '방향', '움직이는 쪽', 'f (Hz)'], [].concat.apply([], ks.map(function(k){
      return g[k].map(function(d){ return [d.f0, Math.max(d.vs, d.vo), d.away ? '멀어짐' : '가까워짐', d.vs > 0 ? '음원' : '관찰자', f(d.f, 1)]; }); })))
      : '<p class="msg">같은 속력으로 음원만 움직일 때와 관찰자만 움직일 때를 각각 기록하면 비교할 수 있어요.</p>';
  }
};
})();

/* ================= 엔진 ================= */
var p = {}, running = false, result = null, records = [];
var scene = $('scene'), runBtn = $('runBtn'), recBtn = $('recBtn'), clearBtn = $('clearBtn');

function sizeScene(){ scene.style.height = (typeof LAB.sceneHeight === 'function' ? LAB.sceneHeight(scene.clientWidth) : LAB.sceneHeight) + 'px'; }
function draw(r, tau){ var o = fitCanvas(scene); if (!o.W) return; o.c.clearRect(0, 0, o.W, o.H); LAB.draw(o.c, o.W, o.H, p, r, tau); }
function paintSlider(el){ el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }

function buildControls(){
  var box = $('controls');
  LAB.params.forEach(function(q){
    p[q.key] = q.value;
    var wrap = document.createElement('div'); wrap.className = 'ctrl';
    if (q.type === 'range'){
      wrap.innerHTML = '<div class="row"><label for="r_' + q.key + '">' + q.label + '</label><span class="val" id="v_' + q.key + '"></span></div>' +
        '<input type="range" id="r_' + q.key + '" min="' + q.min + '" max="' + q.max + '" step="' + q.step + '" value="' + q.value + '">';
      box.appendChild(wrap);
      var el = $('r_' + q.key);
      el.addEventListener('input', function(){ p[q.key] = parseFloat(el.value); onParamChange(); });
    } else {
      wrap.innerHTML = '<div class="row"><span>' + q.label + '</span></div><div class="seg' + (q.cols ? ' c' + q.cols : '') + '" id="seg_' + q.key + '"></div>' +
        (q.note ? '<p class="note">' + q.note + '</p>' : '');
      box.appendChild(wrap);
      var sb = $('seg_' + q.key);
      q.options.forEach(function(html, i){
        var b = document.createElement('button'); b.type = 'button'; b.innerHTML = html;
        b.setAttribute('aria-pressed', i === q.value ? 'true' : 'false');
        b.addEventListener('click', function(){
          if (running) return;
          p[q.key] = i;
          Array.prototype.forEach.call(sb.children, function(x, j){ x.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
          onParamChange();
        });
        sb.appendChild(b);
      });
    }
  });
}
function syncLabels(){
  LAB.params.forEach(function(q){ if (q.type === 'range'){ $('v_' + q.key).textContent = q.fmt(p[q.key]); paintSlider($('r_' + q.key)); } });
}
function lockControls(on){
  Array.prototype.forEach.call($('controls').querySelectorAll('input,button'), function(el){ el.disabled = on; });
  runBtn.disabled = on;
  clearBtn.disabled = on || records.length === 0;
}
function showIdle(){ $('result').innerHTML = '<p class="msg">' + LAB.idle + '</p>'; }
function onParamChange(){ result = null; recBtn.disabled = true; syncLabels(); draw(null, 0); showIdle(); }
function showStats(r){
  $('result').innerHTML = '<dl class="stats">' + LAB.stats(p, r).map(function(s){
    return '<div' + (s[2] ? ' style="border-color:' + s[2] + '"' : '') + '><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>';
  }).join('') + '</dl>';
}

runBtn.addEventListener('click', function(){
  scene.scrollIntoView({behavior:'smooth', block:'center'});
  if (running) return;
  var r = LAB.compute(p);
  result = null; recBtn.disabled = true;
  if (r.fail){ draw(null, 0); $('result').innerHTML = '<p class="msg stop">' + r.fail + '</p>'; return; }
  running = true; lockControls(true);
  $('result').innerHTML = '<p class="msg">측정 중…</p>';
  setTimeout(function(){
    var t0 = performance.now();
    function step(now){
      var tau = Math.min((now - t0) / ANIM_MS, 1);
      draw(r, tau);
      if (tau < 1) requestAnimationFrame(step); else finish(r);
    }
    requestAnimationFrame(step);
  }, 300);
});
function finish(r){ running = false; result = r; lockControls(false); showStats(r); recBtn.disabled = false; }

recBtn.addEventListener('click', function(){
  if (!result) return;
  var d = LAB.record(p, result);
  (Array.isArray(d) ? d : [d]).forEach(function(x){ x._no = records.length + 1; records.push(x); });
  recBtn.disabled = true; renderTable();
});
clearBtn.addEventListener('click', function(){
  if (!records.length || !confirm('기록한 데이터를 모두 지울까요?')) return;
  records = []; renderTable();
});
function renderTable(){
  var body = $('recBody');
  $('recCount').textContent = records.length ? '(' + records.length + '개)' : '';
  clearBtn.disabled = running || records.length === 0;
  if (!records.length){
    body.innerHTML = '<tr class="empty"><td colspan="' + (LAB.columns.length + 1) + '">아직 기록이 없어요. 측정한 뒤 기록하기를 누르면 여기에 쌓입니다.</td></tr>';
    return;
  }
  body.innerHTML = records.map(function(d){
    return '<tr><td>' + d._no + '</td>' + LAB.row(d).map(function(x){ return '<td>' + x + '</td>'; }).join('') + '</tr>';
  }).join('');
  var wrap = body.closest('.tablewrap'); wrap.scrollTop = wrap.scrollHeight;
}
function renderVerify(){
  var box = $('verifyBody'), need = LAB.minRec || 4;
  if (records.length < need){
    box.innerHTML = '<div class="card shortage"><strong>데이터 부족</strong>분석하려면 기록이 ' + need + '개 이상 필요해요. 지금 ' + records.length + '개입니다. ' + LAB.shortHint + '</div>';
    return;
  }
  LAB.verify(records, box);
}
function redrawExplore(){ if (running) return; sizeScene(); draw(result, result ? 1 : 0); }

var tabs = [$('tab-explore'), $('tab-verify')], panels = [$('panel-explore'), $('panel-verify')];
tabs.forEach(function(t, i){
  t.addEventListener('click', function(){
    tabs.forEach(function(x, j){ x.setAttribute('aria-selected', i === j ? 'true' : 'false'); });
    panels.forEach(function(pn, j){ pn.hidden = i !== j; });
    if (i === 1) renderVerify(); else redrawExplore();
  });
});
var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ if (!panels[1].hidden) renderVerify(); else redrawExplore(); }, 120);
});

$('recHead').innerHTML = '<th>번호</th>' + LAB.columns.map(function(h){ return '<th>' + h + '</th>'; }).join('');
buildControls(); syncLabels(); renderTable(); showIdle(); sizeScene(); draw(null, 0);
})();
</script>
