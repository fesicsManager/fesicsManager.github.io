<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발명 기법 아이디어 판 · 제로 랩</title>
<style>
html{font-size:18px}
@media(max-width:760px){html{font-size:17px}}
@media(max-width:420px){html{font-size:16px}}
*{box-sizing:border-box}
body{
  margin:0;padding:1.4rem 0;min-height:100vh;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:#1d2433;background-color:#f4f7fb;
  background-image:radial-gradient(#cfd9e8 1.4px, transparent 1.4px);
  background-size:20px 20px;
}
.wrap{width:97%;max-width:1840px;margin:0 auto}
header.lab{margin-bottom:1.1rem}
header.lab h1{font-size:1.6rem;margin:0 0 .35rem;letter-spacing:-.02em}
header.lab p{margin:0;font-size:1rem;color:#53617a;line-height:1.55}
.tabs{display:flex;gap:.5rem;margin:1.1rem 0 .9rem;flex-wrap:wrap}
.tab{
  font:inherit;font-size:1rem;font-weight:700;padding:.65rem 1.1rem;border:2px solid #d3dce9;
  background:#fff;color:#53617a;border-radius:.7rem;cursor:pointer;
  transition:background .18s,color .18s,border-color .18s,filter .18s,transform .08s;
}
.tab:hover{filter:brightness(.97);border-color:#9fb4d4}
.tab:active{transform:translateY(1px) scale(.985)}
.tab.on{background:#2f6df0;border-color:#2f6df0;color:#fff}
.panel{display:none}
.panel.on{display:block}
.grid{display:grid;grid-template-columns:minmax(400px,480px) 1fr;gap:1.1rem;align-items:start}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid #e2e9f4;border-radius:1rem;padding:1.1rem;box-shadow:0 2px 10px rgba(30,50,90,.05)}
.card h2{font-size:1.15rem;margin:0 0 .8rem}
canvas{width:100%;height:auto;display:block;border-radius:.7rem;background:#fbfdff;border:1px solid #e6edf7}
.ctrl{margin:.9rem 0 0}
.ctrl label{display:block;font-size:1rem;font-weight:700;margin-bottom:.3rem}
.ctrl .val{color:#2f6df0}
select,input[type=number],input[type=text]{
  font:inherit;font-size:1rem;width:100%;padding:.6rem .7rem;border:2px solid #d3dce9;border-radius:.6rem;background:#fff;
}
select:hover,input:hover{border-color:#9fb4d4}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;
  touch-action:manipulation;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#dce5f2;border:1px solid #c6d3e6}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;
  background:#2f6df0;border:3px solid #fff;box-shadow:0 1px 5px rgba(30,60,120,.4);
  transition:transform .12s,background .12s;
}
input[type=range]:hover::-webkit-slider-thumb{background:#1d55cc;transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#dce5f2}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#2f6df0;border:3px solid #fff}
input[type=range]:disabled{opacity:.55;cursor:not-allowed}
.btn{
  font:inherit;font-size:1rem;font-weight:700;padding:.7rem 1.1rem;border:none;border-radius:.7rem;
  background:#2f6df0;color:#fff;cursor:pointer;
  transition:filter .18s,transform .08s,box-shadow .18s;box-shadow:0 2px 7px rgba(47,109,240,.3);
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 3px rgba(47,109,240,.3)}
.btn.ghost{background:#eef3fb;color:#2f4a7a;box-shadow:none}
.btn.ghost:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.readout{margin-top:.9rem;padding:.8rem .9rem;background:#f2f6fd;border:1px solid #dbe5f5;border-radius:.7rem;font-size:1rem;line-height:1.6}
.readout b{color:#1d55cc}
.tablebox{max-height:420px;overflow:auto;border:1px solid #e2e9f4;border-radius:.7rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
thead th{position:sticky;top:0;background:#eef3fb;color:#2f4a7a;padding:.6rem .5rem;border-bottom:2px solid #d3dce9;text-align:center;z-index:2}
tbody td{padding:.55rem .5rem;border-bottom:1px solid #edf1f8;text-align:center}
tbody tr:nth-child(even){background:#fafcff}
.empty{padding:1.4rem;text-align:center;color:#7b8aa3;font-size:1rem}
.need{padding:1.8rem 1.2rem;text-align:center;background:#fff6e8;border:2px dashed #f0c48a;border-radius:.9rem;color:#8a5a12;font-size:1.05rem;line-height:1.6}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.note{margin-top:1rem;font-size:.95rem;color:#53617a;line-height:1.6}
.bar{height:16px;border-radius:8px;background:#2f6df0}
.barwrap{background:#e8eef8;border-radius:8px;overflow:hidden;margin:.25rem 0 .6rem}
.tag{display:inline-block;font-size:.85rem;padding:.15rem .5rem;border-radius:.4rem;background:#eef3fb;color:#2f4a7a;margin-right:.3rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="lab">
    <h1>발명 기법 아이디어 판</h1>
    <p>'좋은 아이디어를 생각해'는 방법이 아닙니다. 기법을 하나씩 걸고 3분 동안 몇 개가 나오는지 직접 세어 보세요. (2화 · 발명 기법)</p>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabA">🔬 자유 탐구</button>
    <button class="tab" id="tabB">✅ 데이터 확인</button>
  </div>

  <section class="panel on" id="panelA">
    <div class="grid">
      <div class="card">
        <h2>기법별 아이디어 개수</h2>
        <canvas id="cv" width="460" height="380"></canvas>
        <div id="readout" class="readout"></div>
      </div>
      <div class="card">
        <h2>조절하고 관찰하기</h2>
        <div id="controls"><div class="ctrl"><label>바꿀 물건</label><input type="text" id="obj" value="우산" maxlength="10"></div>
<div class="ctrl"><label>쓴 기법</label><select id="meth">
<option>더하기</option><option>빼기</option><option>크게</option><option>작게</option><option>모양 바꾸기</option><option>재료 바꾸기</option><option>반대로 하기</option><option>다른 용도로</option><option>기법 없이 그냥 생각</option>
</select></div>
<div class="ctrl"><label>3분 동안 나온 개수 <span class="val" id="vN">4</span>개</label><input type="range" id="n" min="0" max="20" step="1" value="4"></div>
<div class="ctrl"><label>그중 써 볼 만한 것 <span class="val" id="vG">1</span>개</label><input type="range" id="g" min="0" max="10" step="1" value="1"></div></div>
        <div class="btnrow">
          <button class="btn" id="goBtn">판에 세워 올리기</button>
          <button class="btn ghost" id="recBtn">기록하기</button>
          <button class="btn ghost" id="clrBtn">기록 지우기</button>
        </div>
        <div class="tablebox" style="margin-top:1rem">
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="note">타이머를 3분 맞추고 실제로 적어 본 개수를 넣으세요. 이 활동은 좋은 아이디어를 고르는 활동이 아니라 많이 내는 활동입니다.</div>
      </div>
    </div>
  </section>

  <section class="panel" id="panelB">
    <div class="card">
      <h2>내가 모은 데이터로 확인하기</h2>
      <div id="verify"></div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var rows=[];
var LAB=(function(){
var out,c,cvv,stack={};
var obj=document.getElementById('obj'),meth=document.getElementById('meth'),n=document.getElementById('n'),g=document.getElementById('g');
n.oninput=function(){document.getElementById('vN').textContent=n.value;};
g.oninput=function(){document.getElementById('vG').textContent=g.value;};
var MS=['더하기','빼기','크게','작게','모양 바꾸기','재료 바꾸기','반대로 하기','다른 용도로','기법 없이 그냥 생각'];
function draw(prog){
  c.clearRect(0,0,cvv.width,cvv.height);
  var base=cvv.height-92,maxH=230,w=(cvv.width-24)/MS.length;
  var mx=1;for(var k in stack){if(stack[k].n>mx)mx=stack[k].n;}
  for(var i=0;i<MS.length;i++){
    var s=stack[MS[i]]||{n:0,g:0};
    var x=12+i*w;
    var hgt=s.n/mx*maxH*prog,gh=s.g/mx*maxH*prog;
    c.fillStyle='#eef3fb';c.fillRect(x+2,base-maxH,w-4,maxH);
    c.fillStyle=MS[i]==='기법 없이 그냥 생각'?'#b6bfcd':'#2f6df0';
    c.fillRect(x+2,base-hgt,w-4,hgt);
    c.fillStyle='#f0903a';c.fillRect(x+2,base-gh,w-4,gh);
    if(s.n>0){c.fillStyle='#1d2433';c.font='bold 12px sans-serif';c.textAlign='center';
      c.fillText(String(s.n),x+w/2,base-hgt-6);}
    c.save();c.translate(x+w/2,base+10);c.rotate(Math.PI/3);
    c.fillStyle='#53617a';c.font='10px sans-serif';c.textAlign='left';
    c.fillText(MS[i],0,0);c.restore();
  }
  c.strokeStyle='#c6d3e6';c.lineWidth=2;
  c.beginPath();c.moveTo(8,base);c.lineTo(cvv.width-8,base);c.stroke();
  c.fillStyle='#2f6df0';c.font='13px sans-serif';c.textAlign='left';
  c.fillText('파랑 = 나온 개수',12,20);
  c.fillStyle='#f0903a';c.fillText('주황 = 써 볼 만한 것',150,20);
}
return {
  columns:['물건','기법','나온 개수','써 볼 만한 것'],
  init:function(ctx2,canvas,readout){c=ctx2;cvv=canvas;out=readout;draw(1);
    out.innerHTML='기법을 하나 걸고 3분 동안 적은 개수를 넣은 뒤 <b>판에 세워 올리기</b>를 눌러 보세요.';},
  run:function(done){
    var k=meth.value;
    if(!stack[k])stack[k]={n:0,g:0};
    stack[k].n+=Number(n.value);stack[k].g+=Number(g.value);
    var t=0,iv=setInterval(function(){t++;draw(Math.min(t/20,1));
      if(t>=20){clearInterval(iv);
        out.innerHTML='<b>'+k+'</b> 기법으로 지금까지 '+stack[k].n+'개. 다른 기법도 걸어 보세요.';
        done();}},30);
  },
  record:function(){
    return {cells:[obj.value||'물건',meth.value,n.value,g.value],
            raw:{o:obj.value||'물건',m:meth.value,n:Number(n.value),g:Number(g.value)}};
  },
  verify:function(rs){
    var byM={},free=null,withM=[];
    for(var i=0;i<rs.length;i++){
      var m=rs[i].raw.m;
      if(!byM[m])byM[m]={n:0,g:0,c:0};
      byM[m].n+=rs[i].raw.n;byM[m].g+=rs[i].raw.g;byM[m].c++;
    }
    var totN=0,totG=0;
    for(var k in byM){
      if(k==='기법 없이 그냥 생각'){free=byM[k];}
      else{withM.push({k:k,v:byM[k]});totN+=byM[k].n;totG+=byM[k].g;}
    }
    withM.sort(function(a,b){return b.v.n-a.v.n;});
    var mx=withM.length?withM[0].v.n:1;
    var h='<div class="vgrid"><div><h3>기법별 아이디어 수</h3>';
    for(var j=0;j<withM.length;j++){
      h+='<div style="font-size:.95rem">'+withM[j].k+' · '+withM[j].v.n+'개 (쓸 만한 것 '+withM[j].v.g+')</div>'+
         '<div class="barwrap"><div class="bar" style="width:'+(withM[j].v.n/mx*100)+'%"></div></div>';
    }
    if(free){
      h+='<div style="font-size:.95rem;margin-top:.5rem">기법 없이 · '+free.n+'개 (쓸 만한 것 '+free.g+')</div>'+
         '<div class="barwrap"><div class="bar" style="width:'+(free.n/mx*100)+'%;background:#b6bfcd"></div></div>';
    }
    h+='</div><div><h3>읽어 내기</h3>';
    if(free&&withM.length){
      var avgM=totN/withM.length;
      h+='<p style="font-size:1.03rem;line-height:1.85">기법을 걸었을 때 평균 <b>'+avgM.toFixed(1)+'개</b>, '+
         '기법 없이 생각했을 때 <b>'+free.n+'개</b>였습니다. 어느 쪽이 더 많이 나왔나요?</p>';
    }else{
      h+='<p style="font-size:1.03rem;line-height:1.85">\'기법 없이 그냥 생각\'도 한 번 기록해 두면 기법의 효과를 비교할 수 있습니다.</p>';
    }
    if(totN>0){
      h+='<p style="font-size:1.03rem;line-height:1.85">기법으로 낸 아이디어 <b>'+totN+'개</b> 중 써 볼 만한 것은 <b>'+totG+'개</b>('+Math.round(totG/totN*100)+'%)였습니다.</p>';
    }
    h+='<ol style="font-size:1rem;line-height:1.9;padding-left:1.2rem">'+
       '<li>개수가 많았던 기법일수록 쓸 만한 것도 많았나요?</li>'+
       '<li>\'빼기\' 기법에서 나온 것을 하나 말해 보세요. 무선 이어폰은 어디에 들어갈까요?</li></ol></div></div>'+
       '<div class="note">여덟 개 중 쓸 만한 것이 하나만 나와도 성공입니다. <b>많이 내는 것이 먼저</b>이고 고르는 것은 그다음입니다.</div>';
    return h;
  }
};
})();

/* ---------- 탭 ---------- */
var tabA=document.getElementById('tabA'),tabB=document.getElementById('tabB');
var panelA=document.getElementById('panelA'),panelB=document.getElementById('panelB');
tabA.onclick=function(){tabA.classList.add('on');tabB.classList.remove('on');panelA.classList.add('on');panelB.classList.remove('on');};
tabB.onclick=function(){tabB.classList.add('on');tabA.classList.remove('on');panelB.classList.add('on');panelA.classList.remove('on');renderVerify();};

/* ---------- 표 ---------- */
var thead=document.getElementById('thead'),tbody=document.getElementById('tbody');
(function(){
  var h='';
  for(var i=0;i<LAB.columns.length;i++){h+='<th>'+LAB.columns[i]+'</th>';}
  thead.innerHTML=h;
})();
function renderTable(){
  if(rows.length===0){
    tbody.innerHTML='<tr><td class="empty" colspan="'+LAB.columns.length+'">아직 기록이 없어요. 조건을 바꿔 보고 <b>기록하기</b>를 눌러 주세요.</td></tr>';
    return;
  }
  var h='';
  for(var i=0;i<rows.length;i++){
    h+='<tr>';
    for(var j=0;j<rows[i].cells.length;j++){h+='<td>'+rows[i].cells[j]+'</td>';}
    h+='</tr>';
  }
  tbody.innerHTML=h;
}

/* ---------- 버튼 ---------- */
var goBtn=document.getElementById('goBtn');
var recBtn=document.getElementById('recBtn');
var clrBtn=document.getElementById('clrBtn');
var busy=false;
function lockControls(on){
  var el=document.querySelectorAll('#controls input, #controls select');
  for(var i=0;i<el.length;i++){el[i].disabled=on;}
  goBtn.disabled=on;recBtn.disabled=on;
}
goBtn.onclick=function(){
  if(busy)return;
  cv.scrollIntoView({behavior:'smooth',block:'center'});
  busy=true;lockControls(true);
  LAB.run(function(){busy=false;lockControls(false);});
};
recBtn.onclick=function(){
  var r=LAB.record();
  if(!r)return;
  rows.push(r);renderTable();
};
clrBtn.onclick=function(){rows=[];renderTable();renderVerify();};

/* ---------- 데이터 확인 ---------- */
function renderVerify(){
  var box=document.getElementById('verify');
  if(rows.length<4){
    box.innerHTML='<div class="need"><b>데이터 부족</b><br>기록이 <b>'+rows.length+'개</b>입니다. 조건을 바꿔 가며 <b>4개 이상</b> 기록하면 여기에서 내 데이터를 분석해 볼 수 있어요.</div>';
    return;
  }
  box.innerHTML=LAB.verify(rows);
}

/* ---------- 시작 ---------- */
LAB.init(ctx,cv,document.getElementById('readout'));
renderTable();renderVerify();
})();
</script>
</body>
</html>
