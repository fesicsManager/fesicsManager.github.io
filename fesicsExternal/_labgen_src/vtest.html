<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>fesics vtest</title>
<style>body{font:13px/1.4 monospace;margin:8px}#st{font-weight:bold}#log{white-space:pre-wrap;max-height:40vh;overflow:auto;border:1px solid #ccc;padding:4px}iframe{width:1100px;height:900px;border:1px solid #999}</style></head>
<body>
<div id="st">준비</div>
<div id="log"></div>
<iframe id="fr"></iframe>
<script>
// LAB 엔진(고등 템플릿) 전용 검증기: 여러 조건으로 실행해 기록을 쌓고 검증 탭까지 확인
const RESULTS = []; window.RESULTS = RESULTS; window.DONE = false;
const st = document.getElementById('st'), logEl = document.getElementById('log'), fr = document.getElementById('fr');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rnd(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
async function runOne(url, runs){
  const rec = {file:url, errors:[], warn:[], recs:0, verify:false, ms:0, stats:''};
  const t0 = performance.now();
  await new Promise(res => { let done = false; const fin = () => { if (!done){ done = true; res(); } }; fr.onload = fin; fr.src = '/' + url + '?t=' + Date.now(); setTimeout(fin, 8000); });
  const w = fr.contentWindow, doc = fr.contentDocument;
  try {
    w.addEventListener('error', e => rec.errors.push((e.message || String(e)) + (e.lineno ? ' @' + e.lineno : '')));
    w.addEventListener('unhandledrejection', e => rec.errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
    w.alert = m => rec.warn.push('alert: ' + m); w.confirm = () => true;
    w.requestAnimationFrame = cb => setTimeout(() => { try { cb(w.performance.now()); } catch(e){ rec.errors.push('raf: ' + e.message); } }, 16);
    w.ANIM_MS = 120;
  } catch(e){ rec.errors.push('hook fail: ' + e.message); }
  await sleep(400);
  const rn = rnd(url.length * 7919 + 13);
  const segs = [...doc.querySelectorAll('#controls .seg')], ranges = [...doc.querySelectorAll('#controls input[type=range]')];
  const runBtn = doc.querySelector('#runBtn');
  if (!runBtn){ rec.errors.push('no runBtn'); RESULTS.push(rec); return; }
  for (let i = 0; i < runs; i++){
    try {
      segs.forEach((sg, si) => { const bs = sg.querySelectorAll('button'); const idx = i === 0 ? 0 : i === 1 ? bs.length - 1 : Math.floor(rn() * bs.length); bs[idx].click(); });
      ranges.forEach(rg => { const lo = +rg.min, hi = +rg.max, stp = +rg.step || 1; const v = i === 0 ? lo : i === 1 ? hi : lo + Math.round(rn() * (hi - lo) / stp) * stp; rg.value = v; rg.dispatchEvent(new Event('input', {bubbles:true})); rg.dispatchEvent(new Event('change', {bubbles:true})); });
      await sleep(60);
      const before = doc.querySelectorAll('#recBody tr').length;
      runBtn.click();
      let ok = false;
      for (let t = 0; t < 60; t++){ await sleep(100); if (doc.querySelectorAll('#recBody tr').length > before || (!runBtn.disabled && !/측정 중/.test(doc.querySelector('#result').innerText))){ ok = true; break; } }
      if (!ok) rec.warn.push('run ' + i + ' timeout');
      const res = doc.querySelector('#result').innerText;
      if (i === 0) rec.stats = res.replace(/\s+/g, ' ').slice(0, 160);
      if (/\bNaN\b|undefined|Infinity/.test(res)) rec.warn.push('run ' + i + ' bad value: ' + res.replace(/\s+/g, ' ').slice(0, 120));
    } catch(e){ rec.errors.push('run ' + i + ': ' + e.message); }
  }
  rec.recs = doc.querySelectorAll('#recBody tr').length;
  if (rec.recs < runs) rec.warn.push('recs ' + rec.recs + ' < runs ' + runs + ' (r.fail?)');
  try {
    const v = doc.querySelector('#tab-verify'); if (v){ v.click(); rec.verify = true; await sleep(500); }
    const vt = doc.querySelector('#verifyBody').innerText;
    if (/\bNaN\b|undefined|Infinity/.test(vt)) rec.warn.push('verify bad value: ' + vt.replace(/\s+/g, ' ').slice(0, 160));
    if (/데이터 부족/.test(vt) && rec.recs >= 4) rec.warn.push('verify still locked with ' + rec.recs + ' recs');
    const tbl = doc.querySelector('#recBody').innerText; if (/\bNaN\b|undefined|Infinity/.test(tbl)) rec.warn.push('table bad value');
  } catch(e){ rec.errors.push('verify: ' + e.message); }
  rec.ms = Math.round(performance.now() - t0);
  RESULTS.push(rec);
  const flag = rec.errors.length ? 'ERR' : rec.warn.length ? 'WARN' : 'ok';
  logEl.textContent += `${RESULTS.length}\t${flag}\t${url}\trecs=${rec.recs}\t${rec.errors.join(' | ')}${rec.warn.length ? ' / ' + rec.warn.join(' | ') : ''}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
(async () => {
  const q = new URLSearchParams(location.search);
  const runs = +(q.get('runs') || 6);
  const files = await (await fetch('/_runner/' + (q.get('list') || 'files.json'))).json();
  for (let i = 0; i < files.length; i++){ st.textContent = `${i + 1}/${files.length} ${files[i]}`; await runOne(files[i], runs); }
  window.DONE = true; st.textContent = `완료 ${RESULTS.length}개 · ERR ${RESULTS.filter(r => r.errors.length).length} · WARN ${RESULTS.filter(r => !r.errors.length && r.warn.length).length}`;
})();
</script>
</body></html>
