<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>회로 실험실</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--paper:#eef2f0;--grid:#c9d6d2;--ink:#173238;--ink-soft:#4a636a;--brass:#d98e3b;--brass-dark:#a86825;--teal:#2f8f9d;--coral:#c1443c;--card:#fff;--radius:14px;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:radial-gradient(var(--grid) 1.2px,transparent 1.2px) 0 0/20px 20px,var(--paper);
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);font-size:17px;line-height:1.55;
  padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%;}
.app{max-width:1500px;margin:0 auto;}
h1{font-family:'Space Grotesk',sans-serif;font-size:27px;margin:0 0 4px;line-height:1.2;}
.subtitle{color:var(--ink-soft);font-size:16px;margin:0 0 12px;}
.card{background:var(--card);border:1px solid #d5e0dc;border-radius:var(--radius);box-shadow:0 3px 0 rgba(23,50,56,.05);padding:14px 16px;}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 10px;}
main.layout{display:grid;grid-template-columns:1fr minmax(260px,330px);gap:14px;align-items:start;}
@media (max-width:900px){main.layout{grid-template-columns:1fr;}}

/* 수준 단추 */
.levels{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.lv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:8px 18px;border-radius:999px;
  border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;}
.lv.on{background:var(--ink);color:#fff;}

/* 부품 고르는 줄 */
.tools{display:flex;gap:7px;overflow-x:auto;padding:3px 0 7px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.tool{flex:0 0 auto;width:72px;min-height:68px;border-radius:11px;border:2px solid #cddad6;background:#fff;
  color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:12.5px;font-weight:700;font-family:'Noto Sans KR',sans-serif;padding:5px 2px;touch-action:manipulation;}
.tool svg{width:34px;height:20px;display:block;}
.tool.on{border-color:var(--brass);background:#fff6ea;color:var(--brass-dark);box-shadow:0 2px 0 #f0d3a8;}
.tool.on svg{color:var(--brass-dark);}

canvas#board{width:100%;height:auto;display:block;border-radius:11px;background:#f8fbfa;border:1px solid #dce8e5;
  touch-action:none;cursor:crosshair;}

.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
button.act{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:9px;
  border:1.5px solid #cddad6;background:#fff;color:var(--ink-soft);cursor:pointer;touch-action:manipulation;}
button.act.primary{background:var(--brass);color:#fff;border-color:var(--brass);box-shadow:0 2px 0 var(--brass-dark);}
button.act.danger{color:var(--coral);border-color:#eccac7;}
button.act[disabled]{opacity:.45;cursor:default;}

.readout{margin-top:11px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:#f6faf9;
  border:1px dashed #b7cdc9;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.readout span{color:var(--ink-soft);font-size:13.5px;display:block;}
.readout b{color:var(--teal);font-size:18px;}
.warn{margin-top:10px;background:#fdeeec;border:1px solid #f0c8c4;color:#8e2f28;border-radius:10px;
  padding:9px 12px;font-size:14.5px;line-height:1.5;}
.hint{margin-top:10px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;background:#f6faf9;
  border-radius:10px;padding:10px 12px;border:1px dashed #b7cdc9;}

/* 속성 */
.prop{margin-top:9px;}
.prop label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft);
  margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
.prop label b{color:var(--brass-dark);font-size:17px;}
input[type=range]{width:100%;accent-color:var(--brass);height:9px;}
.empty-msg{background:#f6faf9;border:1px dashed #b7cdc9;border-radius:9px;padding:11px 13px;
  color:var(--ink-soft);font-size:14.5px;line-height:1.5;}
.measure{font-family:'IBM Plex Mono',monospace;font-size:14.5px;margin-top:8px;color:var(--ink-soft);}
.measure b{color:var(--teal);}
.exrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.ex{font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid #cddad6;
  background:#fff;color:var(--ink-soft);cursor:pointer;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <h1>회로 실험실</h1>
  <p class="subtitle">부품을 골라 칸 위에 끌어 놓고, 선으로 이어 보세요. 전류와 전압은 바로 계산됩니다.</p>

  <div class="levels">
    <button class="lv" data-lv="1">초등</button>
    <button class="lv on" data-lv="2">중등</button>
    <button class="lv" data-lv="3">고등</button>
  </div>

  <main class="layout">
    <section class="card">
      <div class="tools" id="tools"></div>
      <canvas id="board"></canvas>
      <div class="rowbtns">
        <button class="act" id="btnZoomIn">크게</button><button class="act" id="btnZoomOut">작게</button><button class="act" id="btnUndo">되돌리기</button>
        <button class="act" id="btnValues">값 숨기기</button>
        <button class="act" id="btnFlow">전류 흐름 끄기</button>
        <button class="act danger" id="btnClear">전부 지우기</button>
      </div>
      <div class="exrow" id="examples"></div>
      <div class="warn hidden" id="warn"></div>
      <div class="hint" id="hint">부품을 고른 뒤, 칸 위에서 <b>끌어서</b> 놓으면 놓입니다. <b>선</b>으로 양 끝을 이어야 전류가 흘러요.</div>
    </section>

    <aside>
      <div class="card">
        <h2>측정값</h2>
        <div class="readout">
          <div><span>전체 전류</span><b id="roI">0 A</b></div>
          <div><span>전지 전압</span><b id="roV">0 V</b></div>
          <div><span>전체 저항</span><b id="roR">— Ω</b></div>
          <div><span>소비 전력</span><b id="roP">0 W</b></div>
        </div>
        <div class="measure" id="rcRow" style="display:none">
          시간 <b id="roT">0.0 s</b> · 축전기 전압 <b id="roVc">0 V</b>
          <div class="rowbtns"><button class="act" id="btnRCReset">처음부터</button></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>고른 부품</h2>
        <div id="propBox"><div class="empty-msg">화살표 도구로 부품을 누르면 값을 바꿀 수 있어요.</div></div>
      </div>
    </aside>
  </main>
</div>

<script>
/* ===========================================================
   회로 실험실 — 노드 해석(MNA)으로 직류 회로를 푼다.
   저항·전지(내부저항 포함)·전구·스위치·전류계·전압계·축전기.
   축전기가 있으면 뒤로 오일러(backward Euler)로 시간을 흘린다.
   =========================================================== */

/* ---------- 칸(격자) ---------- */
var GW = 20, GH = 15;          /* 가로·세로 칸 수 */
var cell = 30;                 /* 한 칸 크기(그릴 때 다시 정함) */
var VC = 20;                   /* 한 화면에 보이는 가로 칸 수 */
var VR = 15;                   /* 보이는 세로 칸 수 */
var ox = 0, oy = 0;            /* 왼쪽 위에 보이는 칸 위치 */

/* ---------- 부품 ---------- */
var TOOLS = [
  {t:'select',  name:'화살표', lv:1},
  {t:'wire',    name:'선',     lv:1},
  {t:'battery', name:'전지',   lv:1},
  {t:'bulb',    name:'전구',   lv:1},
  {t:'switch',  name:'스위치', lv:1},
  {t:'resistor',name:'저항',   lv:2},
  {t:'ammeter', name:'전류계', lv:2},
  {t:'voltmeter',name:'전압계',lv:2},
  {t:'capacitor',name:'축전기',lv:3},
  {t:'erase',   name:'지우개', lv:1}
];

var els = [];          /* 놓인 부품들 */
var tool = 'wire';
var level = 2;
var selId = null;
var nextId = 1;
var undoStack = [];
var showValues = true, showFlow = true;
var simTime = 0, hasCap = false;
var warnText = '';

function defProps(t){
  if (t === 'battery')   return {V:1.5, r:0};
  if (t === 'bulb')      return {R:10};
  if (t === 'resistor')  return {R:20};
  if (t === 'switch')    return {closed:true};
  if (t === 'capacitor') return {C:0.05};
  return {};
}

/* ---------- 되돌리기 ---------- */
function snapshot(){
  undoStack.push(JSON.stringify(els));
  if (undoStack.length > 60) undoStack.shift();
  document.getElementById('btnUndo').disabled = false;
}
function undo(){
  if (!undoStack.length) return;
  els = JSON.parse(undoStack.pop());
  selId = null;
  document.getElementById('btnUndo').disabled = !undoStack.length;
  changed();
}

/* ---------- 선형 연립방정식 ---------- */
function lusolve(A, b){
  var n = b.length, i, r, c;
  for (i = 0; i < n; i++){
    var p = i;
    for (r = i+1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    if (Math.abs(A[p][i]) < 1e-13) continue;
    if (p !== i){ var t = A[p]; A[p] = A[i]; A[i] = t; var tb = b[p]; b[p] = b[i]; b[i] = tb; }
    for (r = i+1; r < n; r++){
      var f = A[r][i] / A[i][i];
      if (!f) continue;
      for (c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  var x = new Array(n); for (i = 0; i < n; i++) x[i] = 0;
  for (i = n-1; i >= 0; i--){
    var s = b[i];
    for (c = i+1; c < n; c++) s -= A[i][c] * x[c];
    x[i] = Math.abs(A[i][i]) < 1e-13 ? 0 : s / A[i][i];
  }
  return x;
}

/* ---------- 회로 풀기 ---------- */
/* dt 를 주면 축전기를 시간에 따라 푼다. 안 주면 정상 상태(축전기는 끊긴 것). */
function solve(dt){
  var i, e;
  /* 1) 선으로 이어진 점끼리 한 덩어리로 묶는다 */
  var par = {};
  function find(k){
    if (par[k] === undefined){ par[k] = k; return k; }
    while (par[k] !== k){ par[k] = par[par[k]]; k = par[k]; }
    return k;
  }
  function uni(a, b){ a = find(a); b = find(b); if (a !== b) par[a] = b; }
  function key(x, y){ return x + ',' + y; }

  for (i = 0; i < els.length; i++){
    e = els[i]; find(key(e.x1,e.y1)); find(key(e.x2,e.y2));
    if (e.type === 'wire') uni(key(e.x1,e.y1), key(e.x2,e.y2));
  }

  var nodeOf = {}, nn = 0;
  function nid(x, y){
    var r = find(key(x,y));
    if (nodeOf[r] === undefined) nodeOf[r] = nn++;
    return nodeOf[r];
  }
  var parts = [];
  for (i = 0; i < els.length; i++){
    e = els[i];
    if (e.type === 'wire') continue;
    parts.push({e:e, a:nid(e.x1,e.y1), b:nid(e.x2,e.y2)});
  }
  if (!parts.length){ return {ok:false, nn:nn}; }

  /* 2) 전압원(전지·닫힌 스위치·전류계)과 내부 마디 세기 */
  var vsrc = [], extra = 0;
  for (i = 0; i < parts.length; i++){
    var p = parts[i], ty = p.e.type;
    if (ty === 'battery'){
      if (p.e.props.r > 1e-6){ p.mid = nn + extra; extra++; }
      vsrc.push(p); p.vk = vsrc.length - 1;
    } else if (ty === 'ammeter' || (ty === 'switch' && p.e.props.closed)){
      vsrc.push(p); p.vk = vsrc.length - 1;
    }
  }
  var N = nn + extra, M = vsrc.length, S = N + M;
  if (S === 0) return {ok:false, nn:nn};

  var A = [], b = [];
  for (i = 0; i < S; i++){ var row = new Array(S); for (var c = 0; c < S; c++) row[c] = 0; A.push(row); b.push(0); }

  function stampR(a, bb, R){
    if (R < 1e-9) R = 1e-9;
    var g = 1 / R;
    A[a][a] += g; A[bb][bb] += g; A[a][bb] -= g; A[bb][a] -= g;
  }
  function stampI(a, bb, I){ /* a 에서 bb 로 흐르는 전류원 */
    b[a] -= I; b[bb] += I;
  }
  function stampV(a, bb, k, V){
    var col = N + k;
    A[a][col] += 1; A[bb][col] -= 1;
    A[col][a] += 1; A[col][bb] -= 1;
    b[col] = V;
  }

  /* 떠 있는 마디가 생겨도 풀리도록 아주 작은 저항을 땅에 붙인다 */
  for (i = 0; i < N; i++) A[i][i] += 1e-9;

  for (i = 0; i < parts.length; i++){
    var q = parts[i], pr = q.e.props, ty2 = q.e.type;
    if (ty2 === 'resistor' || ty2 === 'bulb'){
      stampR(q.a, q.b, Math.max(0.001, pr.R));
    } else if (ty2 === 'voltmeter'){
      stampR(q.a, q.b, 1e7);
    } else if (ty2 === 'switch'){
      if (pr.closed) stampV(q.a, q.b, q.vk, 0);
    } else if (ty2 === 'ammeter'){
      stampV(q.a, q.b, q.vk, 0);
    } else if (ty2 === 'battery'){
      if (q.mid !== undefined){
        stampV(q.mid, q.b, q.vk, pr.V);          /* 전압원 */
        stampR(q.a, q.mid, Math.max(1e-6, pr.r)); /* 내부저항 */
      } else {
        stampV(q.a, q.b, q.vk, pr.V);
      }
    } else if (ty2 === 'capacitor'){
      if (dt){
        var g = Math.max(1e-9, pr.C) / dt;
        var vp = q.e.state && q.e.state.vc ? q.e.state.vc : 0;
        stampR(q.a, q.b, 1/g);
        stampI(q.b, q.a, g * vp);   /* 전에 모인 전하가 밀어내는 몫 */
      } else {
        stampR(q.a, q.b, 1e10);
      }
    }
  }

  /* 땅(기준점) 정하기 — 0번 마디 */
  for (var cc = 0; cc < S; cc++) A[0][cc] = 0;
  A[0][0] = 1; b[0] = 0;

  var x = lusolve(A, b);

  /* 3) 부품마다 전압·전류 */
  var totalP = 0, maxI = 0;
  for (i = 0; i < parts.length; i++){
    var w = parts[i], pp = w.e.props, v = x[w.a] - x[w.b], cur = 0;
    if (w.e.type === 'resistor' || w.e.type === 'bulb') cur = v / Math.max(0.001, pp.R);
    else if (w.e.type === 'voltmeter') cur = v / 1e7;
    else if (w.e.type === 'switch') cur = pp.closed ? x[N + w.vk] : 0;
    else if (w.e.type === 'ammeter') cur = x[N + w.vk];
    else if (w.e.type === 'battery') cur = x[N + w.vk];
    else if (w.e.type === 'capacitor'){
      if (dt){
        var gc = Math.max(1e-9, pp.C) / dt;
        var vpp = w.e.state && w.e.state.vc ? w.e.state.vc : 0;
        cur = gc * (v - vpp);
        w.e.state = w.e.state || {}; w.e.state.vc = v;
      } else { cur = 0; w.e.state = w.e.state || {}; w.e.state.vc = v; }
    }
    if (!isFinite(v)) v = 0;
    if (!isFinite(cur)) cur = 0;
    w.e.res = {v:v, i:cur};
    if (w.e.type !== 'battery' && w.e.type !== 'voltmeter') totalP += Math.abs(v * cur);
    if (Math.abs(cur) > maxI) maxI = Math.abs(cur);
  }
  return {ok:true, parts:parts, maxI:maxI, totalP:totalP, nn:nn};
}

/* ---------- 그리기 ---------- */
var cv = document.getElementById('board'), ctx = cv.getContext('2d');
var lastRes = null, flowPhase = 0;

function clampView(){
  VC = Math.max(7, Math.min(GW, VC));
  ox = Math.max(0, Math.min(GW - VC, ox));
  oy = Math.max(0, Math.min(Math.max(0, GH - VR), oy));
}
function fitCanvas(){
  var w = cv.clientWidth || 600;
  VC = Math.max(7, Math.min(GW, VC));
  cell = w / VC;
  /* 화면 높이의 절반을 넘지 않게 — 휴대폰에서 눈금이 너무 작아지지 않도록 */
  var maxH = Math.max(230, Math.min(window.innerHeight * 0.58, cell * GH));
  VR = Math.max(6, Math.min(GH, Math.round(maxH / cell)));
  var h = cell * VR;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  clampView();
}
function gx(x){ return (x - ox) * cell; }
function gy(y){ return (y - oy) * cell; }

function elLen(e){ return Math.hypot(e.x2 - e.x1, e.y2 - e.y1); }
function elAngle(e){ return Math.atan2(e.y2 - e.y1, e.x2 - e.x1); }

function drawGrid(){
  ctx.fillStyle = '#f8fbfa';
  ctx.fillRect(0, 0, VC * cell + 2, VR * cell + 2);
  ctx.fillStyle = '#d3e0dc';
  var x0 = Math.max(0, Math.floor(ox)), x1 = Math.min(GW, Math.ceil(ox + VC));
  var y0 = Math.max(0, Math.floor(oy)), y1 = Math.min(GH, Math.ceil(oy + VR));
  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++){
    ctx.beginPath(); ctx.arc(gx(x), gy(y), 1.4, 0, 6.2832); ctx.fill();
  }
}

/* 부품 하나를 제자리에 돌려서 그린다 */
function withEl(e, fn){
  var L = elLen(e) * cell;
  ctx.save();
  ctx.translate(gx(e.x1), gy(e.y1));
  ctx.rotate(elAngle(e));
  fn(L);
  ctx.restore();
}
function lead(L, bodyW){
  var m = (L - bodyW) / 2;
  ctx.strokeStyle = '#5c7177'; ctx.lineWidth = Math.max(2, cell * 0.1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(m, 0); ctx.moveTo(L - m, 0); ctx.lineTo(L, 0); ctx.stroke();
  return m;
}

function drawEl(e, sel){
  var bri = 0;
  if (e.type === 'bulb' && e.res) bri = Math.min(1, Math.abs(e.res.i) / 0.3);
  var s = cell;
  withEl(e, function(L){
    if (e.type === 'wire'){
      ctx.strokeStyle = sel ? '#d98e3b' : '#5c7177';
      ctx.lineWidth = Math.max(2, s * 0.1); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke();
      return;
    }
    var bw = Math.min(L * 0.62, s * 1.25), m;
    if (e.type === 'battery'){
      m = lead(L, bw);
      var cx = L / 2, g = s * 0.17;
      ctx.strokeStyle = '#173238'; ctx.lineCap = 'butt';
      ctx.lineWidth = Math.max(3, s * 0.14);
      ctx.beginPath(); ctx.moveTo(cx - g, -s * 0.42); ctx.lineTo(cx - g, s * 0.42); ctx.stroke();
      ctx.lineWidth = Math.max(4, s * 0.2);
      ctx.beginPath(); ctx.moveTo(cx + g, -s * 0.2); ctx.lineTo(cx + g, s * 0.2); ctx.stroke();
    } else if (e.type === 'bulb'){
      m = lead(L, bw);
      var r = Math.min(bw, s * 1.05) / 2, bx = L / 2;
      if (bri > 0.02){
        var gl = ctx.createRadialGradient(bx, 0, r * 0.3, bx, 0, r * 2.6);
        gl.addColorStop(0, 'rgba(255,214,102,' + (0.85 * bri) + ')');
        gl.addColorStop(1, 'rgba(255,214,102,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(bx, 0, r * 2.6, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = bri > 0.02 ? ('rgb(255,' + Math.round(225 - 35 * (1 - bri)) + ',' + Math.round(120 + 90 * bri) + ')') : '#eef2f0';
      ctx.strokeStyle = '#173238'; ctx.lineWidth = Math.max(2, s * 0.08);
      ctx.beginPath(); ctx.arc(bx, 0, r, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx - r * 0.7, -r * 0.7); ctx.lineTo(bx + r * 0.7, r * 0.7);
      ctx.moveTo(bx + r * 0.7, -r * 0.7); ctx.lineTo(bx - r * 0.7, r * 0.7);
      ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.stroke();
    } else if (e.type === 'resistor'){
      m = lead(L, bw);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#173238'; ctx.lineWidth = Math.max(2, s * 0.08);
      ctx.beginPath(); ctx.rect(m, -s * 0.28, L - 2 * m, s * 0.56); ctx.fill(); ctx.stroke();
    } else if (e.type === 'switch'){
      m = lead(L, bw);
      ctx.strokeStyle = '#173238'; ctx.lineWidth = Math.max(2, s * 0.1); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m, 0);
      if (e.props.closed) ctx.lineTo(L - m, 0); else ctx.lineTo(L - m, -s * 0.5);
      ctx.stroke();
      ctx.fillStyle = '#173238';
      ctx.beginPath(); ctx.arc(m, 0, s * 0.1, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(L - m, 0, s * 0.1, 0, 6.2832); ctx.fill();
    } else if (e.type === 'ammeter' || e.type === 'voltmeter'){
      m = lead(L, bw);
      var rr = Math.min(bw, s * 1.0) / 2, mx = L / 2;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = e.type === 'ammeter' ? '#2f8f9d' : '#c1443c';
      ctx.lineWidth = Math.max(2, s * 0.09);
      ctx.beginPath(); ctx.arc(mx, 0, rr, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.font = '700 ' + Math.round(s * 0.62) + 'px "Space Grotesk",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.save(); ctx.translate(mx, 0); ctx.rotate(-elAngle(e));
      ctx.fillText(e.type === 'ammeter' ? 'A' : 'V', 0, s * 0.03); ctx.restore();
    } else if (e.type === 'capacitor'){
      m = lead(L, bw);
      var cx2 = L / 2, gg = s * 0.16;
      ctx.strokeStyle = '#173238'; ctx.lineWidth = Math.max(3, s * 0.13); ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(cx2 - gg, -s * 0.42); ctx.lineTo(cx2 - gg, s * 0.42);
      ctx.moveTo(cx2 + gg, -s * 0.42); ctx.lineTo(cx2 + gg, s * 0.42);
      ctx.stroke();
    }
  });

  if (sel){
    ctx.save();
    ctx.strokeStyle = '#d98e3b'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
    var pad = cell * 0.45;
    var x0 = Math.min(gx(e.x1), gx(e.x2)) - pad, y0 = Math.min(gy(e.y1), gy(e.y2)) - pad;
    ctx.strokeRect(x0, y0, Math.abs(gx(e.x2) - gx(e.x1)) + pad * 2, Math.abs(gy(e.y2) - gy(e.y1)) + pad * 2);
    ctx.restore();
  }

  ctx.fillStyle = '#5c7177';
  ctx.beginPath(); ctx.arc(gx(e.x1), gy(e.y1), Math.max(2, cell * 0.09), 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(gx(e.x2), gy(e.y2), Math.max(2, cell * 0.09), 0, 6.2832); ctx.fill();
}

function fmt(v, unit){
  var a = Math.abs(v);
  if (a < 1e-9) return '0 ' + unit;
  if (a < 0.001) return (v * 1e6).toFixed(0) + ' µ' + unit;
  if (a < 1)     return (v * 1000).toFixed(a < 0.01 ? 1 : 0) + ' m' + unit;
  if (a < 100)   return v.toFixed(2) + ' ' + unit;
  return v.toFixed(0) + ' ' + unit;
}

function drawLabels(){
  ctx.save();
  ctx.font = '600 ' + Math.max(10, Math.round(cell * 0.38)) + 'px "IBM Plex Mono",monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < els.length; i++){
    var e = els[i];
    if (e.type === 'wire') continue;
    var mx = (gx(e.x1) + gx(e.x2)) / 2, my = (gy(e.y1) + gy(e.y2)) / 2;
    var vert = Math.abs(e.x2 - e.x1) < 0.01;
    var tx = vert ? mx + cell * 1.15 : mx, ty = vert ? my : my - cell * 0.8;
    var lines = [], setLine = '';
    if (e.type === 'battery')   setLine = e.props.V.toFixed(1) + 'V';
    if (e.type === 'resistor' || e.type === 'bulb') setLine = e.props.R.toFixed(0) + 'Ω';
    if (e.type === 'capacitor') setLine = (e.props.C * 1000).toFixed(0) + 'mF';
    if (setLine) lines.push({t:setLine, c:'#a86825'});
    if (showValues && e.res){
      if (e.type === 'ammeter')        lines = [{t:fmt(Math.abs(e.res.i), 'A'), c:'#2f8f9d'}];
      else if (e.type === 'voltmeter') lines = [{t:fmt(Math.abs(e.res.v), 'V'), c:'#c1443c'}];
      else if (e.type !== 'switch')    lines.push({t:fmt(Math.abs(e.res.i), 'A') + ' / ' + fmt(Math.abs(e.res.v), 'V'), c:'#2f8f9d'});
    }
    if (!lines.length) continue;
    for (var k = 0; k < lines.length; k++){
      var yy = ty + (k - (lines.length - 1) / 2) * cell * 0.46;
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(248,251,250,.92)';
      ctx.strokeText(lines[k].t, tx, yy);
      ctx.fillStyle = lines[k].c;
      ctx.fillText(lines[k].t, tx, yy);
    }
  }
  ctx.restore();
}

/* 전류 흐름 — 작은 점이 흐른다 */
function drawFlow(){
  if (!showFlow || !lastRes || !lastRes.ok) return;
  var maxI = Math.max(1e-4, lastRes.maxI);
  for (var i = 0; i < els.length; i++){
    var e = els[i];
    var cur = (e.type === 'wire') ? (e.wi === undefined ? null : e.wi) : (e.res ? e.res.i : null);
    if (cur === null || Math.abs(cur) < maxI * 0.02) continue;
    var L = elLen(e), n = Math.max(1, Math.round(L * 1.6));
    var dir = cur >= 0 ? 1 : -1;
    var sp = 0.25 + 0.75 * Math.min(1, Math.abs(cur) / maxI);
    for (var k = 0; k < n; k++){
      var t = ((flowPhase * sp + k / n) % 1);
      if (dir < 0) t = 1 - t;
      var px = gx(e.x1 + (e.x2 - e.x1) * t), py = gy(e.y1 + (e.y2 - e.y1) * t);
      ctx.fillStyle = 'rgba(47,143,157,.85)';
      ctx.beginPath(); ctx.arc(px, py, Math.max(2, cell * 0.11), 0, 6.2832); ctx.fill();
    }
  }
}

function render(){
  drawGrid();
  var i;
  for (i = 0; i < els.length; i++) if (els[i].type === 'wire') drawEl(els[i], els[i].id === selId);
  drawFlow();
  for (i = 0; i < els.length; i++) if (els[i].type !== 'wire') drawEl(els[i], els[i].id === selId);
  drawLabels();
  if (drag.on && drag.moved){
    ctx.save();
    ctx.strokeStyle = 'rgba(217,142,59,.75)'; ctx.lineWidth = Math.max(3, cell * 0.12);
    ctx.setLineDash([6, 5]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(gx(drag.x0), gy(drag.y0)); ctx.lineTo(gx(drag.x1), gy(drag.y1)); ctx.stroke();
    ctx.restore();
  }
}

/* ---------- 선에 흐르는 전류 ---------- */
/* 선은 저항이 0이라 따로 풀리지 않는다. 묶인 선 뭉치마다 가지 구조를
   만들어 부품이 드나드는 전류를 끝에서부터 더해 올린다. */
function computeWireCurrents(){
  var i, e, k;
  for (i = 0; i < els.length; i++) if (els[i].type === 'wire') els[i].wi = 0;
  var wires = els.filter(function(w){ return w.type === 'wire'; });
  if (!wires.length) return;

  var key = function(x, y){ return x + ',' + y; };
  var inj = {};                       /* 점마다 선 뭉치로 들어오는 전류 */
  for (i = 0; i < els.length; i++){
    e = els[i];
    if (e.type === 'wire' || !e.res) continue;
    var a = key(e.x1, e.y1), b = key(e.x2, e.y2);
    inj[a] = (inj[a] || 0) - e.res.i;
    inj[b] = (inj[b] || 0) + e.res.i;
  }
  var adj = {};
  for (i = 0; i < wires.length; i++){
    var w = wires[i], p = key(w.x1, w.y1), q = key(w.x2, w.y2);
    (adj[p] = adj[p] || []).push({to:q, w:w, fwd:true});
    (adj[q] = adj[q] || []).push({to:p, w:w, fwd:false});
  }
  var seen = {};
  for (var start in adj){
    if (seen[start]) continue;
    /* 너비 우선으로 가지 구조(나무)를 만든다 */
    var order = [], parentEdge = {}, queue = [start];
    seen[start] = true;
    while (queue.length){
      var cur = queue.shift(); order.push(cur);
      var list = adj[cur] || [];
      for (k = 0; k < list.length; k++){
        if (!seen[list[k].to]){
          seen[list[k].to] = true;
          parentEdge[list[k].to] = {from:cur, w:list[k].w, fwd:list[k].fwd};
          queue.push(list[k].to);
        }
      }
    }
    /* 끝에서부터 더해 올린다 */
    var sum = {};
    for (k = 0; k < order.length; k++) sum[order[k]] = inj[order[k]] || 0;
    for (k = order.length - 1; k >= 1; k--){
      var node = order[k], pe = parentEdge[node];
      if (!pe) continue;
      pe.w.wi = pe.fwd ? -sum[node] : sum[node];
      sum[pe.from] += sum[node];
    }
  }
}

/* ---------- 바꿀 때마다 다시 풀기 ---------- */
function changed(){
  hasCap = els.some(function(e){ return e.type === 'capacitor'; });
  if (!hasCap){ lastRes = solve(0); computeWireCurrents(); }
  buildProps();
  save();
}

/* ---------- 손가락·마우스 ---------- */
var drag = {on:false, x0:0, y0:0, x1:0, y1:0, moved:false};

function evPos(ev){
  var r = cv.getBoundingClientRect();
  return {x:(ev.clientX - r.left) / cell + ox, y:(ev.clientY - r.top) / cell + oy};
}
function snap(p){
  return {x:Math.max(0, Math.min(GW, Math.round(p.x))), y:Math.max(0, Math.min(GH, Math.round(p.y)))};
}
function distToSeg(px, py, x1, y1, x2, y2){
  var dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
  var t = L2 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}
function elAt(p){
  for (var i = els.length - 1; i >= 0; i--){
    var e = els[i];
    if (distToSeg(p.x, p.y, e.x1, e.y1, e.x2, e.y2) < 0.42) return e;
  }
  return null;
}
function sameSeg(a, x1, y1, x2, y2){
  return (a.x1 === x1 && a.y1 === y1 && a.x2 === x2 && a.y2 === y2) ||
         (a.x1 === x2 && a.y1 === y2 && a.x2 === x1 && a.y2 === y1);
}
function addWire(x1, y1, x2, y2){
  var sx = Math.sign(x2 - x1), sy = Math.sign(y2 - y1);
  var n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
  for (var k = 0; k < n; k++){
    var ax = x1 + sx * k, ay = y1 + sy * k, bx = ax + sx, by = ay + sy;
    var dup = els.some(function(e){ return e.type === 'wire' && sameSeg(e, ax, ay, bx, by); });
    if (!dup) els.push({id:nextId++, type:'wire', x1:ax, y1:ay, x2:bx, y2:by, props:{}});
  }
}
function addPart(type, x1, y1, x2, y2){
  els.push({id:nextId++, type:type, x1:x1, y1:y1, x2:x2, y2:y2, props:defProps(type), state:{}});
  return els[els.length - 1];
}

cv.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  cv.setPointerCapture(ev.pointerId);
  var raw = evPos(ev), p = snap(raw);
  var pan = (tool === 'select' && !elAt(raw));
  drag = {on:true, x0:p.x, y0:p.y, x1:p.x, y1:p.y, moved:false,
          pan:pan, cx:ev.clientX, cy:ev.clientY, ox0:ox, oy0:oy};
});
cv.addEventListener('pointermove', function(ev){
  if (!drag.on) return;
  if (drag.pan){
    ox = drag.ox0 - (ev.clientX - drag.cx) / cell;
    oy = drag.oy0 - (ev.clientY - drag.cy) / cell;
    clampView();
    if (Math.abs(ev.clientX - drag.cx) + Math.abs(ev.clientY - drag.cy) > 6) drag.moved = true;
    return;
  }
  var p = snap(evPos(ev));
  var dx = p.x - drag.x0, dy = p.y - drag.y0;
  if (Math.abs(dx) >= Math.abs(dy)){ drag.x1 = p.x; drag.y1 = drag.y0; }
  else { drag.x1 = drag.x0; drag.y1 = p.y; }
  drag.moved = (drag.x1 !== drag.x0 || drag.y1 !== drag.y0);
});
cv.addEventListener('pointerup', function(ev){
  if (!drag.on) return;
  drag.on = false;
  var moved = drag.moved;
  if (!moved){ tapAt({x:drag.x0, y:drag.y0}); return; }
  if (tool === 'select' || tool === 'erase'){ drag.moved = false; return; }
  snapshot();
  if (tool === 'wire') addWire(drag.x0, drag.y0, drag.x1, drag.y1);
  else addPart(tool, drag.x0, drag.y0, drag.x1, drag.y1);
  drag.moved = false;
  changed();
});
cv.addEventListener('pointercancel', function(){ drag.on = false; drag.moved = false; });

function tapAt(p){
  var hit = elAt(p);
  if (tool === 'erase'){
    if (hit){ snapshot(); els = els.filter(function(e){ return e !== hit; }); selId = null; changed(); }
    return;
  }
  if (tool === 'select'){
    if (hit){
      if (hit.type === 'switch'){ snapshot(); hit.props.closed = !hit.props.closed; }
      selId = hit.id;
    } else selId = null;
    changed();
    return;
  }
  if (tool === 'wire') return;
  /* 끌지 않고 톡 눌러도 놓이게 — 오른쪽으로 두 칸 */
  var x2 = p.x + 2 <= GW ? p.x + 2 : p.x - 2;
  if (x2 < 0) return;
  snapshot();
  var e = addPart(tool, Math.min(p.x, x2), p.y, Math.max(p.x, x2), p.y);
  selId = e.id;
  changed();
}

/* ---------- 부품 고르는 줄 ---------- */
var ICONS = {
  select:'<path d="M6 4 L6 16 L10 12.5 L12.5 17 L15 16 L12.5 11.5 L17 11 Z" fill="currentColor"/>',
  wire:'<path d="M2 10 H32" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
  battery:'<path d="M2 10 H13 M21 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 3 V17" stroke="currentColor" stroke-width="2.6"/><path d="M20 6 V14" stroke="currentColor" stroke-width="4"/>',
  bulb:'<path d="M2 10 H8 M26 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11.5 4.5 L22.5 15.5 M22.5 4.5 L11.5 15.5" stroke="currentColor" stroke-width="1.6"/>',
  resistor:'<path d="M2 10 H8 M26 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="8" y="5" width="18" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>',
  'switch':'<path d="M2 14 H10 M24 14 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M10 14 L24 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="14" r="2" fill="currentColor"/><circle cx="24" cy="14" r="2" fill="currentColor"/>',
  ammeter:'<path d="M2 10 H8 M26 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="17" y="14" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">A</text>',
  voltmeter:'<path d="M2 10 H8 M26 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="17" y="14" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">V</text>',
  capacitor:'<path d="M2 10 H14 M20 10 H32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 3 V17 M20 3 V17" stroke="currentColor" stroke-width="2.6"/>',
  erase:'<path d="M6 15 L16 5 L26 13 L21 18 H9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M2 18 H30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
function buildTools(){
  var box = document.getElementById('tools');
  box.innerHTML = '';
  TOOLS.forEach(function(t){
    if (t.lv > level) return;
    var b = document.createElement('button');
    b.className = 'tool' + (tool === t.t ? ' on' : '');
    b.innerHTML = '<svg viewBox="0 0 34 20">' + ICONS[t.t] + '</svg><span>' + t.name + '</span>';
    b.onclick = function(){ tool = t.t; buildTools(); };
    box.appendChild(b);
  });
}

/* ---------- 고른 부품의 값 ---------- */
function buildProps(){
  var box = document.getElementById('propBox');
  var e = els.filter(function(q){ return q.id === selId; })[0];
  if (!e){ box.innerHTML = '<div class="empty-msg">화살표 도구로 부품을 누르면 값을 바꿀 수 있어요.</div>'; return; }
  var name = {wire:'선', battery:'전지', bulb:'전구', resistor:'저항', 'switch':'스위치',
              ammeter:'전류계', voltmeter:'전압계', capacitor:'축전기'}[e.type];
  var h = '<div style="font-weight:700;margin-bottom:6px">' + name + '</div>';
  function slider(id, label, unit, val, min, max, step){
    return '<div class="prop"><label>' + label + ' <b id="lb_' + id + '">' + val + unit + '</b></label>' +
           '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></div>';
  }
  if (e.type === 'battery'){
    h += slider('pV', '전압', 'V', e.props.V, 0.5, 12, 0.1);
    if (level >= 3) h += slider('pr', '내부저항', 'Ω', e.props.r, 0, 5, 0.1);
  } else if (e.type === 'bulb'){
    h += slider('pR', '저항', 'Ω', e.props.R, 1, 100, 1);
  } else if (e.type === 'resistor'){
    h += slider('pR', '저항', 'Ω', e.props.R, 1, 500, 1);
  } else if (e.type === 'capacitor'){
    h += slider('pC', '전기용량', 'mF', Math.round(e.props.C * 1000), 1, 500, 1);
  } else if (e.type === 'switch'){
    h += '<div class="rowbtns"><button class="act primary" id="pSw">' + (e.props.closed ? '열기' : '닫기') + '</button></div>';
  }
  if (e.res){
    h += '<div class="measure">전류 <b>' + fmt(Math.abs(e.res.i), 'A') + '</b> · 전압 <b>' + fmt(Math.abs(e.res.v), 'V') + '</b></div>';
  }
  h += '<div class="rowbtns"><button class="act" id="pRot">돌리기</button><button class="act danger" id="pDel">지우기</button></div>';
  box.innerHTML = h;

  function bind(id, fn){
    var el = document.getElementById(id);
    if (el) el.oninput = function(){ fn(parseFloat(el.value)); lastResDirty(); };
  }
  bind('pV', function(v){ e.props.V = v; document.getElementById('lb_pV').textContent = v.toFixed(1) + 'V'; });
  bind('pr', function(v){ e.props.r = v; document.getElementById('lb_pr').textContent = v.toFixed(1) + 'Ω'; });
  bind('pR', function(v){ e.props.R = v; document.getElementById('lb_pR').textContent = v.toFixed(0) + 'Ω'; });
  bind('pC', function(v){ e.props.C = v / 1000; document.getElementById('lb_pC').textContent = v.toFixed(0) + 'mF'; });
  var sw = document.getElementById('pSw');
  if (sw) sw.onclick = function(){ snapshot(); e.props.closed = !e.props.closed; changed(); };
  document.getElementById('pRot').onclick = function(){
    snapshot();
    var dx = e.x2 - e.x1, dy = e.y2 - e.y1;
    var nx = e.x1 - dy, ny = e.y1 + dx;
    if (nx < 0 || nx > GW || ny < 0 || ny > GH){ nx = e.x1 + dy; ny = e.y1 - dx; }
    if (nx < 0 || nx > GW || ny < 0 || ny > GH) return;
    e.x2 = nx; e.y2 = ny;
    changed();
  };
  document.getElementById('pDel').onclick = function(){
    snapshot(); els = els.filter(function(q){ return q !== e; }); selId = null; changed();
  };
}
function lastResDirty(){ if (!hasCap){ lastRes = solve(0); computeWireCurrents(); } save(); }

/* ---------- 합선 찾기 ---------- */
function shortedBattery(){
  var par = {}, i;
  function find(k){
    if (par[k] === undefined){ par[k] = k; return k; }
    while (par[k] !== k){ par[k] = par[par[k]]; k = par[k]; }
    return k;
  }
  function uni(a, b){ a = find(a); b = find(b); if (a !== b) par[a] = b; }
  var key = function(x, y){ return x + ',' + y; };
  for (i = 0; i < els.length; i++){
    var e = els[i];
    var shortish = e.type === 'wire' || (e.type === 'switch' && e.props.closed) || e.type === 'ammeter';
    if (shortish) uni(key(e.x1, e.y1), key(e.x2, e.y2));
    else { find(key(e.x1, e.y1)); find(key(e.x2, e.y2)); }
  }
  for (i = 0; i < els.length; i++){
    var b = els[i];
    if (b.type !== 'battery' || b.props.r > 1e-6) continue;
    if (find(key(b.x1, b.y1)) === find(key(b.x2, b.y2))) return true;
  }
  return false;
}

/* ---------- 측정값 ---------- */
function updateReadouts(){
  var bat = els.filter(function(e){ return e.type === 'battery'; });
  var I = 0, V = 0, P = lastRes && lastRes.ok ? lastRes.totalP : 0;
  for (var i = 0; i < bat.length; i++){
    V += bat[i].props.V;
    if (bat[i].res) I = Math.max(I, Math.abs(bat[i].res.i));
  }
  document.getElementById('roI').textContent = fmt(I, 'A');
  document.getElementById('roV').textContent = V ? V.toFixed(1) + ' V' : '0 V';
  document.getElementById('roR').textContent = I > 1e-6 ? fmt(V / I, 'Ω') : '— Ω';
  document.getElementById('roP').textContent = fmt(P, 'W');

  var rc = document.getElementById('rcRow');
  rc.style.display = hasCap ? '' : 'none';
  if (hasCap){
    var cap = els.filter(function(e){ return e.type === 'capacitor'; })[0];
    document.getElementById('roT').textContent = simTime.toFixed(1) + ' s';
    document.getElementById('roVc').textContent = fmt(cap && cap.res ? Math.abs(cap.res.v) : 0, 'V');
  }

  var msg = '';
  if (!els.length) msg = '';
  else if (!bat.length) msg = '전지가 없어요. 전지를 놓아야 전류가 흐릅니다.';
  else if (shortedBattery()) msg = '합선이에요 — 전지의 두 끝이 선으로만 이어져 있습니다. 사이에 전구나 저항을 넣어 주세요.';
  else if (I < 1e-7) msg = '전류가 흐르지 않아요. 회로가 한 바퀴 이어졌는지, 스위치가 닫혀 있는지 보세요.';
  else if (lastRes && lastRes.maxI > 5) msg = '전류가 너무 큽니다(' + lastRes.maxI.toFixed(1) + 'A). 실제라면 전선이 뜨거워져요.';
  var w = document.getElementById('warn');
  w.textContent = msg;
  w.classList.toggle('hidden', !msg);
}

/* ---------- 저장 ---------- */
function save(){
  try { localStorage.setItem('fxCircuit', JSON.stringify({els:els, level:level})); } catch (err) {}
}
function load(){
  try {
    var raw = localStorage.getItem('fxCircuit');
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || !d.els || !d.els.length) return false;
    els = d.els;
    level = d.level || 2;
    nextId = 1;
    els.forEach(function(e){ e.id = nextId++; e.state = e.state || {}; });
    return true;
  } catch (err) { return false; }
}

/* ---------- 보기 ---------- */

    addWire(14, 3, 17, 3); addWire(17, 3, 17, 12); addWire(17, 12, 3, 12); addWire(3, 12, 3, 9);
    addPart('voltmeter', 11, 7, 14, 7);
    addWire(11, 3, 11, 7); addWire(14, 3, 14, 7);

    addWire(3, 6, 3, 3); addWire(3, 3, 6, 3);
    addPart('switch', 6, 3, 9, 3);
    addWire(9, 3, 11, 3);
    addPart('resistor', 11, 3, 14, 3);

    addPart('capacitor', 16, 6, 16, 9);

function buildExamples(){
  var box = document.getElementById('examples');
  box.innerHTML = '<span style="font-size:13.5px;color:#4a636a;align-self:center">보기 회로:</span>';
  EXAMPLES.forEach(function(x){
    if (x.lv > level) return;
    var b = document.createElement('button');
    b.className = 'ex'; b.textContent = x.name;
    b.onclick = function(){
      snapshot();
      els = []; selId = null; simTime = 0;
      x.build();
      if (x.lv > level){ level = x.lv; setLevel(level); }
      changed();
    };
    box.appendChild(b);
  });
}

/* ---------- 수준 ---------- */
function setLevel(lv){
  level = lv;
  var btns = document.querySelectorAll('.lv');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', +btns[i].dataset.lv === lv);
  if (TOOLS.filter(function(t){ return t.t === tool; })[0].lv > level) tool = 'wire';
  buildTools(); buildExamples(); buildProps(); save();
}
var lvBtns = document.querySelectorAll('.lv');
for (var li = 0; li < lvBtns.length; li++){
  (function(b){ b.onclick = function(){ setLevel(+b.dataset.lv); }; })(lvBtns[li]);
}

/* ---------- 단추 ---------- */
function zoom(d){
  var cxg = ox + VC / 2, cyg = oy + VR / 2;
  VC = Math.max(7, Math.min(GW, VC + d));
  fitCanvas();
  ox = cxg - VC / 2; oy = cyg - VR / 2;
  clampView();
}
document.getElementById('btnZoomIn').onclick  = function(){ zoom(-4); };
document.getElementById('btnZoomOut').onclick = function(){ zoom(4); };
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnClear').onclick = function(){
  if (!els.length) return;
  snapshot(); els = []; selId = null; simTime = 0; changed();
};
document.getElementById('btnValues').onclick = function(){
  showValues = !showValues;
  this.textContent = showValues ? '값 숨기기' : '값 보기';
};
document.getElementById('btnFlow').onclick = function(){
  showFlow = !showFlow;
  this.textContent = showFlow ? '전류 흐름 끄기' : '전류 흐름 켜기';
};
document.getElementById('btnRCReset').onclick = function(){
  simTime = 0;
  els.forEach(function(e){ if (e.type === 'capacitor') e.state = {vc:0}; });
};

/* ---------- 움직이기 ---------- */
var lastT = 0;
function loop(ts){
  var dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
  lastT = ts;
  if (hasCap){
    simTime += dt;
    lastRes = solve(dt);
    computeWireCurrents();
  }
  flowPhase = (flowPhase + dt * 0.8) % 1;
  render();
  updateReadouts();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', function(){ fitCanvas(); });

/* ---------- 시작 ---------- */
if (!load()){
  EXAMPLES[0].build();
}
if (window.innerWidth < 560) VC = 13;
fitCanvas();
if (window.innerWidth < 560){ ox = 2; oy = 1; clampView(); }
setLevel(level);
document.getElementById('btnUndo').disabled = true;
changed();
requestAnimationFrame(loop);
</script>
