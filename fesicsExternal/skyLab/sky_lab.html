<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>하늘 실험실</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--paper:#eef2f0;--grid:#c9d6d2;--ink:#173238;--ink-soft:#4a636a;--brass:#d98e3b;--brass-dark:#a86825;--teal:#2f8f9d;--coral:#c1443c;--card:#fff;--radius:14px;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:radial-gradient(var(--grid) 1.2px,transparent 1.2px) 0 0/20px 20px,var(--paper);
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);font-size:17px;line-height:1.55;
  padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%;}
.app{max-width:1500px;margin:0 auto;}
h1{font-family:'Space Grotesk',sans-serif;font-size:27px;margin:0 0 4px;line-height:1.2;}
.subtitle{color:var(--ink-soft);font-size:16px;margin:0 0 12px;}
.card{background:var(--card);border:1px solid #d5e0dc;border-radius:var(--radius);box-shadow:0 3px 0 rgba(23,50,56,.05);padding:14px 16px;}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 10px;}
main.layout{display:grid;grid-template-columns:1fr minmax(270px,340px);gap:14px;align-items:start;}
@media (max-width:900px){main.layout{grid-template-columns:1fr;}}
.levels{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.lv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:8px 18px;border-radius:999px;
  border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;}
.lv.on{background:var(--ink);color:#fff;}
canvas#dome{width:100%;height:auto;display:block;border-radius:11px;background:#0b1118;border:1px solid #070c11;}
canvas#graph{width:100%;height:auto;display:block;border-radius:9px;background:#f6faf9;border:1px solid #dce8e5;margin-top:4px;}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
button.act{font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:9px;border:1.5px solid #cddad6;
  background:#fff;color:var(--ink-soft);cursor:pointer;touch-action:manipulation;}
button.act.on{background:var(--brass);color:#fff;border-color:var(--brass);}
.exrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.ex{font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid #cddad6;
  background:#fff;color:var(--ink-soft);cursor:pointer;}
.prop{margin-top:9px;}
.prop label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft);
  margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
.prop label b{color:var(--brass-dark);font-size:17px;}
input[type=range]{width:100%;accent-color:var(--brass);height:9px;}
.readout{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:#f6faf9;
  border:1px dashed #b7cdc9;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.readout span{color:var(--ink-soft);font-size:13.5px;display:block;}
.readout b{color:var(--teal);font-size:17px;}
.hint{margin-top:10px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;background:#f6faf9;
  border-radius:10px;padding:10px 12px;border:1px dashed #b7cdc9;}
.note{margin-top:8px;font-size:14px;color:var(--ink-soft);line-height:1.5;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <h1>하늘 실험실</h1>
  <p class="subtitle">날짜·시각·위도를 바꾸면 해와 별이 하늘 어디에 있는지 실제 천문 계산으로 보여 줍니다.</p>

  <div class="levels">
    <button class="lv" data-lv="1">초등</button>
    <button class="lv on" data-lv="2">중등</button>
    <button class="lv" data-lv="3">고등</button>
  </div>

  <main class="layout">
    <section class="card">
      <canvas id="dome"></canvas>
      <div class="rowbtns">
        <button class="act" id="btnPlay">하루 돌리기</button>
        <button class="act" id="btnYear">한 해 돌리기</button>
        <button class="act on" id="btnSeason">계절 비교</button>
        <button class="act on" id="btnStars">별</button>
        <button class="act" id="btnTrail">별의 일주운동</button>
        <button class="act on" id="btnMoon">달</button>
      </div>
      <div class="exrow" id="examples"></div>
      <div class="hint" id="hint">아래 손잡이로 <b>날짜·시각·위도</b>를 바꿔 보세요. 노란 길은 그날 해가 지나가는 길입니다.</div>
    </section>

    <aside>
      <div class="card">
        <h2>언제, 어디서</h2>
        <div class="prop"><label>날짜 <b id="lbDate">6월 21일</b></label>
          <input type="range" id="sDate" min="1" max="365" step="1" value="172"></div>
        <div class="prop"><label>시각 <b id="lbTime">12:00</b></label>
          <input type="range" id="sTime" min="0" max="1439" step="1" value="720"></div>
        <div class="prop"><label>위도 <b id="lbLat">37.5°N</b></label>
          <input type="range" id="sLat" min="-90" max="90" step="0.5" value="37.5"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>해</h2>
        <div class="readout">
          <div><span>고도</span><b id="roAlt">—</b></div>
          <div><span>방위</span><b id="roAz">—</b></div>
          <div><span>남중 고도</span><b id="roNoon">—</b></div>
          <div><span>낮의 길이</span><b id="roDay">—</b></div>
          <div><span>해 뜨는 때</span><b id="roRise">—</b></div>
          <div><span>해 지는 때</span><b id="roSet">—</b></div>
        </div>
        <div id="decRow" class="note" style="display:none"></div>
        <canvas id="graph"></canvas>
        <div class="note">해의 고도가 하루 동안 어떻게 바뀌는지 — 굵은 선이 오늘입니다.</div>
      </div>

      <div class="card" id="moonCard" style="margin-top:14px">
        <h2>달</h2>
        <div class="readout">
          <div><span>달의 모양</span><b id="roPhase">—</b></div>
          <div><span>밝은 부분</span><b id="roLit">—</b></div>
          <div><span>고도</span><b id="roMAlt">—</b></div>
          <div><span>방위</span><b id="roMAz">—</b></div>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
/* ===========================================================
   하늘 실험실 — 해·달·별의 자리를 실제 천문 계산으로 구한다.
   율리우스일 → 태양·달의 적경·적위 → 지방 항성시 → 고도·방위.
   =========================================================== */

var YEAR = 2026;
var LON = 127.0;          /* 경도(서울 부근). 표준시는 동경 135도 기준 */
var TZ = 9;               /* 한국 표준시 = 세계시 + 9시간 */

var D2R = Math.PI / 180, R2D = 180 / Math.PI;
function sin(d){ return Math.sin(d * D2R); }
function cos(d){ return Math.cos(d * D2R); }
function wrap360(x){ x = x % 360; return x < 0 ? x + 360 : x; }

/* 그 해 1월 0일의 율리우스일 */
function jdYearStart(y){
  var Y = y - 1, M = 13;   /* 1월을 전해 13월로 다룬다 */
  var A = Math.floor(Y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + 0 + B - 1524.5;
}
var JD0 = jdYearStart(YEAR);

/* 몇째 날(1~365)과 분 단위 시각(한국 표준시) → 율리우스일 */
function jdOf(day, minutes){
  return JD0 + day + (minutes / 1440) - (TZ / 24);
}
/* 몇째 날 → 몇 월 며칠 */
var MDAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
function monthDay(day){
  var d = day, m = 0;
  while (m < 12 && d > MDAYS[m]){ d -= MDAYS[m]; m++; }
  return [m + 1, d];
}
function dayOf(m, d){
  var s = 0;
  for (var i = 0; i < m - 1; i++) s += MDAYS[i];
  return s + d;
}

/* 지방 항성시(도) */
function lstDeg(jd){
  var T = jd - 2451545.0;
  return wrap360(280.46061837 + 360.98564736629 * T + LON);
}

/* 태양의 적경·적위 */
function sunPos(jd){
  var n = jd - 2451545.0;
  var L = wrap360(280.460 + 0.9856474 * n);
  var g = wrap360(357.528 + 0.9856003 * n);
  var lam = L + 1.915 * sin(g) + 0.020 * sin(2 * g);
  var eps = 23.439 - 0.0000004 * n;
  var ra = Math.atan2(cos(eps) * sin(lam), cos(lam)) * R2D;
  var dec = Math.asin(sin(eps) * sin(lam)) * R2D;
  return {ra:wrap360(ra), dec:dec, lam:wrap360(lam)};
}

/* 달의 적경·적위(간단한 식 — 학교에서 쓸 만큼은 맞는다) */
function moonPos(jd){
  var n = jd - 2451545.0;
  var Lp = wrap360(218.316 + 13.176396 * n);
  var M  = wrap360(134.963 + 13.064993 * n);
  var F  = wrap360(93.272 + 13.229350 * n);
  var lam = Lp + 6.289 * sin(M);
  var bet = 5.128 * sin(F);
  var eps = 23.439 - 0.0000004 * n;
  var x = cos(bet) * cos(lam);
  var y = cos(eps) * cos(bet) * sin(lam) - sin(eps) * sin(bet);
  var z = sin(eps) * cos(bet) * sin(lam) + cos(eps) * sin(bet);
  return {ra:wrap360(Math.atan2(y, x) * R2D), dec:Math.asin(z) * R2D, lam:wrap360(lam)};
}

/* 적경·적위 → 고도·방위(방위는 북쪽이 0, 동쪽이 90) */
function altAz(ra, dec, lst, lat){
  var Hdeg = wrap360(lst - ra);
  var sa = sin(lat) * sin(dec) + cos(lat) * cos(dec) * cos(Hdeg);
  sa = Math.max(-1, Math.min(1, sa));
  var alt = Math.asin(sa) * R2D;
  var az = Math.atan2(-cos(dec) * sin(Hdeg),
                      sin(dec) * cos(lat) - cos(dec) * sin(lat) * cos(Hdeg)) * R2D;
  return {alt:alt, az:wrap360(az), H:Hdeg};
}

/* 해 뜨고 지는 때 — 1분씩 훑어서 찾는다(균시차·경도까지 저절로 들어간다) */
function sunDay(day, lat){
  var prev = null, rise = null, set = null, maxAlt = -90, maxMin = 0, above = 0;
  for (var m = 0; m <= 1440; m += 1){
    var jd = jdOf(day, m), sp = sunPos(jd);
    var aa = altAz(sp.ra, sp.dec, lstDeg(jd), lat);
    if (aa.alt > maxAlt){ maxAlt = aa.alt; maxMin = m; }
    if (aa.alt > -0.833) above++;
    if (prev !== null){
      if (prev <= -0.833 && aa.alt > -0.833) rise = m;
      if (prev > -0.833 && aa.alt <= -0.833) set = m;
    }
    prev = aa.alt;
  }
  return {rise:rise, set:set, maxAlt:maxAlt, noonMin:maxMin, dayMin:above};
}

/* ---------- 별 ---------- */
/* 적경(시), 적위(도), 밝기, 이름 */
var STARS = [
  [2.530, 89.264, 2.0, '북극성'],
  [11.062, 61.751, 1.8, ''], [11.031, 56.382, 2.4, ''], [11.897, 53.695, 2.4, ''],
  [12.257, 57.033, 3.3, ''], [12.900, 55.960, 1.8, ''], [13.399, 54.925, 2.2, ''],
  [13.792, 49.313, 1.9, ''],
  [0.675, 56.537, 2.2, ''], [0.153, 59.150, 2.3, ''], [0.945, 60.717, 2.5, ''],
  [1.430, 60.235, 2.7, ''], [1.907, 63.670, 3.4, ''],
  [5.919, 7.407, 0.5, '베텔게우스'], [5.242, -8.202, 0.2, '리겔'],
  [5.418, 6.350, 1.6, ''], [5.796, -9.670, 2.1, ''],
  [5.679, -1.943, 1.8, ''], [5.604, -1.202, 1.7, ''], [5.533, -0.299, 2.2, ''],
  [6.752, -16.716, -1.4, '시리우스'], [7.655, 5.225, 0.4, '프로키온'],
  [18.615, 38.784, 0.0, '직녀별'], [20.690, 45.280, 1.2, '데네브'], [19.846, 8.868, 0.8, '견우별'],
  [14.261, 19.182, -0.05, '아크투루스'], [13.420, -11.161, 1.0, '스피카'],
  [16.490, -26.432, 1.1, '안타레스'], [4.599, 16.509, 0.9, '알데바란'],
  [5.278, 45.998, 0.1, '카펠라'], [7.755, 28.026, 1.1, '폴룩스'], [7.577, 31.888, 1.6, ''],
  [10.140, 11.967, 1.4, '레굴루스'], [22.961, -29.622, 1.2, ''], [1.629, -57.237, 0.5, '']
];
var LINES = [
  {name:'북두칠성', idx:[1,2,3,4,5,6,7], color:'rgba(140,200,255,.55)'},
  {name:'카시오페이아', idx:[9,8,10,11,12], color:'rgba(140,200,255,.55)'},
  {name:'오리온', idx:[13,15,19,18,17,16,20,13], color:'rgba(255,190,150,.5)'},
  {name:'삼태성', idx:[17,18,19], color:'rgba(255,220,180,.8)'},
  {name:'여름철 대삼각형', idx:[22,23,24,22], color:'rgba(170,255,210,.45)'},
  {name:'겨울철 대삼각형', idx:[20,21,13,20], color:'rgba(170,220,255,.4)'}
];

/* ---------- 지금 보고 있는 값 ---------- */
var day = 172, minute = 720, lat = 37.5, level = 2;
var showSeason = true, showStars = true, showTrail = false, showMoon = true;
var playDay = false, playYear = false;

/* ---------- 그리기 바탕 ---------- */
var cv = document.getElementById('dome'), ctx = cv.getContext('2d');
var gc = document.getElementById('graph'), gx2 = gc.getContext('2d');
var W = 900, H = 600, cx = 450, cy = 350, R = 268;
var ELEV = 22;                 /* 남쪽에서 비스듬히 내려다본 각 */
var scale = 1;

/* 가로로 들면 화면이 낮아진다 — 가로·세로 둘 다 보고 배율을 정한다 (261121) */
function fitAll(){
  var box = cv.parentNode;
  var avail = Math.max(260, (box.clientWidth || 700) - 32);
  var maxH = Math.max(240, window.innerHeight * 0.82);
  scale = Math.min(avail / W, maxH / H);
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.style.margin = '0 auto';
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

  var gw = gc.clientWidth || 300, gh = Math.max(120, Math.round(gw * 0.52));
  gc.width = Math.round(gw * dpr); gc.height = Math.round(gh * dpr);
  gc.style.height = gh + 'px';
  gx2.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function lw(px){ return px / scale; }

/* 고도·방위 → 화면 자리 (남쪽을 바라본 모습: 동이 왼쪽, 서가 오른쪽) */
function proj(alt, az){
  var e = cos(alt) * sin(az), nn = cos(alt) * cos(az), u = sin(alt);
  return [cx - R * e, cy + R * (nn * sin(ELEV) - u * cos(ELEV))];
}

/* ---------- 하늘 빛깔 ---------- */
function skyColors(sunAlt){
  if (sunAlt > 6)   return ['#5fa8d8', '#9fcbe6'];
  if (sunAlt > 0)   return ['#5a86b4', '#e8a76a'];
  if (sunAlt > -6)  return ['#2d3f66', '#d87f4e'];
  if (sunAlt > -12) return ['#182544', '#5a4a63'];
  if (sunAlt > -18) return ['#101a33', '#23243f'];
  return ['#070c15', '#0d1522'];
}

/* ---------- 지평선과 방위 ---------- */
function drawGround(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = lw(2);
  ctx.beginPath();
  for (var a = 0; a <= 360; a += 3){
    var p = proj(0, a);
    if (a === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  var gg = ctx.createLinearGradient(0, cy - R*0.4, 0, cy + R*0.42);
  gg.addColorStop(0, 'rgba(58,74,58,.82)'); gg.addColorStop(1, 'rgba(40,52,42,.9)');
  ctx.fillStyle = gg; ctx.fill();
  ctx.stroke();
  var marks = [[0,'북'],[90,'동'],[180,'남'],[270,'서']];
  ctx.font = '700 ' + lw(19) + 'px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var k = 0; k < marks.length; k++){
    var q = proj(0, marks[k][0]);
    ctx.fillStyle = '#ffe9b8';
    ctx.beginPath(); ctx.arc(q[0], q[1], lw(4), 0, 6.2832); ctx.fill();
    var off = marks[k][0] === 0 ? 22 : (marks[k][0] === 180 ? -20 : 0);
    var dx = marks[k][0] === 90 ? -24 : (marks[k][0] === 270 ? 24 : 0);
    ctx.fillStyle = '#fff3d6';
    ctx.fillText(marks[k][1], q[0] + lw(dx), q[1] + lw(off));
  }
  ctx.restore();
}

/* ---------- 해가 지나가는 길 ---------- */
function drawSunPath(d, col, wid, dash){
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = lw(wid);
  if (dash) ctx.setLineDash([lw(6), lw(6)]);
  var started = false;
  ctx.beginPath();
  for (var m = 0; m <= 1440; m += 8){
    var jd = jdOf(d, m), sp = sunPos(jd);
    var aa = altAz(sp.ra, sp.dec, lstDeg(jd), lat);
    if (aa.alt < -1){ started = false; continue; }
    var p = proj(aa.alt, aa.az);
    if (!started){ ctx.moveTo(p[0], p[1]); started = true; } else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
  ctx.restore();
}

/* ---------- 별 ---------- */
function starSize(mag){ return Math.max(1.3, 4.6 - mag * 0.95); }
function drawStars(lst, dim){
  var pts = [];
  for (var i = 0; i < STARS.length; i++){
    var s = STARS[i];
    var aa = altAz(s[0] * 15, s[1], lst, lat);
    pts.push({aa:aa, p:proj(aa.alt, aa.az), s:s});
  }
  ctx.save();
  ctx.globalAlpha = dim;
  if (level >= 2){
    for (var L = 0; L < LINES.length; L++){
      var ln = LINES[L], any = false;
      for (var z = 0; z < ln.idx.length; z++) if (pts[ln.idx[z]].aa.alt > 0) any = true;
      if (!any) continue;
      /* 지평선 아래로 내려간 별은 이어지 않는다
         — 그렇지 않으면 엉뚱한 줄이 땅 위로 나타난다 */
      ctx.strokeStyle = ln.color; ctx.lineWidth = lw(1.5);
      ctx.beginPath();
      var pen = false;
      for (var z2 = 0; z2 < ln.idx.length; z2++){
        var it2 = pts[ln.idx[z2]];
        if (it2.aa.alt <= 0){ pen = false; continue; }
        if (!pen){ ctx.moveTo(it2.p[0], it2.p[1]); pen = true; }
        else ctx.lineTo(it2.p[0], it2.p[1]);
      }
      ctx.stroke();
    }
  }
  ctx.font = '600 ' + lw(12) + 'px "Noto Sans KR",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (var j = 0; j < pts.length; j++){
    var it = pts[j];
    if (it.aa.alt < 0) continue;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(it.p[0], it.p[1], lw(starSize(it.s[2])), 0, 6.2832); ctx.fill();
    if (it.s[3] && level >= 2){
      ctx.fillStyle = 'rgba(200,225,255,.8)';
      ctx.fillText(it.s[3], it.p[0] + lw(7), it.p[1] - lw(8));
    }
  }
  ctx.restore();
}

/* 별의 일주운동 — 적위가 같은 둘레를 한 바퀴 그린다 */
function drawTrails(lst){
  ctx.save();
  ctx.strokeStyle = 'rgba(150,200,255,.35)'; ctx.lineWidth = lw(1.2);
  for (var i = 0; i < STARS.length; i++){
    if (STARS[i][2] > 1.6) continue;
    var dec = STARS[i][1], ra = STARS[i][0] * 15, on = false;
    ctx.beginPath();
    for (var h = 0; h <= 360; h += 4){
      var aa = altAz(ra, dec, ra + h, lat);
      if (aa.alt < 0){ on = false; continue; }
      var p = proj(aa.alt, aa.az);
      if (!on){ ctx.moveTo(p[0], p[1]); on = true; } else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 달 ---------- */
function drawMoonDisc(x, y, r, k, ang){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = 'rgba(70,78,92,.95)';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
  var a = (1 - 2 * k) * r, P = [], th;
  for (th = -90; th <= 90; th += 6) P.push([r * cos(th), r * sin(th)]);
  for (th = 90; th >= -90; th -= 6) P.push([a * cos(th), r * sin(th)]);
  ctx.fillStyle = '#f5f0e0';
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (var i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = r * 0.07;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
  ctx.restore();
}
function phaseName(elong, k){
  if (k < 0.04) return '삭(그믐달 뒤)';
  if (k > 0.96) return '보름달';
  var waxing = elong < 180;
  if (k < 0.46) return waxing ? '초승달' : '그믐달';
  if (k < 0.54) return waxing ? '상현달' : '하현달';
  return waxing ? '차오르는 달' : '기우는 달';
}

/* ---------- 전체 그리기 ---------- */
var cur = {};
function render(){
  var jd = jdOf(day, minute), lst = lstDeg(jd);
  var sp = sunPos(jd), sa = altAz(sp.ra, sp.dec, lst, lat);
  var mp = moonPos(jd), ma = altAz(mp.ra, mp.dec, lst, lat);
  var elong = wrap360(mp.lam - sp.lam);
  var k = (1 - cos(elong)) / 2;
  cur = {sp:sp, sa:sa, mp:mp, ma:ma, elong:elong, k:k};

  var col = skyColors(sa.alt);
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* 별은 어두울 때만 */
  var dim = sa.alt > 0 ? 0 : Math.min(1, (-sa.alt) / 12);
  if (showStars && dim > 0.02){
    if (showTrail) drawTrails(lst);
    drawStars(lst, dim);
  }

  /* 천구 북극과 천의 적도 */
  if (level >= 2){
    var np = proj(Math.abs(lat), lat >= 0 ? 0 : 180);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = lw(1.4);
    ctx.beginPath(); ctx.arc(np[0], np[1], lw(7), 0, 6.2832); ctx.stroke();
    ctx.font = '600 ' + lw(12) + 'px "Noto Sans KR",sans-serif';
    /* 가운데 위에 두면 '남' 글자와 겹친다 — 오른쪽으로 비컰 놓는다 */
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.textAlign = 'left';
    ctx.fillText(lat >= 0 ? '천구 북극' : '천구 남극', np[0] + lw(11), np[1] + lw(3));
  }
  if (level >= 3){
    ctx.strokeStyle = 'rgba(160,255,220,.4)'; ctx.lineWidth = lw(1.2); ctx.setLineDash([lw(5), lw(5)]);
    var on = false; ctx.beginPath();
    for (var h = 0; h <= 360; h += 3){
      var aa = altAz(0, 0, h, lat);
      if (aa.alt < 0){ on = false; continue; }
      var p = proj(aa.alt, aa.az);
      if (!on){ ctx.moveTo(p[0], p[1]); on = true; } else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  drawGround();

  /* 계절 비교 */
  if (showSeason){
    drawSunPath(172, 'rgba(255,190,90,.35)', 2, true);   /* 하지 */
    drawSunPath(356, 'rgba(150,200,255,.35)', 2, true);  /* 동지 */
    drawSunPath(80,  'rgba(220,220,220,.3)', 2, true);   /* 춘분 */
  }
  drawSunPath(day, 'rgba(255,214,102,.9)', 3, false);

  /* 천정 */
  var zp = proj(90, 0);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = lw(1.4);
  ctx.beginPath(); ctx.moveTo(zp[0] - lw(8), zp[1]); ctx.lineTo(zp[0] + lw(8), zp[1]);
  ctx.moveTo(zp[0], zp[1] - lw(8)); ctx.lineTo(zp[0], zp[1] + lw(8)); ctx.stroke();

  /* 해 */
  var sPos = proj(sa.alt, sa.az);
  if (sa.alt > -2){
    var gl = ctx.createRadialGradient(sPos[0], sPos[1], 2, sPos[0], sPos[1], lw(46));
    gl.addColorStop(0, 'rgba(255,230,140,.95)'); gl.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sPos[0], sPos[1], lw(46), 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(sPos[0], sPos[1], lw(13), 0, 6.2832); ctx.fill();
  }

  /* 달 */
  if (showMoon && ma.alt > -2){
    var mPos = proj(ma.alt, ma.az);
    var ang = Math.atan2(sPos[1] - mPos[1], sPos[0] - mPos[0]);
    drawMoonDisc(mPos[0], mPos[1], lw(13), k, ang);
  }

  updateReadouts();
  drawGraph();
}

/* ---------- 해 뜨고 지는 때는 날짜·위도가 바뀔 때만 다시 센다 ---------- */
var dayCache = null, dayKey = '';
function todayInfo(){
  var key = day + '/' + lat;
  if (key !== dayKey){ dayKey = key; dayCache = sunDay(day, lat); }
  return dayCache;
}
function hhmm(m){
  if (m === null || m === undefined) return '—';
  var h = Math.floor(m / 60) % 24, mi = Math.round(m % 60);
  return h + ':' + (mi < 10 ? '0' : '') + mi;
}
function azName(a){
  var names = ['북','북동','동','남동','남','남서','서','북서'];
  return names[Math.round(wrap360(a) / 45) % 8];
}

function updateReadouts(){
  var info = todayInfo(), sa = cur.sa;
  document.getElementById('roAlt').textContent = sa.alt.toFixed(1) + '°';
  document.getElementById('roAz').textContent = azName(sa.az) + ' ' + sa.az.toFixed(0) + '°';
  document.getElementById('roNoon').textContent = info.maxAlt.toFixed(1) + '°';
  var dm = info.dayMin;
  document.getElementById('roDay').textContent =
    (dm >= 1439) ? '하루 종일' : (dm <= 1 ? '해가 안 뜸' : Math.floor(dm/60) + '시간 ' + (dm%60) + '분');
  document.getElementById('roRise').textContent = hhmm(info.rise);
  document.getElementById('roSet').textContent = hhmm(info.set);

  var dr = document.getElementById('decRow');
  dr.style.display = level >= 3 ? '' : 'none';
  if (level >= 3){
    dr.innerHTML = '적위 δ = <b>' + cur.sp.dec.toFixed(2) + '°</b> · 시간각 H = <b>' +
      (sa.H > 180 ? sa.H - 360 : sa.H).toFixed(1) + '°</b> · 적경 = <b>' +
      (cur.sp.ra / 15).toFixed(2) + 'h</b><br>남중 시각 <b>' + hhmm(info.noonMin) +
      '</b> — 12시가 아닌 까닭은 경도(' + LON + '°)와 균시차 때문입니다.';
  }

  var mc = document.getElementById('moonCard');
  mc.style.display = showMoon ? '' : 'none';
  if (showMoon){
    document.getElementById('roPhase').textContent = phaseName(cur.elong, cur.k);
    document.getElementById('roLit').textContent = Math.round(cur.k * 100) + '%';
    document.getElementById('roMAlt').textContent = cur.ma.alt.toFixed(1) + '°';
    document.getElementById('roMAz').textContent = azName(cur.ma.az) + ' ' + cur.ma.az.toFixed(0) + '°';
  }
}

/* ---------- 고도-시각 그래프 ---------- */
var curveCache = {}, curveLat = null;
function altCurve(d){
  if (curveLat !== lat){ curveCache = {}; curveLat = lat; }
  if (curveCache[d]) return curveCache[d];
  var arr = [];
  for (var m = 0; m <= 1440; m += 10){
    var jd = jdOf(d, m), sp = sunPos(jd);
    arr.push(altAz(sp.ra, sp.dec, lstDeg(jd), lat).alt);
  }
  curveCache[d] = arr;
  return arr;
}
function drawGraph(){
  var w = gc.clientWidth || 300, h = parseFloat(gc.style.height) || 160;
  gx2.clearRect(0, 0, w, h);
  var pad = 26, iw = w - pad - 8, ih = h - pad - 6;
  function X(m){ return pad + iw * m / 1440; }
  function Y(a){ return 6 + ih * (90 - a) / 120; }        /* -30 ~ 90도 */
  gx2.strokeStyle = '#dce8e5'; gx2.lineWidth = 1;
  gx2.beginPath(); gx2.moveTo(pad, Y(0)); gx2.lineTo(w - 8, Y(0)); gx2.stroke();
  gx2.strokeStyle = '#eef2f0';
  for (var hh = 0; hh <= 24; hh += 6){
    gx2.beginPath(); gx2.moveTo(X(hh*60), 6); gx2.lineTo(X(hh*60), 6 + ih); gx2.stroke();
  }
  gx2.fillStyle = '#9bb0b4'; gx2.font = '500 10px "IBM Plex Mono",monospace';
  gx2.textAlign = 'center';
  for (var h2 = 0; h2 <= 24; h2 += 6) gx2.fillText(h2 + '시', X(h2*60), h - 4);
  gx2.textAlign = 'right';
  gx2.fillText('90°', pad - 4, Y(90) + 4);
  gx2.fillText('0°', pad - 4, Y(0) + 4);
  function curve(d, col, wid){
    var arr = altCurve(d);
    gx2.strokeStyle = col; gx2.lineWidth = wid;
    gx2.beginPath();
    for (var i = 0; i < arr.length; i++){
      var px = X(i * 10), py = Y(Math.max(-30, arr[i]));
      if (i === 0) gx2.moveTo(px, py); else gx2.lineTo(px, py);
    }
    gx2.stroke();
  }
  if (showSeason){
    curve(172, 'rgba(217,142,59,.45)', 1.6);
    curve(80, 'rgba(120,140,145,.45)', 1.6);
    curve(356, 'rgba(47,143,157,.45)', 1.6);
  }
  curve(day, '#d98e3b', 2.6);
  var mx = X(minute);
  gx2.strokeStyle = '#c1443c'; gx2.lineWidth = 1.4;
  gx2.beginPath(); gx2.moveTo(mx, 6); gx2.lineTo(mx, 6 + ih); gx2.stroke();
}

/* ---------- 손잡이 ---------- */
var sDate = document.getElementById('sDate'), sTime = document.getElementById('sTime'),
    sLat = document.getElementById('sLat');
function syncLabels(){
  var md = monthDay(day);
  document.getElementById('lbDate').textContent = md[0] + '월 ' + md[1] + '일';
  document.getElementById('lbTime').textContent = hhmm(minute);
  document.getElementById('lbLat').textContent = Math.abs(lat).toFixed(1) + '°' + (lat >= 0 ? 'N' : 'S');
  sDate.value = day; sTime.value = minute; sLat.value = lat;
}
sDate.oninput = function(){ day = +sDate.value; syncLabels(); render(); };
sTime.oninput = function(){ minute = +sTime.value; syncLabels(); render(); };
sLat.oninput  = function(){ lat = +sLat.value; syncLabels(); render(); };

/* ---------- 단추 ---------- */
function tog(id, get, set){
  var b = document.getElementById(id);
  b.onclick = function(){ set(!get()); b.classList.toggle('on', get()); render(); };
}
tog('btnSeason', function(){ return showSeason; }, function(v){ showSeason = v; });
tog('btnStars',  function(){ return showStars; },  function(v){ showStars = v; });
tog('btnTrail',  function(){ return showTrail; },  function(v){ showTrail = v; });
tog('btnMoon',   function(){ return showMoon; },   function(v){ showMoon = v; });
document.getElementById('btnPlay').onclick = function(){
  playDay = !playDay; playYear = false;
  this.classList.toggle('on', playDay);
  document.getElementById('btnYear').classList.remove('on');
};
document.getElementById('btnYear').onclick = function(){
  playYear = !playYear; playDay = false;
  this.classList.toggle('on', playYear);
  document.getElementById('btnPlay').classList.remove('on');
};

/* ---------- 보기 ---------- */
function fullMoonDay(from){
  var best = from, bk = -1;
  for (var d = from; d < from + 32; d++){
    var dd = ((d - 1) % 365) + 1;
    var jd = jdOf(dd, 1260), sp = sunPos(jd), mp = moonPos(jd);
    var kk = (1 - cos(wrap360(mp.lam - sp.lam))) / 2;
    if (kk > bk){ bk = kk; best = dd; }
  }
  return best;
}
var EXAMPLES = [
  {name:'하지', lv:1, go:function(){ day = 172; minute = 750; lat = 37.5; showSeason = true; }},
  {name:'동지', lv:1, go:function(){ day = 356; minute = 750; lat = 37.5; showSeason = true; }},
  {name:'춘분', lv:1, go:function(){ day = 80; minute = 750; lat = 37.5; showSeason = true; }},
  {name:'적도에서', lv:2, go:function(){ day = 172; minute = 750; lat = 0; showSeason = true; }},
  {name:'북극에서(백야)', lv:2, go:function(){ day = 172; minute = 60; lat = 89; showSeason = true; }},
  {name:'겨울 밤하늘', lv:2, go:function(){ day = 15; minute = 1260; lat = 37.5; showStars = true; showTrail = false; }},
  {name:'별의 일주운동', lv:2, go:function(){ day = 15; minute = 1320; lat = 37.5; showStars = true; showTrail = true; }},
  {name:'보름달', lv:2, go:function(){ day = fullMoonDay(1); minute = 1260; lat = 37.5; showMoon = true; }},
  {name:'남반구에서', lv:3, go:function(){ day = 172; minute = 750; lat = -33.9; showSeason = true; }}
];
function buildExamples(){
  var box = document.getElementById('examples');
  box.innerHTML = '<span style="font-size:13.5px;color:#4a636a">보기:</span>';
  EXAMPLES.forEach(function(x){
    if (x.lv > level) return;
    var b = document.createElement('button');
    b.className = 'ex'; b.textContent = x.name;
    b.onclick = function(){
      x.go();
      ['btnSeason','btnStars','btnTrail','btnMoon'].forEach(function(id, i){
        var v = [showSeason, showStars, showTrail, showMoon][i];
        document.getElementById(id).classList.toggle('on', v);
      });
      dayKey = ''; syncLabels(); render(); save();
    };
    box.appendChild(b);
  });
}

/* ---------- 수준 ---------- */
function setLevel(lv){
  level = lv;
  var btns = document.querySelectorAll('.lv');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', +btns[i].dataset.lv === lv);
  buildExamples();
  render(); save();
}
var lvBtns = document.querySelectorAll('.lv');
for (var li = 0; li < lvBtns.length; li++){
  (function(b){ b.onclick = function(){ setLevel(+b.dataset.lv); }; })(lvBtns[li]);
}

/* ---------- 저장 ---------- */
function save(){
  try { localStorage.setItem('fxSky', JSON.stringify(
    {day:day, minute:minute, lat:lat, level:level,
     f:[showSeason, showStars, showTrail, showMoon]})); } catch (e) {}
}
function load(){
  try {
    var d = JSON.parse(localStorage.getItem('fxSky') || 'null');
    if (!d) return false;
    day = d.day; minute = d.minute; lat = d.lat; level = d.level || 2;
    showSeason = d.f[0]; showStars = d.f[1]; showTrail = d.f[2]; showMoon = d.f[3];
    ['btnSeason','btnStars','btnTrail','btnMoon'].forEach(function(id, i){
      document.getElementById(id).classList.toggle('on', d.f[i]);
    });
    return true;
  } catch (e) { return false; }
}

/* ---------- 움직이기 ---------- */
var dayF = day;
function loop(){
  if (playDay){
    minute = (minute + 4) % 1440;
    syncLabels(); render();
  } else if (playYear){
    dayF += 0.4;
    if (dayF > 365) dayF -= 365;
    day = Math.round(dayF);
    dayKey = '';
    syncLabels(); render();
  }
  requestAnimationFrame(loop);
}
function refitSky(){ fitAll(); render(); }
window.addEventListener('resize', refitSky);
window.addEventListener('orientationchange', function(){ setTimeout(refitSky, 250); });

/* ---------- 시작 ---------- */
load();
dayF = day;
fitAll();
syncLabels();
setLevel(level);
requestAnimationFrame(loop);
</script>
