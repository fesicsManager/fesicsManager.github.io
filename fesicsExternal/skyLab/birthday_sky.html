<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내 생일 밤하늘</title>
<meta name="description" content="태어난 날, 그 밤 우리 동네 하늘에 떠 있던 달과 별을 실제 천문 계산으로 그려 줍니다.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--paper:#eef2f0;--ink:#173238;--ink-soft:#4a636a;--brass:#d98e3b;--brass-dark:#96591c;--teal:#246d78;--card:#fff;--radius:14px;}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#0f1b2d 0,#1b2d48 360px,var(--paper) 360px);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  font-size:17px;line-height:1.55;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));}
.app{max-width:1100px;margin:0 auto;}
.backlink{display:none;margin:0 0 8px;font-size:14.5px;}
.backlink a{color:#9fd3dc;font-weight:700;text-decoration:none;}
h1{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-size:28px;margin:4px 0 4px;color:#fff;}
.sub{color:#c6d4e4;margin:0 0 14px;font-size:15.5px;}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:start;}
@media (max-width:860px){.layout{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid #d5e0dc;border-radius:var(--radius);box-shadow:0 3px 0 rgba(23,50,56,.05);padding:14px 16px;}
.card h2{font-size:18px;margin:0 0 10px;}
.skybox{background:#0b1322;border-radius:var(--radius);padding:12px;border:1px solid #23344f;}
canvas#sky{width:100%;height:auto;display:block;}
.form label{display:block;font-size:14px;color:var(--ink-soft);margin:8px 0 4px;font-weight:700;}
.form input,.form select{width:100%;font:500 16px 'Noto Sans KR',sans-serif;padding:9px 10px;border-radius:9px;border:2px solid #b9c9c5;background:#fff;color:var(--ink);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
button.act{font:700 15px 'Noto Sans KR',sans-serif;padding:10px 14px;border-radius:10px;border:1.5px solid #cddad6;background:#fff;color:var(--ink-soft);cursor:pointer;}
button.act.primary{background:var(--brass);border-color:var(--brass);color:var(--ink);}
.facts{margin-top:12px;display:grid;gap:8px;}
.fact{background:#f6faf9;border:1px dashed #b7cdc9;border-radius:10px;padding:9px 12px;font-size:15px;}
.fact b{color:var(--teal);}
.moonrow{display:flex;gap:12px;align-items:center;}
.moonrow canvas{flex:0 0 auto;}
.note{font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#173238;color:#fff;padding:9px 16px;border-radius:999px;font-size:14.5px;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.on{opacity:1;}
:focus-visible{outline:2px solid #fff;outline-offset:1px;box-shadow:0 0 0 5px #173238;}
</style>
</head>
<body>
<div class="app">
  <p class="backlink" id="backlink"><a href="https://fesics.kr/lab">← 페직스 실험실로</a></p>
  <h1>🌙 내 생일 밤하늘</h1>
  <p class="sub">태어난 날, 그 밤 우리 동네 하늘에는 어떤 달과 별이 떠 있었을까요? 실제 천문 계산으로 그려 줍니다.</p>
  <div class="layout">
    <div class="skybox"><canvas id="sky" width="760" height="760" aria-label="고른 날 밤하늘 별자리 그림"></canvas></div>
    <div>
      <div class="card form">
        <h2>언제, 어디서</h2>
        <label for="inDate">생일 (태어난 날)</label>
        <input type="date" id="inDate" min="1950-01-01" max="2050-12-31">
        <div class="row2">
          <div><label for="inTime">시각</label><input type="time" id="inTime" value="21:00"></div>
          <div><label for="inCity">사는 곳</label><select id="inCity"></select></div>
        </div>
        <div class="btns">
          <button class="act primary" id="btnToday">오늘 밤과 비교</button>
          <button class="act" id="btnSave">그림 저장</button>
          <button class="act" id="btnLink">링크 복사</button>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2 id="title">그날의 하늘</h2>
        <div class="moonrow"><canvas id="moon" width="96" height="96" aria-hidden="true"></canvas><div id="moonText"></div></div>
        <div class="facts" id="facts"></div>
        <div class="note">별의 자리·해와 달의 위치는 계산식으로 구한 값이라 실제와 몇 분, 1° 안팎 차이가 날 수 있어요. 그림은 하늘을 올려다보고 머리 위를 가운데에 둔 모습이에요 — 그래서 동쪽이 왼쪽이에요.</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===========================================================
   내 생일 밤하늘 (261124) — 하늘 실험실(sky_lab.html)과 같은 계산식을 쓰되
   해(年)·경도를 마음대로 고를 수 있게 날짜에서 바로 율리우스일을 만든다.
   =========================================================== */
var D2R = Math.PI / 180, R2D = 180 / Math.PI, TZ = 9;
function sin(d){ return Math.sin(d * D2R); }
function cos(d){ return Math.cos(d * D2R); }
function wrap360(x){ x = x % 360; return x < 0 ? x + 360 : x; }
function jdOf(y, m, d, hourKST){
  var ut = hourKST - TZ;
  if (m <= 2){ y -= 1; m += 12; }
  var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 + ut / 24;
}
function lstDeg(jd, lon){ return wrap360(280.46061837 + 360.98564736629 * (jd - 2451545.0) + lon); }
function sunPos(jd){
  var n = jd - 2451545.0, L = wrap360(280.460 + 0.9856474 * n), g = wrap360(357.528 + 0.9856003 * n);
  var lam = L + 1.915 * sin(g) + 0.020 * sin(2 * g), eps = 23.439 - 0.0000004 * n;
  return {ra:wrap360(Math.atan2(cos(eps) * sin(lam), cos(lam)) * R2D), dec:Math.asin(sin(eps) * sin(lam)) * R2D, lam:wrap360(lam)};
}
function moonPos(jd){
  var n = jd - 2451545.0;
  var Lp = wrap360(218.316 + 13.176396 * n), M = wrap360(134.963 + 13.064993 * n), F = wrap360(93.272 + 13.229350 * n);
  var lam = Lp + 6.289 * sin(M), bet = 5.128 * sin(F), eps = 23.439 - 0.0000004 * n;
  var x = cos(bet) * cos(lam), y = cos(eps) * cos(bet) * sin(lam) - sin(eps) * sin(bet), z = sin(eps) * cos(bet) * sin(lam) + cos(eps) * sin(bet);
  return {ra:wrap360(Math.atan2(y, x) * R2D), dec:Math.asin(z) * R2D, lam:wrap360(lam)};
}
function altAz(ra, dec, lst, lat){
  var H = wrap360(lst - ra);
  var sa = Math.max(-1, Math.min(1, sin(lat) * sin(dec) + cos(lat) * cos(dec) * cos(H)));
  var az = Math.atan2(-cos(dec) * sin(H), sin(dec) * cos(lat) - cos(dec) * sin(lat) * cos(H)) * R2D;
  return {alt:Math.asin(sa) * R2D, az:wrap360(az)};
}

/* 밝은 별 — 적경(시), 적위(도), 밝기(등급), 이름 */
var STARS = [
  [2.530, 89.264, 2.0, '북극성'],
  [11.062, 61.751, 1.8, ''], [11.031, 56.382, 2.4, ''], [11.897, 53.695, 2.4, ''], [12.257, 57.033, 3.3, ''],
  [12.900, 55.960, 1.8, ''], [13.399, 54.925, 2.2, ''], [13.792, 49.313, 1.9, ''],
  [0.675, 56.537, 2.2, ''], [0.153, 59.150, 2.3, ''], [0.945, 60.717, 2.5, ''], [1.430, 60.235, 2.7, ''], [1.907, 63.670, 3.4, ''],
  [5.919, 7.407, 0.5, '베텔게우스'], [5.242, -8.202, 0.2, '리겔'], [5.418, 6.350, 1.6, ''], [5.796, -9.670, 2.1, ''],
  [5.679, -1.943, 1.8, ''], [5.604, -1.202, 1.7, ''], [5.533, -0.299, 2.2, ''],
  [6.752, -16.716, -1.4, '시리우스'], [7.655, 5.225, 0.4, '프로키온'],
  [18.615, 38.784, 0.0, '직녀별'], [20.690, 45.280, 1.2, '데네브'], [19.846, 8.868, 0.8, '견우별'],
  [14.261, 19.182, -0.05, '아크투루스'], [13.420, -11.161, 1.0, '스피카'], [16.490, -26.432, 1.1, '안타레스'],
  [4.599, 16.509, 0.9, '알데바란'], [5.278, 45.998, 0.1, '카펠라'], [7.755, 28.026, 1.1, '폴룩스'], [7.577, 31.888, 1.6, ''],
  [10.140, 11.967, 1.4, '레굴루스'], [22.961, -29.622, 1.2, '포말하우트'],
  /* 사자 34~36, 전갈 37~40, 백조 41~44, 플레이아데스 45 */
  [11.818, 14.572, 2.1, ''], [10.333, 19.842, 2.0, ''], [11.235, 20.524, 2.6, ''],
  [17.560, -37.104, 1.6, ''], [16.006, -22.622, 2.3, ''], [16.091, -19.806, 2.6, ''], [17.622, -42.998, 1.9, ''],
  [20.370, 40.257, 2.2, ''], [19.512, 27.960, 3.1, ''], [20.770, 33.970, 2.5, ''], [19.749, 45.131, 2.9, ''],
  [3.791, 24.105, 1.6, '좀생이별']
];
var LINES = [
  {name:'북두칠성', idx:[1,2,3,4,5,6,7], color:'rgba(140,200,255,.6)'},
  {name:'카시오페이아자리', idx:[9,8,10,11,12], color:'rgba(140,200,255,.6)'},
  {name:'오리온자리', idx:[13,15,19,18,17,16,14,13], color:'rgba(255,190,150,.55)'},
  {name:'여름철 대삼각형', idx:[22,23,24,22], color:'rgba(170,255,210,.5)'},
  {name:'겨울철 대삼각형', idx:[20,21,13,20], color:'rgba(170,220,255,.45)'},
  {name:'사자자리', idx:[32,35,36,34,32], color:'rgba(255,230,160,.5)'},
  {name:'전갈자리', idx:[39,38,27,37,40], color:'rgba(255,170,150,.55)'},
  {name:'백조자리', idx:[23,41,42,41,43,41,44], color:'rgba(170,255,210,.45)'},
  {name:'쌍둥이자리', idx:[30,31], color:'rgba(200,200,255,.55)'}
];
var CITIES = [
  ['서울', 37.57, 126.98], ['인천', 37.46, 126.71], ['수원', 37.26, 127.03], ['춘천', 37.88, 127.73], ['강릉', 37.75, 128.90],
  ['대전', 36.35, 127.38], ['청주', 36.64, 127.49], ['전주', 35.82, 127.15], ['광주', 35.16, 126.85], ['대구', 35.87, 128.60],
  ['울산', 35.54, 129.31], ['부산', 35.18, 129.08], ['창원', 35.23, 128.68], ['포항', 36.02, 129.34], ['제주', 33.50, 126.53]
];
var selCity = document.getElementById('inCity');
CITIES.forEach(function(c, i){ var o = document.createElement('option'); o.value = i; o.textContent = c[0]; selCity.appendChild(o); });

var cv = document.getElementById('sky'), ctx = cv.getContext('2d');
var S = 760, CX = 380, CY = 402, R = 318;
function proj(alt, az){
  var r = R * (90 - alt) / 90;
  return [CX - r * sin(az), CY - r * cos(az)];
}
function starSize(mag){ return Math.max(1.4, 5.2 - mag * 1.05); }

function phaseName(e){
  var W = 12;
  if (e <= W || e >= 360 - W) return '그믐·삭 (달이 거의 안 보여요)';
  if (Math.abs(e - 180) <= W) return '보름달';
  if (Math.abs(e - 90) <= W) return '상현달';
  if (Math.abs(e - 270) <= W) return '하현달';
  if (e < 90) return '초승달';
  if (e < 180) return '차오르는 달';
  if (e < 270) return '기우는 달';
  return '그믐달';
}
function drawMoon(c, x, y, r, k, ang){
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = 'rgba(70,78,92,.95)'; c.beginPath(); c.arc(0, 0, r, 0, 6.2832); c.fill();
  var a = (1 - 2 * k) * r, P = [], th;
  for (th = -90; th <= 90; th += 6) P.push([r * cos(th), r * sin(th)]);
  for (th = 90; th >= -90; th -= 6) P.push([a * cos(th), r * sin(th)]);
  c.fillStyle = '#f5f0e0'; c.beginPath(); c.moveTo(P[0][0], P[0][1]);
  for (var i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]);
  c.closePath(); c.fill(); c.restore();
}
function hhmm(h){ var m = Math.round(h * 60); m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }
function sunSet(y, mo, d, lat, lon){
  var prev = null, set = null, rise = null;
  for (var mi = 0; mi <= 1440; mi += 2){
    var jd = jdOf(y, mo, d, mi / 60), sp = sunPos(jd), a = altAz(sp.ra, sp.dec, lstDeg(jd, lon), lat).alt;
    if (prev !== null){ if (prev > -0.833 && a <= -0.833) set = mi / 60; if (prev <= -0.833 && a > -0.833) rise = mi / 60; }
    prev = a;
  }
  return {set:set, rise:rise};
}

/* 행성 — JPL 근사 궤도 요소(1800~2050년, 1° 안팎) [a, e, I, L, 근일점 경도, 승교점 경도] 와 100년당 변화 */
var PLANETS = [
  {name:'수성', color:'#d9c7a8', r:3.5, el:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593], rt:[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081]},
  {name:'금성', color:'#fff3c4', r:6, el:[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255], rt:[0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418]},
  {name:'화성', color:'#ff8a5c', r:4.5, el:[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891], rt:[0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343]},
  {name:'목성', color:'#ffe2b0', r:5.5, el:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909], rt:[-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106]},
  {name:'토성', color:'#e8d59a', r:4.5, el:[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448], rt:[-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]}
];
var EARTH = {el:[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0], rt:[0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0]};
function helio(o, T){
  var e0 = o.el.map(function(v, i){ return v + o.rt[i] * T; });
  var a = e0[0], e = e0[1], I = e0[2], L = e0[3], wb = e0[4], Om = e0[5];
  var M = wrap360(L - wb), w = wb - Om, E = M + R2D * e * sin(M);
  for (var k = 0; k < 8; k++) E = E - (E - R2D * e * sin(E) - M) / (1 - e * cos(E));
  var xp = a * (cos(E) - e), yp = a * Math.sqrt(1 - e * e) * sin(E);
  return [
    (cos(w) * cos(Om) - sin(w) * sin(Om) * cos(I)) * xp + (-sin(w) * cos(Om) - cos(w) * sin(Om) * cos(I)) * yp,
    (cos(w) * sin(Om) + sin(w) * cos(Om) * cos(I)) * xp + (-sin(w) * sin(Om) + cos(w) * cos(Om) * cos(I)) * yp,
    (sin(w) * sin(I)) * xp + (cos(w) * sin(I)) * yp
  ];
}
function planetRaDec(o, jd){
  var T = (jd - 2451545.0) / 36525, p = helio(o, T), g = helio(EARTH, T);
  var x = p[0] - g[0], y = p[1] - g[1], z = p[2] - g[2], eps = 23.43928;
  var ye = y * cos(eps) - z * sin(eps), ze = y * sin(eps) + z * cos(eps);
  return {ra:wrap360(Math.atan2(ye, x) * R2D), dec:Math.atan2(ze, Math.hypot(x, ye)) * R2D};
}

var state = null;
function compute(){
  var ds = document.getElementById('inDate').value, ts = document.getElementById('inTime').value || '21:00';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return null;
  var p = ds.split('-').map(Number), t = ts.split(':').map(Number), city = CITIES[+selCity.value || 0];
  var hour = t[0] + t[1] / 60, jd = jdOf(p[0], p[1], p[2], hour), lst = lstDeg(jd, city[2]);
  var sp = sunPos(jd), mp = moonPos(jd);
  var elong = wrap360(mp.lam - sp.lam), k = (1 - cos(elong)) / 2;
  return {y:p[0], m:p[1], d:p[2], hour:hour, city:city, jd:jd, lst:lst,
          sun:altAz(sp.ra, sp.dec, lst, city[1]), moon:altAz(mp.ra, mp.dec, lst, city[1]), elong:elong, k:k,
          planets:PLANETS.map(function(o){ var rd = planetRaDec(o, jd); return {name:o.name, color:o.color, r:o.r, rd:rd, a:altAz(rd.ra, rd.dec, lst, city[1])}; }),
          ss:sunSet(p[0], p[1], p[2], city[1], city[2])};
}

function skyBg(sunAlt){
  if (sunAlt > 0) return ['#5b9bd5', '#9cc6ea'];
  if (sunAlt > -6) return ['#283f6b', '#d98e5b'];
  if (sunAlt > -12) return ['#18233f', '#3b4a72'];
  return ['#070d1c', '#142039'];
}
function draw(st){
  ctx.clearRect(0, 0, S, S);
  var bg = skyBg(st.sun.alt), g = ctx.createRadialGradient(CX, CY, 10, CX, CY, R);
  g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.fill();
  var dark = st.sun.alt < -6, faint = st.sun.alt < -12 ? 1 : (st.sun.alt < -6 ? 0.7 : (st.sun.alt < 0 ? 0.35 : 0));
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.clip();
  /* 고도 30·60° 둘레 */
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
  [30, 60].forEach(function(a){ ctx.beginPath(); ctx.arc(CX, CY, R * (90 - a) / 90, 0, 6.2832); ctx.stroke(); });
  var pos = STARS.map(function(s){ var a = altAz(s[0] * 15, s[1], st.lst, st.city[1]); return {a:a, p:proj(a.alt, a.az)}; });
  if (faint > 0){
    LINES.forEach(function(L){
      ctx.strokeStyle = L.color; ctx.lineWidth = 1.8; ctx.globalAlpha = faint; ctx.beginPath();
      var on = false;
      L.idx.forEach(function(i){
        var q = pos[i]; if (q.a.alt < -2){ on = false; return; }
        if (!on){ ctx.moveTo(q.p[0], q.p[1]); on = true; } else ctx.lineTo(q.p[0], q.p[1]);
      });
      ctx.stroke(); ctx.globalAlpha = 1;
    });
    ctx.font = '600 15px "Noto Sans KR",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    STARS.forEach(function(s, i){
      var q = pos[i]; if (q.a.alt < 0) return;
      var r = starSize(s[2]); ctx.globalAlpha = faint;
      ctx.fillStyle = '#fffbea'; ctx.beginPath(); ctx.arc(q.p[0], q.p[1], r, 0, 6.2832); ctx.fill();
      if (s[3] && s[2] < 1.7){ ctx.fillStyle = 'rgba(230,240,255,.9)'; ctx.fillText(s[3], q.p[0] + r + 4, q.p[1]); }
      ctx.globalAlpha = 1;
    });
  }
  /* 행성 (261124) — 해가 진 뒤에만 그린다 */
  if (st.sun.alt < -4){
    st.planets.forEach(function(pl){
      if (pl.a.alt < 0) return;
      var p = proj(pl.a.alt, pl.a.az);
      ctx.fillStyle = pl.color; ctx.shadowColor = pl.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p[0], p[1], pl.r, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = pl.color; ctx.font = '700 15px "Noto Sans KR",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(pl.name, p[0] + pl.r + 5, p[1]);
    });
  }
  /* 달 */
  if (st.moon.alt > -1){
    var mpP = proj(st.moon.alt, st.moon.az), spP = proj(st.sun.alt, st.sun.az);
    var ang = Math.atan2(spP[1] - mpP[1], spP[0] - mpP[0]);
    ctx.shadowColor = 'rgba(255,250,220,.6)'; ctx.shadowBlur = 18;
    drawMoon(ctx, mpP[0], mpP[1], 17, st.k, ang);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe9a8'; ctx.font = '700 15px "Noto Sans KR",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('달', mpP[0], mpP[1] + 32);
  }
  if (st.sun.alt > -1){
    var sP = proj(st.sun.alt, st.sun.az);
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(sP[0], sP[1], 18, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  /* 테두리·방위 */
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = '#e8eef8'; ctx.font = '700 19px "Noto Sans KR",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [['북', 0], ['동', 90], ['남', 180], ['서', 270]].forEach(function(d){ var p = proj(-8, d[1]); ctx.fillText(d[0], p[0], p[1]); });
  ctx.font = '600 17px "Noto Sans KR",sans-serif'; ctx.fillStyle = '#c6d4e4';
  ctx.fillText(st.y + "년 " + st.m + "월 " + st.d + "일 " + hhmm(st.hour) + " · " + st.city[0] + "의 하늘", CX, 20);
  ctx.font = '500 13px "Noto Sans KR",sans-serif'; ctx.fillStyle = 'rgba(198,212,228,.75)';
  ctx.textAlign = "left"; ctx.fillText("fesics.kr · 페직스 하늘 실험실", 10, S - 12);
  /* 왼쪽 달 그림 */
  var mc = document.getElementById('moon').getContext('2d');
  mc.clearRect(0, 0, 96, 96); mc.fillStyle = '#0b1322'; mc.fillRect(0, 0, 96, 96);
  drawMoon(mc, 48, 48, 36, st.k, st.elong < 180 ? 0 : Math.PI);
  return pos;
}

function visibleNames(st, pos){
  var con = LINES.filter(function(L){
    var up = L.idx.filter(function(i){ return pos[i].a.alt > 5; }).length;
    return up >= Math.ceil(L.idx.length * 0.6);
  }).map(function(L){ return L.name; });
  var stars = STARS.map(function(s, i){ return {s:s, a:pos[i].a}; })
    .filter(function(o){ return o.s[3] && o.a.alt > 5; })
    .sort(function(a, b){ return a.s[2] - b.s[2]; }).slice(0, 5).map(function(o){ return o.s[3]; });
  return {con:con, stars:stars};
}
function dirName(az){ return ['북', '북동', '동', '남동', '남', '남서', '서', '북서'][Math.round(wrap360(az) / 45) % 8]; }

function update(){
  var st = compute(); if (!st) return;
  state = st;
  var pos = draw(st), vn = visibleNames(st, pos);
  var age = st.elong / 360 * 29.53;
  document.getElementById('title').textContent = st.y + '년 ' + st.m + '월 ' + st.d + '일, ' + st.city[0];
  document.getElementById('moonText').innerHTML = '<b style="font-size:18px">' + phaseName(st.elong) + '</b><br>' +
    '밝게 보이는 부분 ' + Math.round(st.k * 100) + '% · 음력 ' + Math.max(1, Math.round(age + 1)) + '일쯤<br>' +
    (st.moon.alt > 0 ? '달은 ' + dirName(st.moon.az) + '쪽 하늘, 높이 ' + Math.round(st.moon.alt) + '°' : '이 시각에는 달이 지평선 아래에 있어요');
  var f = [];
  if (st.ss.set !== null) f.push('그날 해는 <b>' + hhmm(st.ss.set) + '</b>에 졌어요.' + (st.ss.rise !== null ? ' (해 뜬 때 ' + hhmm(st.ss.rise) + ')' : ''));
  if (st.sun.alt > 0) f.push('이 시각에는 아직 <b>해가 떠 있어서</b> 별이 안 보여요. 시각을 밤으로 바꿔 보세요.');
  else if (st.sun.alt > -12) f.push('해가 막 져서 하늘이 아직 밝아요. 밝은 별만 보이기 시작할 때예요.');
  if (vn.con.length) f.push('보이는 별자리: <b>' + vn.con.join(', ') + '</b>');
  var upP = st.planets.filter(function(p){ return p.a.alt > 3; });
  if (st.sun.alt < -4 && upP.length) f.push('떠 있던 행성: <b>' + upP.map(function(p){ return p.name + '(' + dirName(p.a.az) + '쪽)'; }).join(', ') + '</b> — 행성은 별처럼 반짝이지 않고 또렷하게 빛나요.');
  if (vn.stars.length && st.sun.alt < -6) f.push('가장 밝게 빛나던 별: <b>' + vn.stars.join(', ') + '</b>');
  var days = Math.floor((Date.now() / 86400000 + 2440587.5) - st.jd);
  if (days > 0) f.push('그날부터 오늘까지 지구는 태양 둘레를 <b>' + (days / 365.25).toFixed(1) + '바퀴</b>, 스스로 <b>' + days.toLocaleString('ko-KR') + '번</b> 돌았어요.');
  document.getElementById('facts').innerHTML = f.map(function(x){ return '<div class="fact">' + x + '</div>'; }).join('');
  try { history.replaceState(null, '', '?d=' + document.getElementById('inDate').value + '&t=' + (document.getElementById('inTime').value || '21:00') + '&c=' + selCity.value); } catch (e) {}
}

function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); setTimeout(function(){ e.classList.remove('on'); }, 1800); }
['inDate', 'inTime', 'inCity'].forEach(function(id){ document.getElementById(id).addEventListener('input', update); document.getElementById(id).addEventListener('change', update); });
var birthdaySaved = null;
document.getElementById('btnToday').onclick = function(){
  var inD = document.getElementById('inDate');
  if (birthdaySaved){ inD.value = birthdaySaved; birthdaySaved = null; this.textContent = '오늘 밤과 비교'; }
  else {
    birthdaySaved = inD.value;
    var n = new Date(Date.now() + 9 * 3600000);
    inD.value = n.toISOString().slice(0, 10);
    this.textContent = '생일 하늘로 돌아가기';
  }
  update();
};
document.getElementById('btnSave').onclick = function(){
  try {
    var a = document.createElement('a');
    a.download = '내생일밤하늘_' + document.getElementById('inDate').value + '.png';
    a.href = cv.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('이 브라우저에서는 저장할 수 없어요. 그림을 길게 눌러 저장해 보세요.'); }
};
document.getElementById('btnLink').onclick = function(){
  var url = location.href;
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast('링크를 복사했어요'); }, function(){ toast(url); });
  else toast(url);
};

/* 시작: 주소에 값이 있으면 그것으로, 없으면 오늘에서 13년 전(대략 중학생 생일)으로 */
(function(){
  var q = new URLSearchParams(location.search);
  var d = q.get('d'), t = q.get('t'), c = q.get('c');
  var inD = document.getElementById('inDate');
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) inD.value = d;
  else { var n = new Date(Date.now() + 9 * 3600000); n.setUTCFullYear(n.getUTCFullYear() - 13); inD.value = n.toISOString().slice(0, 10); }
  if (t && /^\d{1,2}:\d{2}$/.test(t)) document.getElementById('inTime').value = t;
  if (c !== null && CITIES[+c]) selCity.value = c;
  update();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);
})();
try { if (window.top === window.self) document.getElementById('backlink').style.display = 'block'; } catch (e) {}
