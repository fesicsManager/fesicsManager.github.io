<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>파동판</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--paper:#eef2f0;--grid:#c9d6d2;--ink:#173238;--ink-soft:#4a636a;--brass:#d98e3b;--brass-dark:#a86825;--teal:#2f8f9d;--coral:#c1443c;--card:#fff;--radius:14px;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:radial-gradient(var(--grid) 1.2px,transparent 1.2px) 0 0/20px 20px,var(--paper);
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);font-size:17px;line-height:1.55;
  padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%;}
.app{max-width:1500px;margin:0 auto;}
h1{font-family:'Space Grotesk',sans-serif;font-size:27px;margin:0 0 4px;line-height:1.2;}
.subtitle{color:var(--ink-soft);font-size:16px;margin:0 0 12px;}
.card{background:var(--card);border:1px solid #d5e0dc;border-radius:var(--radius);box-shadow:0 3px 0 rgba(23,50,56,.05);padding:14px 16px;}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 10px;}
main.layout{display:grid;grid-template-columns:1fr minmax(260px,330px);gap:14px;align-items:start;}
@media (max-width:900px){main.layout{grid-template-columns:1fr;}}
.levels{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.lv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:8px 18px;border-radius:999px;
  border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;}
.lv.on{background:var(--ink);color:#fff;}
canvas#pool{width:100%;height:auto;display:block;border-radius:11px;background:#0a1824;border:1px solid #061119;
  touch-action:none;cursor:crosshair;image-rendering:auto;}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
button.act{font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:9px;border:1.5px solid #cddad6;
  background:#fff;color:var(--ink-soft);cursor:pointer;touch-action:manipulation;}
button.act.on{background:var(--brass);color:#fff;border-color:var(--brass);}
.exrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.ex{font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid #cddad6;
  background:#fff;color:var(--ink-soft);cursor:pointer;}
.prop{margin-top:9px;}
.prop label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft);
  margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
.prop label b{color:var(--brass-dark);font-size:17px;}
input[type=range]{width:100%;accent-color:var(--brass);height:9px;}
select{width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid #cddad6;background:#fff;
  color:var(--ink);font-family:inherit;font-size:15px;margin-top:4px;}
.readout{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:#f6faf9;
  border:1px dashed #b7cdc9;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.readout span{color:var(--ink-soft);font-size:13.5px;display:block;}
.readout b{color:var(--teal);font-size:17px;}
.hint{margin-top:10px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;background:#f6faf9;
  border-radius:10px;padding:10px 12px;border:1px dashed #b7cdc9;}
.note{margin-top:8px;font-size:14px;color:var(--ink-soft);line-height:1.5;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <h1>파동판</h1>
  <p class="subtitle">물결을 실제로 계산해서 퍼뜨립니다. 두 파원을 놓으면 간섭 무늬가, 틈을 내면 회절이 저절로 나옵니다.</p>

  <div class="levels">
    <button class="lv" data-lv="1">초등</button>
    <button class="lv on" data-lv="2">중등</button>
    <button class="lv" data-lv="3">고등</button>
  </div>

  <main class="layout">
    <section class="card">
      <canvas id="pool"></canvas>
      <div class="rowbtns">
        <button class="act on" id="btnRun">멈춤</button>
        <button class="act" id="btnPattern">무늬 쌓기</button>
        <button class="act" id="btnReset">물결 지우기</button>
      </div>
      <div class="exrow" id="examples"></div>
      <div class="hint" id="hint">파원(동그라미)을 <b>끌어서</b> 옮겨 보세요. 아래에서 파장과 장치를 바꿀 수 있어요.</div>
    </section>

    <aside>
      <div class="card">
        <h2>파동</h2>
        <div class="prop"><label>파장 <b id="lbLam">16칸</b></label>
          <input type="range" id="sLam" min="8" max="26" step="1" value="16"></div>
        <div class="prop"><label>파원 수 <b id="lbNum">1개</b></label>
          <input type="range" id="sNum" min="1" max="2" step="1" value="1"></div>
        <div class="prop" id="gapRow" style="display:none"><label>두 파원 사이 <b id="lbSep">70칸</b></label>
          <input type="range" id="sSep" min="20" max="150" step="1" value="70"></div>
        <div class="prop" id="phRow" style="display:none"><label>위상차 <b id="lbPh">0°</b></label>
          <input type="range" id="sPh" min="0" max="360" step="15" value="0"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>장치</h2>
        <select id="selDev">
          <option value="none">없음</option>
          <option value="slit1">벽에 틈 1개</option>
          <option value="slit2">벽에 틈 2개</option>
          <option value="medium">매질 경계</option>
        </select>
        <div class="prop" id="slitRow" style="display:none"><label>틈 너비 <b id="lbSlit">10칸</b></label>
          <input type="range" id="sSlit" min="2" max="70" step="1" value="10"></div>
        <div class="prop" id="sep2Row" style="display:none"><label>두 틈 사이 <b id="lbSep2">56칸</b></label>
          <input type="range" id="sSep2" min="20" max="150" step="1" value="56"></div>
        <div class="prop" id="medRow" style="display:none"><label>아래쪽 빠르기 <b id="lbMed">0.60배</b></label>
          <input type="range" id="sMed" min="0.3" max="1.6" step="0.05" value="0.6"></div>
        <div class="prop" id="dopRow"><label>파원 움직이기 <b id="lbDop">0.00</b></label>
          <input type="range" id="sDop" min="0" max="0.9" step="0.05" value="0"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>값</h2>
        <div class="readout">
          <div><span>파장 λ</span><b id="roLam">—</b></div>
          <div><span>진동수 f</span><b id="roF">—</b></div>
          <div><span>속력 v</span><b id="roV">—</b></div>
          <div><span>걸린 걸음</span><b id="roT">—</b></div>
        </div>
        <div class="note" id="noteBox"></div>
      </div>
    </aside>
  </main>
</div>

<script>
/* ===========================================================
   파동판 — 2차원 파동 방정식을 칸마다 풀어서 물결을 퍼뜨린다.
     u(다음) = 2u(지금) - u(아까) + (v·dt/dx)²·(둘레 네 칸의 합 - 4u)
   간섭·회절·굴절·도플러는 따로 넣은 게 아니라 이 식에서 저절로 나온다.
   =========================================================== */

var NX = 320, NY = 240;          /* 칸 수 */
var N = NX * NY;
var u0 = new Float32Array(N), u1 = new Float32Array(N), u2 = new Float32Array(N);
var kk = new Float32Array(N);    /* 칸마다 (v·dt/dx)² */
var wall = new Uint8Array(N);
var damp = new Float32Array(N);  /* 가장자리에서 서서히 죽인다(되돌아오지 않게) */
var acc = new Float32Array(N);   /* 무늬 쌓기용 */
var accN = 0;

var C0 = 0.5;                    /* 기본 매질의 v·dt/dx — 0.707 보다 작아야 안 터진다 */
var lam = 16, nSrc = 1, sep = 70, phase = 0;
var dev = 'none', slitW = 10, slit2 = 56, medV = 0.6, dopV = 0;
var running = true, patternMode = false, level = 2;
var step = 0, srcX = 95, srcY = 120, dopPos = 0;

/* ---------- 바탕 만들기 ---------- */
function buildField(){
  var x, y, i;
  for (i = 0; i < N; i++){ kk[i] = C0 * C0; wall[i] = 0; damp[i] = 1; }
  /* 가장자리 흡수층 */
  /* 흡수층이 약하면 가장자리에서 물결이 되돌아와 간섭 무늘를 어지럽힌다.
     세제곱으로 서서히 세게 죽여야 되돌아오는 게 거의 없다 (261121) */
  var PML = 60;
  for (y = 0; y < NY; y++) for (x = 0; x < NX; x++){
    i = y*NX + x;
    var d = Math.min(x, y, NX-1-x, NY-1-y);
    if (d < PML){ var t = (PML - d) / PML; damp[i] = 1 - 0.09 * t * t * t; }
  }
  if (dev === 'medium'){
    var yb = Math.round(NY * 0.60);
    for (y = yb; y < NY; y++) for (x = 0; x < NX; x++) kk[y*NX+x] = (C0*medV) * (C0*medV);
  } else if (dev === 'slit1' || dev === 'slit2'){
    var wx = Math.round(NX * 0.52);
    for (y = 0; y < NY; y++){
      var open = false;
      if (dev === 'slit1'){
        open = Math.abs(y - NY/2) <= slitW/2;
      } else {
        open = Math.abs(Math.abs(y - NY/2) - slit2/2) <= slitW/2;
      }
      if (!open) for (var w = 0; w < 3; w++) wall[y*NX + wx + w] = 1;
    }
  }
}
function clearWaves(){
  u0.fill(0); u1.fill(0); u2.fill(0); acc.fill(0); accN = 0; step = 0; dopPos = 0;
}

/* ---------- 파원 ---------- */
function sources(){
  var list = [];
  var sx = srcX + (dev === 'medium' ? 0 : 0) + dopPos;
  if (nSrc === 1){
    list.push({x:sx, y:srcY, ph:0});
  } else {
    list.push({x:sx, y:srcY - sep/2, ph:0});
    list.push({x:sx, y:srcY + sep/2, ph:phase});
  }
  return list;
}

/* ---------- 한 걸음 ---------- */
function stepOnce(){
  var x, y, i;
  var f = C0 / lam;                    /* 한 걸음에 나아가는 위상 */
  var w = 2 * Math.PI * f;
  for (y = 1; y < NY-1; y++){
    var row = y*NX;
    for (x = 1; x < NX-1; x++){
      i = row + x;
      if (wall[i]){ u2[i] = 0; continue; }
      var lap = u1[i-1] + u1[i+1] + u1[i-NX] + u1[i+NX] - 4*u1[i];
      u2[i] = (2*u1[i] - u0[i] + kk[i]*lap) * damp[i];
    }
  }
  var S = sources();
  for (var s = 0; s < S.length; s++){
    var cxp = Math.round(S[s].x), cyp = Math.round(S[s].y);
    var val = Math.sin(w*step + S[s].ph * Math.PI/180);
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++){
      var j = (cyp+dy)*NX + (cxp+dx);
      if (j > 0 && j < N) u2[j] += val * 0.3 * Math.exp(-(dx*dx+dy*dy)/2.2);
    }
  }
  var tmp = u0; u0 = u1; u1 = u2; u2 = tmp;
  step++;
  if (dopV > 0){
    dopPos += dopV * C0;
    if (srcX + dopPos > NX - 75) dopPos = 0;
  }
  /* 무늬 쌓기 — 세기(u²)를 더해 둔다 */
  if (patternMode && step > lam * 6){
    for (i = 0; i < N; i++) acc[i] += u1[i]*u1[i];
    accN++;
  }
}

/* ---------- 그리기 ---------- */
var cv = document.getElementById('pool'), ctx = cv.getContext('2d');
var off = document.createElement('canvas');
off.width = NX; off.height = NY;
var octx = off.getContext('2d');
var img = octx.createImageData(NX, NY);
var LUT = new Uint8Array(512 * 3);
(function(){
  for (var i = 0; i < 512; i++){
    var t = (i - 256) / 256;                  /* -1 ~ 1 */
    var r, g, b;
    if (t >= 0){ r = 20 + 235*t; g = 70 + 185*t; b = 110 + 145*t; }
    else { var a = -t; r = 20 + 10*a; g = 70 - 50*a; b = 110 - 10*a + 60*a; }
    LUT[i*3] = Math.max(0, Math.min(255, r));
    LUT[i*3+1] = Math.max(0, Math.min(255, g));
    LUT[i*3+2] = Math.max(0, Math.min(255, b));
  }
})();

function draw(){
  var d = img.data, i, v, idx;
  if (patternMode && accN > 0){
    var mx = 1e-9;
    for (i = 0; i < N; i++) if (acc[i] > mx) mx = acc[i];
    for (i = 0; i < N; i++){
      var p = Math.sqrt(acc[i] / mx);
      var c = Math.max(0, Math.min(255, Math.round(p * 300)));
      d[i*4] = c; d[i*4+1] = Math.round(c*0.92); d[i*4+2] = Math.round(c*0.7); d[i*4+3] = 255;
    }
  } else {
    for (i = 0; i < N; i++){
      v = u1[i] * 2.2;
      if (v > 1) v = 1; else if (v < -1) v = -1;
      idx = ((v * 256) | 0) + 256;
      if (idx < 0) idx = 0; else if (idx > 511) idx = 511;
      d[i*4] = LUT[idx*3]; d[i*4+1] = LUT[idx*3+1]; d[i*4+2] = LUT[idx*3+2]; d[i*4+3] = 255;
    }
  }
  /* 벽과 매질 경계 */
  for (i = 0; i < N; i++){
    if (wall[i]){ d[i*4] = 220; d[i*4+1] = 214; d[i*4+2] = 198; d[i*4+3] = 255; }
  }
  if (dev === 'medium'){
    var yb = Math.round(NY * 0.60);
    for (var x2 = 0; x2 < NX; x2++){
      var j = yb*NX + x2;
      d[j*4] = 255; d[j*4+1] = 240; d[j*4+2] = 190; d[j*4+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, cv.clientWidth, cv.clientWidth * NY / NX);

  /* 파원 표시 */
  var sc = cv.clientWidth / NX;
  var S = sources();
  ctx.lineWidth = 2;
  for (var s = 0; s < S.length; s++){
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(S[s].x*sc, S[s].y*sc, 7, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(S[s].x*sc, S[s].y*sc, 3, 0, 6.2832); ctx.fill();
  }
}

function fitCanvas(){
  var w = cv.clientWidth || 700;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var h = w * NY / NX;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- 손잡이 ---------- */
function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).style.display = on ? '' : 'none'; }

function syncUI(){
  $('lbLam').textContent = lam + '칸';
  $('lbNum').textContent = nSrc + '개';
  $('lbSep').textContent = sep + '칸';
  $('lbPh').textContent = phase + '°';
  $('lbSlit').textContent = slitW + '칸';
  $('lbSep2').textContent = slit2 + '칸';
  $('lbMed').textContent = medV.toFixed(2) + '배';
  $('lbDop').textContent = dopV.toFixed(2);
  $('sLam').value = lam; $('sNum').value = nSrc; $('sSep').value = sep; $('sPh').value = phase;
  $('sSlit').value = slitW; $('sSep2').value = slit2; $('sMed').value = medV; $('sDop').value = dopV;
  $('selDev').value = dev;
  show('gapRow', nSrc === 2);
  show('phRow', nSrc === 2 && level >= 3);
  show('slitRow', dev === 'slit1' || dev === 'slit2');
  show('sep2Row', dev === 'slit2');
  show('medRow', dev === 'medium');
  show('dopRow', level >= 3 && nSrc === 1);
  /* 수준에 따라 고를 수 있는 장치 */
  var opts = $('selDev').options;
  for (var i = 0; i < opts.length; i++){
    var v = opts[i].value;
    opts[i].disabled = (v === 'slit2' && level < 2) || (v === 'medium' && level < 3);
  }
}

function updateReadouts(){
  var f = C0 / lam;
  $('roLam').textContent = lam + '칸';
  $('roF').textContent = f.toFixed(4) + '/걸음';
  $('roV').textContent = C0.toFixed(2) + '칸/걸음';
  $('roT').textContent = step + '';
  var n = '';
  if (nSrc === 2){
    n = '두 파원에서 온 길이 차가 <b>파장의 정수배</b>면 세게(보강), <b>반파장 홀수배</b>면 약하게(상쇄) 됩니다. ' +
        '지금 파장 ' + lam + '칸, 두 파원 사이 ' + sep + '칸.';
    if (sep > lam){
      var th = Math.asin(Math.min(1, lam / sep)) * 180 / Math.PI;
      n += ' 첫 보강 방향 ≈ <b>' + th.toFixed(0) + '°</b>.';
    }
  } else if (dev === 'slit1'){
    n = '틈이 파장보다 <b>좁을수록</b> 더 많이 퍼집니다(회절). 지금 파장 ' + lam + '칸, 틈 ' + slitW + '칸 — ' +
        (slitW <= lam ? '잘 퍼집니다.' : '거의 곧게 지나갑니다.');
  } else if (dev === 'slit2'){
    var th2 = Math.asin(Math.min(1, lam / slit2)) * 180 / Math.PI;
    n = '두 틈이 새 파원이 되어 간섭합니다. 첫 번째 밝은 줄 방향 sinθ = λ/d = ' +
        lam + '/' + slit2 + ' → θ ≈ <b>' + th2.toFixed(0) + '°</b>.';
  } else if (dev === 'medium'){
    n = '아래쪽은 빠르기가 <b>' + medV.toFixed(2) + '배</b>라 파장도 ' + medV.toFixed(2) +
        '배로 바뀝니다(진동수는 그대로). 비스듬히 들어가면 꺾입니다 — sinθ₁/sinθ₂ = v₁/v₂.';
  } else if (dopV > 0){
    n = '파원이 달리면 앞쪽은 파장이 <b>짧아지고</b> 뒤쪽은 길어집니다(도플러 효과).';
  } else {
    n = '파원 하나에서 동그란 물결이 고르게 퍼집니다.';
  }
  $('noteBox').innerHTML = n;
}

function rebuild(){ buildField(); clearWaves(); syncUI(); updateReadouts(); }

function bind(id, fn){
  $(id).oninput = function(){ fn(parseFloat(this.value)); syncUI(); updateReadouts(); };
}
bind('sLam', function(v){ lam = Math.round(v); acc.fill(0); accN = 0; });
bind('sNum', function(v){ nSrc = Math.round(v); clearWaves(); });
bind('sSep', function(v){ sep = Math.round(v); clearWaves(); });
bind('sPh',  function(v){ phase = Math.round(v); clearWaves(); });
bind('sSlit',function(v){ slitW = Math.round(v); rebuild(); });
bind('sSep2',function(v){ slit2 = Math.round(v); rebuild(); });
bind('sMed', function(v){ medV = v; rebuild(); });
bind('sDop', function(v){ dopV = v; clearWaves(); });
$('selDev').onchange = function(){
  dev = this.value;
  if (dev !== 'none') nSrc = 1;
  srcX = (dev === 'slit1' || dev === 'slit2') ? 95 : 110;
  srcY = dev === 'medium' ? 80 : 120;
  rebuild();
};

/* ---------- 단추 ---------- */
$('btnRun').onclick = function(){
  running = !running;
  this.textContent = running ? '멈춤' : '이어서';
  this.classList.toggle('on', running);
};
$('btnPattern').onclick = function(){
  patternMode = !patternMode;
  this.classList.toggle('on', patternMode);
  acc.fill(0); accN = 0;
};
$('btnReset').onclick = function(){ clearWaves(); };

/* ---------- 파원 끌기 ---------- */
var dragS = -1;
function evCell(ev){
  var r = cv.getBoundingClientRect(), sc = cv.clientWidth / NX;
  return {x:(ev.clientX - r.left) / sc, y:(ev.clientY - r.top) / sc};
}
cv.addEventListener('pointerdown', function(ev){
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  var p = evCell(ev), S = sources(), best = -1, bd = 22;
  for (var i = 0; i < S.length; i++){
    var d = Math.hypot(S[i].x - p.x, S[i].y - p.y);
    if (d < bd){ bd = d; best = i; }
  }
  dragS = best;
  if (dragS >= 0) moveSrc(p);
});
cv.addEventListener('pointermove', function(ev){ if (dragS >= 0) moveSrc(evCell(ev)); });
cv.addEventListener('pointerup', function(){ dragS = -1; });
cv.addEventListener('pointercancel', function(){ dragS = -1; });
function moveSrc(p){
  var nx = Math.max(12, Math.min(NX-12, p.x)), ny = Math.max(12, Math.min(NY-12, p.y));
  if (nSrc === 1){ srcX = nx - dopPos; srcY = ny; }
  else {
    srcX = nx - dopPos;
    /* 고른 파원이 그 자리에 오도록 가운데를 옮긴다 */
    srcY = dragS === 0 ? ny + sep/2 : ny - sep/2;
  }
  srcY = Math.max(12 + sep/2, Math.min(NY-12-sep/2, srcY));
  acc.fill(0); accN = 0;
}

/* ---------- 보기 ---------- */
var EXAMPLES = [
  {name:'물결 퍼지기', lv:1, go:function(){ dev='none'; nSrc=1; lam=16; dopV=0; srcX=160; srcY=120; }},
  {name:'두 파원 간섭', lv:2, go:function(){ dev='none'; nSrc=2; lam=14; sep=70; phase=0; srcX=95; srcY=120; dopV=0; }},
  {name:'틈 하나(회절)', lv:2, go:function(){ dev='slit1'; nSrc=1; lam=18; slitW=10; srcX=95; srcY=120; dopV=0; }},
  {name:'넓은 틈', lv:2, go:function(){ dev='slit1'; nSrc=1; lam=10; slitW=56; srcX=95; srcY=120; dopV=0; }},
  {name:'틈 둘(이중 슬릿)', lv:2, go:function(){ dev='slit2'; nSrc=1; lam=12; slitW=7; slit2=56; srcX=95; srcY=120; dopV=0; }},
  {name:'굴절', lv:3, go:function(){ dev='medium'; nSrc=1; lam=16; medV=0.55; srcX=130; srcY=80; dopV=0; }},
  {name:'도플러', lv:3, go:function(){ dev='none'; nSrc=1; lam=14; dopV=0.45; srcX=95; srcY=120; }}
];
function buildExamples(){
  var box = $('examples');
  box.innerHTML = '<span style="font-size:13.5px;color:#4a636a">보기:</span>';
  EXAMPLES.forEach(function(x){
    if (x.lv > level) return;
    var b = document.createElement('button');
    b.className = 'ex'; b.textContent = x.name;
    b.onclick = function(){
      x.go();
      if (patternMode){ patternMode = false; $('btnPattern').classList.remove('on'); }
      rebuild();
    };
    box.appendChild(b);
  });
}

/* ---------- 수준 ---------- */
function setLevel(lv){
  level = lv;
  var btns = document.querySelectorAll('.lv');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', +btns[i].dataset.lv === lv);
  if (level < 3 && (dev === 'medium' || dopV > 0)){ dev = 'none'; dopV = 0; }
  if (level < 2 && dev === 'slit2') dev = 'slit1';
  buildExamples(); rebuild();
}
var lvBtns = document.querySelectorAll('.lv');
for (var li = 0; li < lvBtns.length; li++){
  (function(b){ b.onclick = function(){ setLevel(+b.dataset.lv); }; })(lvBtns[li]);
}

/* ---------- 돌리기 ---------- */
function loop(){
  if (running){ stepOnce(); stepOnce(); stepOnce(); }
  draw();
  if (step % 12 === 0) updateReadouts();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', function(){ fitCanvas(); });

fitCanvas();
setLevel(2);
requestAnimationFrame(loop);
</script>
