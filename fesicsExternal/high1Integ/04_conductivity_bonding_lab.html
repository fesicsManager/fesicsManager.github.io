<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전구로 알아보는 화학 결합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#2f8f9d;--teal-d:#23707b;--brass:#d98e3b;--coral:#c1443c;--ink:#1f2d33;--mute:#4f6168;--paper:#f3f6f4;--line:#d6dfdb}
*{box-sizing:border-box}
html{font-size:20px}
@media (max-width:760px){html{font-size:19px}}
@media (max-width:420px){html{font-size:18px}}
body{margin:0;color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:1rem;line-height:1.6;background-color:var(--paper);background-image:radial-gradient(rgba(47,143,157,.22) 1.2px,transparent 1.5px);background-size:24px 24px}
.wrap{width:97%;max-width:1840px;margin:0 auto;padding:1.4rem 0 3rem}
.lab-head h1{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-weight:700;font-size:1.9rem;line-height:1.25;margin:0 0 .35rem;letter-spacing:-.01em}
.lab-head p{margin:0;max-width:62ch;color:var(--mute)}
.tabs{display:flex;gap:.4rem;margin:1.3rem 0 1.1rem;border-bottom:3px solid var(--ink)}
.tab{font:inherit;font-weight:700;font-size:1rem;padding:.55rem 1.2rem;border:3px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;background:#fff;color:var(--ink);cursor:pointer;margin-bottom:-3px;transition:background .15s,color .15s,transform .1s}
.tab:hover{background:#e6f1f2;transform:translateY(-2px)}
.tab:active{transform:translateY(0) scale(.98)}
.tab.active{background:var(--ink);color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:minmax(400px,480px) minmax(0,1fr);gap:1.3rem;align-items:start}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.canvas-box{background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
#sim{display:block;width:100%;aspect-ratio:4/3}
.controls{margin-top:1rem;display:grid;gap:1rem;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.1rem}
.ctrl{display:grid;gap:.2rem}
.ctrl .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-weight:700}
.ctrl .val{font-family:'IBM Plex Mono',monospace;color:var(--teal-d);font-weight:600;white-space:nowrap}
.range-ends{display:flex;justify-content:space-between;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer;touch-action:manipulation}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#d6e4e3;border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--teal);border:3px solid var(--ink);margin-top:-10px;transition:transform .12s,background .12s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12);background:#3aa6b5}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2);background:var(--brass)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#d6e4e3;border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--teal);border:3px solid var(--ink);transition:transform .12s,background .12s}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12);background:#3aa6b5}
input[type=range]:active::-moz-range-thumb{transform:scale(1.2);background:var(--brass)}
input[type=range]:disabled{cursor:not-allowed;opacity:.45}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{font:inherit;font-size:1rem;padding:.35rem .85rem;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;transition:background .15s,color .15s,transform .1s}
.seg button:hover{background:#e6f1f2;transform:translateY(-2px)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--teal);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn{font:inherit;font-size:1rem;font-weight:700;padding:.6rem 1.25rem;border:3px solid var(--ink);border-radius:12px;background:var(--teal);color:#fff;cursor:pointer;transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#e6f1f2}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.note{color:var(--mute);margin:0}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.7rem}
.ro{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.55rem .8rem}
.ro span{display:block;color:var(--mute)}
.ro b{font-family:'IBM Plex Mono',monospace;font-size:1.35rem;font-weight:600}
.ro b.good{color:var(--teal-d)}.ro b.bad{color:var(--coral)}
.rec-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1rem 0 .6rem}
#recCount{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--mute)}
.table-wrap{max-height:20rem;overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:.45rem .6rem;text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--ink);color:#fff;font-weight:700;z-index:1;text-align:center}
tbody td{border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace}
tbody td.t{font-family:'Noto Sans KR',sans-serif;text-align:left}
tbody tr:nth-child(even){background:#f6f9f8}
.empty{background:#fff;border:3px dashed var(--coral);border-radius:14px;padding:1.4rem 1.5rem;max-width:44rem}
.empty h2{margin:0 0 .4rem;font-size:1.3rem;color:var(--coral)}
.empty p{margin:0}
.vcard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem;overflow-x:auto}
.vcard h3{margin:0 0 .5rem;font-size:1.15rem}
.vcard p{margin:.35rem 0}
.vcard table{margin:.5rem 0;border:2px solid var(--ink)}
.chart{display:block;width:100%;aspect-ratio:4/3}
b.hl{color:var(--teal-d)}
.key{display:inline-block;width:1rem;height:1rem;border-radius:4px;background:var(--c);border:2px solid var(--ink);vertical-align:-.15rem;margin:0 .3rem 0 .5rem}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#sim{aspect-ratio:1/1}</style>
</head>
<body>
<div class="wrap">
<header class="lab-head">
<h1>전구로 알아보는 화학 결합</h1>
<p>여러 물질을 고체, 녹인 액체, 수용액 상태로 바꿔 가며 전극을 꽂고 전구가 켜지는지 확인하세요. 어떤 물질이 언제 전류를 흐르게 하는지 기록해 보면 결합의 종류가 보입니다.</p>
</header>
<nav class="tabs" role="tablist">
<button class="tab active" data-tab="explore" role="tab" aria-selected="true">🔬 자유 탐구</button>
<button class="tab" data-tab="verify" role="tab" aria-selected="false">✅ 데이터 검증</button>
</nav>
<section id="tab-explore" class="panel active">
<div class="grid">
<div class="col-vis">
<div class="canvas-box"><canvas id="sim" aria-label="전기 회로와 물질 속 입자 모형"></canvas></div>
<div class="controls">

<div class="ctrl">
<div class="lbl"><span>물질</span></div>
<div class="seg" data-name="sub">
<button data-val="nacl" class="on" aria-pressed="true">염화 나트륨</button>
<button data-val="kcl" aria-pressed="false">염화 칼륨</button>
<button data-val="sugar" aria-pressed="false">설탕</button>
<button data-val="glucose" aria-pressed="false">포도당</button>
<button data-val="ethanol" aria-pressed="false">에탄올</button>
<button data-val="water" aria-pressed="false">증류수</button>
</div>
</div>
<div class="ctrl">
<div class="lbl"><span>상태</span></div>
<div class="seg" id="stateSeg"></div>
</div>
<div class="btn-row"><button class="btn" id="run">전류 흘려 보기</button></div>
<p class="note">녹는점은 실제 값입니다. 설탕은 녹는 온도에서 분해되기 시작해 녹인 액체 실험은 뺐습니다. 증류수는 이온이 아주 적어 전구를 켤 만큼의 전류가 흐르지 않습니다(수돗물은 이온이 녹아 있어 다릅니다).</p>

</div>
</div>
<div class="col-data">
<div class="readout">

<div class="ro"><span>시료</span><b id="rS" style="font-family:'Noto Sans KR',sans-serif;font-size:1.1rem">—</b></div>
<div class="ro"><span>전구</span><b id="rL">—</b></div>

</div>
<div class="rec-bar">
<button id="btnRecord" class="btn brass" disabled>기록하기</button>
<button id="btnClear" class="btn ghost">기록 지우기</button>
<span id="recCount">기록 0개</span>
</div>
<div class="table-wrap">
<table id="recTable"><thead><tr><th>#</th><th>물질</th><th>상태</th><th>전구</th></tr></thead><tbody></tbody></table>
</div>
</div>
</div>
</section>
<section id="tab-verify" class="panel">
<div id="verifyEmpty" class="empty"><h2>데이터 부족</h2><p id="needMore"></p></div>
<div id="verifyBody" class="grid" hidden>

<div class="vcard" id="vM" style="grid-column:1/-1"></div>
<div class="vcard" id="vA"></div>
<div class="vcard" id="vB"></div>

</div>
</section>
</div>
<script>

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const REC=[];
const LAB={pending:null,draw(){},row(){return[];},verify(){},onInput(){}};
function dpr(){return Math.min(window.devicePixelRatio||1,2);}
function fitCanvas(cv){const r=cv.getBoundingClientRect();const d=dpr();const w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return{ctx,W:r.width,H:r.height};}
function fmt(v,d){const k=Math.pow(10,d);return (Math.round(v*k)/k).toFixed(d);}
function animate(ms,step,done){const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/ms);step(p);if(p<1)requestAnimationFrame(f);else if(done)done();};requestAnimationFrame(f);}
function lockControls(on){$$('.controls input, .controls button, .controls select').forEach(el=>{el.disabled=on;});}
function bindSliders(){$$('input[type=range][data-out]').forEach(el=>{const out=document.getElementById(el.dataset.out);const d=el.dataset.dec!==undefined?+el.dataset.dec:null;const upd=()=>{out.textContent=d===null?el.value:Number(el.value).toFixed(d);};el.addEventListener('input',()=>{upd();LAB.onInput();});upd();});}
function bindSeg(name,cb){$$('.seg[data-name="'+name+'"] button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;$$('.seg[data-name="'+name+'"] button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});cb(b.dataset.val);LAB.onInput();}));}
function setReadout(map){Object.keys(map).forEach(k=>{const el=document.getElementById(k);if(el)el.textContent=map[k];});}
const tbody=$('#recTable tbody'),tWrap=$('.table-wrap'),btnRec=$('#btnRecord');
function updateCount(){$('#recCount').textContent='기록 '+REC.length+'개';}
function addRecord(rec){REC.push(rec);const tr=document.createElement('tr');tr.innerHTML=LAB.row(rec,REC.length).map(c=>(c!==null&&typeof c==='object')?'<td class="t">'+c.t+'</td>':'<td>'+c+'</td>').join('');tbody.appendChild(tr);updateCount();tWrap.scrollTop=tWrap.scrollHeight;}
function setPending(rec){LAB.pending=rec;btnRec.disabled=!rec;}
btnRec.addEventListener('click',()=>{if(!LAB.pending)return;addRecord(LAB.pending);setPending(null);});
$('#btnClear').addEventListener('click',()=>{REC.length=0;tbody.innerHTML='';updateCount();});
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>{x.classList.toggle('active',x===t);x.setAttribute('aria-selected',x===t);});$$('.panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+t.dataset.tab));if(t.dataset.tab==='verify')renderVerify();else requestAnimationFrame(()=>LAB.draw());}));
function renderVerify(){const n=REC.length,empty=$('#verifyEmpty'),body=$('#verifyBody');if(n<4){empty.hidden=false;body.hidden=true;$('#needMore').textContent='지금 기록은 '+n+'개예요. 자유 탐구 탭에서 '+(4-n)+'개 더 기록하면 내 데이터 분석이 열립니다.';return;}empty.hidden=true;body.hidden=false;requestAnimationFrame(()=>LAB.verify(REC));}
function niceStep(r,n){const raw=r/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function tickFmt(v,s){const d=s>=1?0:Math.min(3,Math.ceil(-Math.log10(s)-1e-9));return v.toFixed(d);}
function hasJong(w){const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;}
function fitOrigin(pts){let a=0,b=0;pts.forEach(p=>{a+=p.x*p.y;b+=p.x*p.x;});return b?a/b:0;}
function chart(cv,o){const {ctx,W,H}=fitCanvas(cv);ctx.clearRect(0,0,W,H);
const m={l:94,r:22,t:22,b:66};const x0=o.xMin||0,x1=o.xMax,y0=o.yMin||0,y1=o.yMax;
const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
ctx.lineWidth=1;ctx.strokeStyle='#e2e9e6';ctx.font='18px "IBM Plex Mono",monospace';ctx.fillStyle='#4f6168';
if(o.xTicks!==false){const sx=niceStep(x1-x0,4);ctx.textAlign='center';ctx.textBaseline='top';for(let i=Math.ceil(x0/sx-1e-9);i*sx<=x1+1e-9;i++){const v=i*sx,px=X(v);ctx.beginPath();ctx.moveTo(px,m.t);ctx.lineTo(px,H-m.b);ctx.stroke();ctx.fillText(tickFmt(v,sx),px,H-m.b+8);}}
const sy=niceStep(y1-y0,4);ctx.textAlign='right';ctx.textBaseline='middle';for(let i=Math.ceil(y0/sy-1e-9);i*sy<=y1+1e-9;i++){const v=i*sy,py=Y(v);ctx.beginPath();ctx.moveTo(m.l,py);ctx.lineTo(W-m.r,py);ctx.stroke();ctx.fillText(tickFmt(v,sy),m.l-8,py);}
ctx.strokeStyle='#1f2d33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,H-m.b);ctx.lineTo(W-m.r,H-m.b);ctx.stroke();
ctx.fillStyle='#1f2d33';ctx.font='18px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(o.xLabel||'',(m.l+W-m.r)/2,H-6);
ctx.save();ctx.translate(18,(m.t+H-m.b)/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText(o.yLabel||'',0,0);ctx.restore();
ctx.save();ctx.beginPath();ctx.rect(m.l,m.t,W-m.l-m.r,H-m.t-m.b);ctx.clip();
(o.lines||[]).forEach(l=>{ctx.strokeStyle=l.color;ctx.lineWidth=2.5;ctx.setLineDash(l.dash||[]);ctx.beginPath();ctx.moveTo(X(x0),Y(l.m*x0+(l.b||0)));ctx.lineTo(X(x1),Y(l.m*x1+(l.b||0)));ctx.stroke();});
ctx.setLineDash([]);ctx.restore();
(o.points||[]).forEach(p=>{ctx.beginPath();ctx.arc(X(p.x),Y(p.y),6.5,0,Math.PI*2);ctx.fillStyle=p.color||'#2f8f9d';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#1f2d33';ctx.stroke();});
return{ctx,X,Y,W,H,m};}
function boot(){bindSliders();updateCount();LAB.draw();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>LAB.draw());}
window.addEventListener('resize',()=>{if($('#sim').getBoundingClientRect().width<60&&$('#tab-explore').classList.contains('active'))return;if($('#tab-explore').classList.contains('active'))LAB.draw();else if(REC.length>=4)LAB.verify(REC);});


(function(){
const cv=$('#sim');
const SUB={
 nacl:{n:'염화 나트륨',type:'ion',st:{solid:'고체',liquid:'녹인 액체 (801 ℃)',aq:'수용액'}},
 kcl:{n:'염화 칼륨',type:'ion',st:{solid:'고체',liquid:'녹인 액체 (770 ℃)',aq:'수용액'}},
 sugar:{n:'설탕',type:'cov',mol:'hex',st:{solid:'고체',aq:'수용액'}},
 glucose:{n:'포도당',type:'cov',mol:'hex',st:{solid:'고체',liquid:'녹인 액체 (146 ℃)',aq:'수용액'}},
 ethanol:{n:'에탄올',type:'cov',mol:'eth',st:{liquid:'액체 (상온)',aq:'수용액'}},
 water:{n:'증류수',type:'cov',mol:'w',st:{solid:'얼음',liquid:'액체 (상온)'}}
};
const SKEYS=Object.keys(SUB);
let sub='nacl',state='solid',prog=null,res=null,parts=[];
const lit=()=>SUB[sub].type==='ion'&&state!=='solid';
const label=()=>SUB[sub].n+' '+SUB[sub].st[state];
function stateButtons(){const S=SUB[sub].st;if(!S[state])state=Object.keys(S)[0];$('#stateSeg').innerHTML=Object.keys(S).map(k=>'<button data-val="'+k+'" class="'+(k===state?'on':'')+'" aria-pressed="'+(k===state)+'">'+S[k]+'</button>').join('');}
$('#stateSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;state=b.dataset.val;stateButtons();LAB.onInput();});
bindSeg('sub',v=>{sub=v;stateButtons();});
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function makeParts(){const S=SUB[sub];const r=rnd(11+SKEYS.indexOf(sub)*37+Object.keys(S.st).indexOf(state)*7);parts=[];
 if(S.type==='ion'){
  if(state==='solid'){for(let i=0;i<7;i++)for(let j=0;j<4;j++)parts.push({k:(i+j)%2?'an':'cat',gx:i,gy:j,nx:7,ny:4,fixed:true,ph:r()*6});}
  else{for(let i=0;i<9;i++)parts.push({k:'cat',x:r(),y:r(),ph:r()*6,sp:0.6+r()});for(let i=0;i<9;i++)parts.push({k:'an',x:r(),y:r(),ph:r()*6,sp:0.6+r()});if(state==='aq')for(let i=0;i<14;i++)parts.push({k:'w',x:r(),y:r(),ph:r()*6,sp:0.6+r()});}
 }else{
  if(state==='solid'){for(let i=0;i<6;i++)for(let j=0;j<3;j++)parts.push({k:S.mol,gx:i,gy:j,nx:6,ny:3,fixed:true,ph:r()*6});}
  else{for(let i=0;i<11;i++)parts.push({k:S.mol,x:r(),y:r(),ph:r()*6,sp:0.6+r()});if(state==='aq'&&S.mol!=='w')for(let i=0;i<14;i++)parts.push({k:'w',x:r(),y:r(),ph:r()*6,sp:0.6+r()});}
 }}
function clearOut(){setReadout({rS:label(),rL:'—'});$('#rL').className='';}
LAB.onInput=()=>{prog=null;res=null;setPending(null);makeParts();clearOut();LAB.draw();};
function drawP(ctx,k,x,y){
 ctx.lineWidth=2;ctx.strokeStyle='#1f2d33';
 if(k==='cat'||k==='an'){const r=k==='cat'?10:13;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=k==='cat'?'#c1443c':'#2f8f9d';ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 18px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k==='cat'?'+':'−',x,y+1);}
 else if(k==='w'){ctx.fillStyle='#bfe0ea';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.2;ctx.stroke();[[-6,5],[6,5]].forEach(d=>{ctx.beginPath();ctx.arc(x+d[0],y+d[1],3.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();});}
 else if(k==='hex'){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;const px=x+12*Math.cos(a),py=y+12*Math.sin(a);if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle='#ecdca8';ctx.fill();ctx.stroke();}
 else if(k==='eth'){ctx.fillStyle='#d8c9e8';[-9,0,9].forEach((d,i)=>{ctx.beginPath();ctx.arc(x+d,y+(i===1?-4:3),6,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.5;ctx.stroke();});}
}
function drawParts(ctx,bx,by,bw,bh,tau,cond){
 ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();
 parts.forEach(p=>{let x,y;
  if(p.fixed){const cw=bw/(p.nx+1),ch=bh/(p.ny+1);x=bx+cw*(p.gx+1)+Math.sin(tau*14+p.ph)*1.6;y=by+ch*(p.gy+1)+Math.cos(tau*12+p.ph)*1.6;}
  else{let fx=p.x*bw+Math.sin(tau*2.2*p.sp+p.ph)*12,fy=p.y*bh+Math.cos(tau*1.8*p.sp+p.ph)*12;
   if(cond&&(p.k==='cat'||p.k==='an'))fx+=Math.max(0,tau-0.9)*70*(p.k==='cat'?-1:1);
   fx=((fx%bw)+bw)%bw;fy=Math.min(bh-14,Math.max(14,fy));x=bx+fx;y=by+fy;}
  drawP(ctx,p.k,x,y);});
 ctx.restore();}
function wire(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>{if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);});ctx.stroke();}

 else{const molten=state==='liquid'&&(S.type==='ion'||sub==='glucose');const col=molten?(S.type==='ion'?'#f6b35c':'#f3dc9a'):'rgba(191,224,234,.9)';

 ctx.strokeStyle='#4f6168';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cx-36,eTop);ctx.lineTo(cx-36,eBot);ctx.moveTo(cx+36,eTop);ctx.lineTo(cx+36,eBot);ctx.stroke();
 ctx.fillStyle='#1f2d33';ctx.font='700 18px "IBM Plex Mono",monospace';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('(−)',cx-44,eTop+18);ctx.textAlign='left';ctx.fillText('(+)',cx+44,eTop+18);
