<!doctype html>
<meta charset="utf-8">
<title>Fesics embed resize test parent</title>
<style>body{margin:0}iframe{display:block;width:100%;height:120px;border:0}</style>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const childPath = params.get('child') || '/fesicsExternal/milddle1BioGeo/01_stimulus_response_lab.html';
  const frame = document.createElement('iframe');
  const requestId = 'test-request-1';
  const heights = [];
  frame.src = childPath;
  document.body.append(frame);
  window.__embedTest = { frame, heights, requestId };
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
    if (event.data?.type !== 'fesics:embed-height' || event.data.requestId !== requestId) return;
    heights.push(event.data.height);
    frame.style.height = `${event.data.height}px`;
  });
  frame.addEventListener('load', () => {
    frame.contentWindow.postMessage({ type: 'fesics:embed-init', requestId }, location.origin);
  });
</script>
</body>
